<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Финансы</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600&family=Unbounded:wght@300;400;600&display=swap" rel="stylesheet">
<style>
/* Финансы: тот же внешний вид, что у «Колеса жизни» (те же цвета, шрифты, кнопки). Тема берётся из настроек главного сайта. */
:root{
  --bg:#FFFFFF; --surface:#FFFFFF; --soft:#F4F5F8; --soft-2:#ECEEF3; --ink:#14171F; --muted:#737B8A; --line:#E4E7ED;
  --shadow:rgba(40,55,90,.18); --accent:#14171F; --on-accent:#FFFFFF; --danger:#C4352B; --faint:#A3AAB6; --ok-bg:#E3F6E8; --ok-fg:#1F6B3A; --warn-bg:#FFF3DC; --warn-fg:#7A4B00;
  /* два цвета графика: долги и накопления; проверены на различимость в обеих темах */
  --s-debt:#EB6834; --s-save:#2A78D6; --grid:#ECEEF3;
  --fz:1; --display:"Unbounded","Onest",system-ui,sans-serif; --body:"Onest",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
:root[data-ui="dark"]{
  --bg:#101216; --surface:#171A20; --soft:#1F232B; --soft-2:#2A2F39; --ink:#ECEEF3; --muted:#8D95A5; --line:#2A2F39;
  --shadow:rgba(0,0,0,.6); --accent:#ECEEF3; --on-accent:#14171F; --danger:#FF7B70; --faint:#69707F; --ok-bg:#15301F; --ok-fg:#8FD9A8; --warn-bg:#33270F; --warn-fg:#F2C56B;
  --s-debt:#D95926; --s-save:#3987E5; --grid:#232831;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:calc(14px*var(--fz));line-height:1.4}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
::placeholder{color:var(--muted);opacity:1}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.app{max-width:1180px;margin:0 auto;padding:16px clamp(16px,2.2vw,36px) 56px;display:grid;grid-template-columns:minmax(0,1fr);gap:22px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px 20px;flex-wrap:wrap}
.brand-w{position:relative}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--display);font-size:calc(16px*var(--fz));letter-spacing:-.01em;white-space:nowrap;border:0;background:none;padding:6px 10px 6px 6px;margin:-6px -10px -6px -6px;border-radius:14px;color:var(--ink)}
.brand:hover,.brand[aria-expanded="true"]{background:var(--soft)}
.brand svg{width:24px;height:24px}
.brand .car{font-family:var(--body);font-size:calc(11px*var(--fz));color:var(--muted)}
.menu{position:absolute;top:calc(100% + 12px);left:-6px;z-index:30;width:min(300px,calc(100vw - 32px));background:var(--surface);border:1px solid var(--line);border-radius:20px;box-shadow:0 24px 60px -16px var(--shadow);padding:10px;display:grid;gap:2px}
.menu a{display:grid;padding:9px 12px;border-radius:12px;text-decoration:none;font-weight:600}
.menu a:hover{background:var(--soft)}
.menu a small{font-weight:400;color:var(--muted);font-size:calc(12px*var(--fz))}
.menu a[aria-current]{background:var(--soft)}
.tabs,.seg{display:flex;gap:4px;background:var(--soft);border-radius:999px;padding:4px;max-width:100%;min-width:0;overflow-x:auto;scrollbar-width:none}
.tabs button,.seg button{flex:none}
.tabs::-webkit-scrollbar,.seg::-webkit-scrollbar{display:none}
.tabs button,.seg button{border:0;background:none;border-radius:999px;padding:8px 18px;font-weight:500;color:var(--muted);white-space:nowrap}
.seg button{padding:6px 12px;font-size:calc(13px*var(--fz))}
.tabs button[aria-selected="true"],.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 2px 8px -2px var(--shadow)}
.top-r{display:flex;align-items:center;gap:8px}
.fact{border:0;background:none;font-size:calc(11px*var(--fz));color:var(--faint);padding:4px 6px;border-radius:8px;white-space:nowrap;font-variant-numeric:tabular-nums}
.fact.bad{color:var(--danger)}
.btn{border:0;border-radius:999px;background:var(--accent);color:var(--on-accent);padding:9px 16px;font-weight:500;font-size:calc(13px*var(--fz));white-space:nowrap;text-decoration:none;display:inline-block}
.btn.ghost{background:var(--soft);color:var(--ink)}
.btn:disabled{opacity:.45;cursor:default}
.ib{border:0;background:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:calc(16px*var(--fz));line-height:1;color:var(--muted);flex:none}
.ib:hover{background:var(--soft);color:var(--ink)}
.inp{border:1px solid var(--line);border-radius:10px;padding:7px 10px;background:var(--surface);color:var(--ink);min-width:0;width:100%}
.inp.num{text-align:right;font-variant-numeric:tabular-nums}
select.inp{padding-right:6px}
.note{color:var(--muted);font-size:calc(13px*var(--fz));margin:0;max-width:70ch}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
h1,h2,h3{margin:0;font-weight:400}
h2{font-family:var(--display);font-size:calc(20px*var(--fz));letter-spacing:-.02em}
h3{font-weight:600;font-size:calc(14px*var(--fz))}
#view{display:grid;grid-template-columns:minmax(0,1fr);gap:28px}
.sec{display:grid;grid-template-columns:minmax(0,1fr);gap:12px}
.sec>.note{margin-top:-6px}
/* плитки с главными числами */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.tile{border:1px solid var(--line);border-radius:22px;padding:16px 18px;display:grid;gap:4px;align-content:start;min-width:0}
.tile .lab{color:var(--muted);font-size:calc(12px*var(--fz))}
.tile .val{font-family:var(--display);font-size:calc(26px*var(--fz));letter-spacing:-.03em;line-height:1.15;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.tile .sub{color:var(--muted);font-size:calc(12px*var(--fz));font-variant-numeric:tabular-nums}
.tile.neg .val{color:var(--danger)}
.banner{border-radius:16px;padding:12px 16px;background:var(--warn-bg);color:var(--warn-fg);font-size:calc(13px*var(--fz))}
.banner b{font-weight:600}
.box{border:1px solid var(--line);border-radius:22px;padding:16px;display:grid;gap:10px;align-content:start;min-width:0}
.box-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px;font-weight:600}
.box-h small{font-weight:400;color:var(--muted);font-variant-numeric:tabular-nums}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,460px),1fr));gap:14px;align-items:start}
/* строки списков: название и числа */
.rows{display:grid;gap:6px}
.r{display:grid;gap:6px;align-items:center}
.r.c2{grid-template-columns:minmax(0,1fr) 124px 30px}
.r.c4{grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) 76px minmax(0,1fr) 30px}
.r.g4{grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) minmax(0,1fr) 128px 30px}
.r.hd{color:var(--muted);font-size:calc(11px*var(--fz));padding:0 2px}
.r.hd span:not(:first-child){text-align:right}
.r.hd span.l{text-align:left}
.bar{height:6px;border-radius:99px;background:var(--soft-2);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:var(--s-save)}
.gline{display:grid;gap:4px;padding:0 2px 6px;font-size:calc(12px*var(--fz));color:var(--muted);font-variant-numeric:tabular-nums}
/* настройки плана */
.opts{display:grid;gap:0;border-top:1px solid var(--line)}
.opt{display:flex;align-items:center;justify-content:space-between;gap:10px 20px;flex-wrap:wrap;padding:12px 0;border-bottom:1px solid var(--line)}
.opt>span:first-child{display:grid;gap:2px;flex:1 1 260px}
.opt small{color:var(--muted);font-size:calc(12px*var(--fz));font-variant-numeric:tabular-nums}
.opt .ctl{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.opt .inp{width:130px}
input[type=range]{accent-color:var(--ink);width:170px}
/* таблицы */
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:9px 10px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left;padding-left:2px;white-space:normal}
th{font-weight:400;color:var(--muted);font-size:calc(12px*var(--fz))}
td small{color:var(--muted);display:block;font-size:calc(11px*var(--fz));white-space:normal}
tr.tot td{font-weight:600;border-bottom:0}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:7px;vertical-align:1px}
.dot.d{background:var(--s-debt)}.dot.s{background:var(--s-save)}
/* график */
.chart{position:relative}
.chart svg{display:block;width:100%;height:260px;overflow:visible}
.chart .ax{font-size:11px;fill:var(--muted);font-family:var(--body)}
.chart .lb{font-size:12px;fill:var(--ink);font-family:var(--body);font-weight:500}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:calc(12px*var(--fz));color:var(--muted)}
.legend i{display:inline-block;width:14px;height:2px;border-radius:2px;margin-right:6px;vertical-align:middle}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);border-radius:10px;padding:7px 10px;font-size:12px;white-space:nowrap;z-index:5;display:grid;gap:2px;font-variant-numeric:tabular-nums}
.tip b{font-weight:600}
details>summary{cursor:pointer;color:var(--muted);font-size:calc(13px*var(--fz));padding:4px 0}
/* события плана */
.evs{list-style:none;margin:0;padding:0;display:grid;gap:0}
.evs li{display:grid;grid-template-columns:96px minmax(0,1fr);gap:12px;padding:9px 2px;border-bottom:1px solid var(--line)}
.evs li>span:first-child{color:var(--muted);font-variant-numeric:tabular-nums}
.tag{display:inline-block;border-radius:99px;padding:1px 8px;font-size:calc(11px*var(--fz));background:var(--soft);color:var(--muted);margin-left:6px}
.tag.ok{background:var(--ok-bg);color:var(--ok-fg)}.tag.bad{background:var(--warn-bg);color:var(--warn-fg)}
.r3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;font-variant-numeric:tabular-nums}
.r3 div{display:grid;gap:2px}.r3 small{color:var(--muted);font-size:calc(11px*var(--fz))}
.r3 div:nth-child(2){text-align:center}.r3 div:nth-child(3){text-align:right}
.rule{display:grid;grid-template-columns:minmax(0,1fr) 30px;gap:6px}
.side{display:grid;gap:8px;border:1px solid var(--line);border-radius:18px;padding:12px}
.side .g{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}
.side label,.fld{display:grid;gap:4px;font-size:calc(11px*var(--fz));color:var(--muted)}
.side label .inp,.fld .inp{font-size:calc(14px*var(--fz));color:var(--ink)}
.lf{display:grid;gap:3px;min-width:0}
.lf>span{display:none;font-size:11px;color:var(--muted)}
.side .ft{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;font-variant-numeric:tabular-nums}
.swt{flex:none;width:40px;height:24px;border-radius:99px;border:0;background:var(--soft-2);padding:3px;display:inline-flex}
.swt i{width:18px;height:18px;border-radius:50%;background:var(--surface);box-shadow:0 1px 3px var(--shadow);transition:transform .15s}
.swt[aria-checked="true"]{background:var(--accent)}
.swt[aria-checked="true"] i{transform:translateX(16px);background:var(--on-accent)}
.swl{display:inline-flex;align-items:center;gap:8px;font-size:calc(13px*var(--fz));color:var(--ink)}
.mform{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.empty{border:1px dashed var(--line);border-radius:22px;padding:26px 22px;display:grid;gap:10px;justify-items:start}
.empty ol{margin:0;padding-left:20px;display:grid;gap:4px;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--bg);border-radius:12px;padding:10px 16px;font-size:calc(13px*var(--fz));z-index:70;max-width:calc(100% - 32px)}
#sy-dlg{position:fixed;inset:0;z-index:900;background:color-mix(in oklab,var(--ink) 38%,transparent);display:grid;place-items:center;padding:20px 16px;overflow:auto}
.sy-db{width:min(400px,100%);background:var(--surface);border-radius:20px;padding:18px 18px 16px;display:grid;gap:10px;box-shadow:0 24px 60px -24px var(--shadow)}
.sy-db p{margin:0;color:var(--muted);font-size:calc(13px*var(--fz));line-height:1.45}
.sy-db .inp{font-size:16px}
.sy-dmsg{min-height:1.4em;color:var(--danger)!important}
.sy-dmsg.soft{color:var(--muted)!important}
.sy-alt{color:var(--muted);font-size:calc(12px*var(--fz));text-underline-offset:2px}
/* траты по дням */
.row.between{justify-content:space-between}
.ctl{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.ctl .inp{width:auto}
.chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 13px;font-size:calc(13px*var(--fz));font-weight:500;color:var(--ink);white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.chip.add{border-style:dashed;color:var(--muted);font-weight:400}
.chip i{font-style:normal;opacity:.6;margin-left:2px}
.chips .inp{width:170px}
.addrow{display:grid;grid-template-columns:150px minmax(0,1fr) auto;gap:8px}
.addrow .inp.num{font-size:calc(16px*var(--fz));font-weight:500}
.sp-l{display:grid;border-top:1px solid var(--line)}
.sp-e{display:grid;grid-template-columns:auto minmax(0,1fr) auto 30px;gap:10px;align-items:center;padding:8px 2px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.sp-e .nt{color:var(--muted);font-size:calc(13px*var(--fz));overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sp-e.tot{border-bottom:0;font-weight:600}
.tagc{border-radius:99px;padding:2px 9px;background:var(--soft);font-size:calc(12px*var(--fz));white-space:nowrap}
.dayl{display:grid;border-top:1px solid var(--line)}
.dayr{display:grid;grid-template-columns:64px minmax(40px,1fr) 104px 96px;gap:10px;align-items:center;padding:9px 2px;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;color:var(--ink);font-variant-numeric:tabular-nums;width:100%}
button.dayr:hover{background:var(--soft)}
.dayr[aria-current="true"]{background:var(--soft)}
.dayr.cat{grid-template-columns:minmax(90px,150px) minmax(40px,1fr) 104px 56px}
.dayr .dn small{color:var(--muted);font-size:calc(11px*var(--fz))}
.dayr .db{position:relative;height:8px;border-radius:99px;background:var(--soft-2)}
.dayr .db i{display:block;height:100%;border-radius:99px;background:var(--s-save)}
.dayr .db u{position:absolute;top:-4px;width:2px;height:16px;border-radius:2px;background:var(--ink);transform:translateX(-1px)}
.dayr .dsum{text-align:right}
.dayr .tag{margin:0;justify-self:end}
@media (max-width:640px){
  .addrow{grid-template-columns:minmax(0,1fr) auto}
  .addrow .inp.num{grid-column:1}
  .addrow #sp-n{grid-column:1/-1;grid-row:2}
  .dayr{grid-template-columns:44px minmax(30px,1fr) 78px 80px;gap:8px}
  .dayr.cat{grid-template-columns:minmax(70px,104px) minmax(30px,1fr) 78px 44px}
  .ctl .inp[type=date]{max-width:150px}
  .tabs{order:3;width:100%}
  .tabs button{padding:8px 13px}
  .tile .val{font-size:calc(22px*var(--fz))}
  .lf>span{display:block}
  .r.c4{grid-template-columns:minmax(0,1.25fr) minmax(0,.8fr) minmax(0,1fr) 30px;grid-template-areas:"n n n x" "b a m m"}
  .r.c4>:nth-child(1){grid-area:n}.r.c4>:nth-child(2){grid-area:b}.r.c4>:nth-child(3){grid-area:a}.r.c4>:nth-child(4){grid-area:m}.r.c4>:nth-child(5){grid-area:x}
  .r.g4{grid-template-columns:minmax(0,1fr) minmax(0,1fr) 30px;grid-template-areas:"n n x" "t s s" "d d d";align-items:end}
  .r.c4{align-items:end}
  .r.c4>:nth-child(5),.r.g4>:nth-child(5){align-self:start}
  .side label .inp,.fld .inp{font-size:16px}
  .r.g4>:nth-child(1){grid-area:n}.r.g4>:nth-child(2){grid-area:t}.r.g4>:nth-child(3){grid-area:s}.r.g4>:nth-child(4){grid-area:d}.r.g4>:nth-child(5){grid-area:x}
  .r.hd{display:none}
  .r.c4,.r.g4{padding-bottom:8px;border-bottom:1px solid var(--line)}
  .inp{font-size:16px}
  th,td{padding:8px 6px}
  table.fit th,table.fit td{white-space:normal}
  table.fit td:first-child{min-width:104px}
  .chart svg{height:220px}
}
@media (prefers-reduced-motion:reduce){.swt i{transition:none}}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand-w" id="brand-w">
      <button type="button" class="brand" id="brand" aria-haspopup="true" aria-expanded="false" title="Мои сайты">
        <svg viewBox="0 0 28 28" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="14" cy="14" r="11"/><path d="M8 17.5l4-4 3 3 5-6"/></svg>
        Финансы <span class="car">▾</span>
      </button>
      <div class="menu" id="menu" hidden>
        <a href="index.html">Колесо жизни<small>календарь, привычки, цели, дневник</small></a>
        <a href="finansy.html" aria-current="page">Финансы<small>траты по дням, накопления, долги</small></a>
      </div>
    </div>
    <nav class="tabs" id="tabs" role="tablist" aria-label="Разделы"></nav>
    <div class="top-r"><button type="button" class="fact" id="st-pill"></button><button type="button" class="btn ghost" id="sy-in" hidden>Войти</button></div>
  </header>
  <main id="view"></main>
</div>
<div class="toast" id="toast" role="status" hidden></div>
<script>
(function(){
  'use strict';
  var LSK='lw-fin1',SEED=null;
  /* ---------- расчёты: всё здесь чистая арифметика по числам пользователя ---------- */
  function num(v){v=+v;return isFinite(v)?v:0}
  function list(o){return Object.keys(o||{}).map(function(id){var x=o[id];x.id=id;return x}).sort(function(a,b){return(a.o||0)-(b.o||0)})}
  function mKey(d){return d.getFullYear()+'-'+(d.getMonth()<9?'0':'')+(d.getMonth()+1)}
  function mAddK(k,n){var y=+k.slice(0,4),m=+k.slice(5)-1+n;return mKey(new Date(y+Math.floor(m/12),((m%12)+12)%12,1))}
  function mDiff(a,b){return(+b.slice(0,4)-+a.slice(0,4))*12+(+b.slice(5)-+a.slice(5))}
  /* ---- траты по дням ---- */
  function p2(n){return(n<10?'0':'')+n}
  function dKey(d){return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate())}
  function dimK(k){return new Date(+k.slice(0,4),+k.slice(5,7),0).getDate()}
  function daySum(f,dk){var s=0,o=(f.days||{})[dk]||{};Object.keys(o).forEach(function(id){s+=num(o[id].a)});return s}
  function spendPlanM(f,mk){return Math.max(0,num((f.spend||{}).day))*dimK(mk)}
  /* сводка месяца: план на прошедшие дни, сколько потрачено и разница. Плюс: запас, минус: перерасход.
     today — сегодняшний день «ГГГГ-ММ-ДД»; для прошлых месяцев считается весь месяц, для будущих ничего */

  var spD=TODAY,spCat='',spNewCat=false,spEdit=false,WD=['вс','пн','вт','ср','чт','пт','сб'],MG=['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];

      (spNewCat?'<span class="row"><input class="inp keep" id="sp-newcat" maxlength="24" placeholder="Новая категория" aria-label="Новая категория"><button type="button" class="btn ghost" data-act="catok">Добавить</button></span>':'<button type="button" class="chip add" data-act="catnew">+ категория</button>'+(cats.length?'<button type="button" class="chip add" data-act="catedit" aria-pressed="'+spEdit+'">'+(spEdit?'Готово':'Убрать лишние')+'</button>':''))+'</div>'+

      (ids.length?'<div class="sp-l">'+ids.map(function(id){var e=o[id];return '<div class="sp-e"><span class="tagc">'+esc(e.c||'Другое')+'</span><span class="nt">'+esc(e.n||'')+'</span><b>'+money(e.a)+'</b><button type="button" class="ib" data-spdel="'+id+'" aria-label="Удалить трату">×</button></div>'}).join('')+'<div class="sp-e tot"><span>Всего за день</span><span></span><b>'+money(ds)+'</b><span></span></div></div>':'<p class="note">'+(isT?'За сегодня трат пока нет. Выбери категорию, впиши сумму и нажми «Добавить».':'За этот день трат нет.')+'</p>')+'</section>';

    /* дни месяца */
    var last=curM?M.upto:mk<TODAY.slice(0,7)?M.n:0,mx=lim;M.days.forEach(function(d){if(d.sum>mx)mx=d.sum});mx=mx||1;

    h+='<section class="sec"><div class="row between"><h2>Дни: '+mName(mk)+'</h2><span class="ctl"><button type="button" class="ib" data-mon="-1" aria-label="Предыдущий месяц">‹</button><button type="button" class="ib" data-mon="1" aria-label="Следующий месяц"'+(curM||mk>TODAY.slice(0,7)?' disabled':'')+'>›</button></span></div>'+

      (rows?'<div class="dayl">'+rows+'</div>'+(M.s0>1&&M.s0<=M.n?'<p class="note">Счёт идёт с '+M.s0+'-го числа: это первый день, за который записаны траты.</p>':''):'<p class="note">За этот месяц трат не записано.</p>')+'</section>';
    if(M.cats.length){var ct=0;M.cats.forEach(function(c){ct+=c.a});
      h+='<section class="sec"><h2>На что ушло за '+mName(mk)+'</h2><div class="dayl">'+M.cats.map(function(c){return '<div class="dayr cat"><span class="dn">'+esc(c.n)+'</span><span class="db"><i style="width:'+(c.a/(M.cats[0].a||1)*100).toFixed(1)+'%"></i></span><span class="dsum">'+money(c.a)+'</span><span class="tag">'+(ct?Math.round(c.a/ct*100):0)+'%</span></div>'}).join('')+'</div></section>'}
    return h;
  }

  /* расходы месяца по факту: обязательные платежи плюс то, что записано во вкладке «Траты»; если трат нет, берётся план */
  function factExp(k){var m=spendMonth(F,k,TODAY);return expOf(F)+(m.all>0?m.all:spendPlanM(F,k))}
  function unapply(r){if(!r)return;Object.keys(r.paid||{}).forEach(function(id){if(F.debts[id])F.debts[id].bal=num(F.debts[id].bal)+num(r.paid[id])});Object.keys(r.saved||{}).forEach(function(id){if(F.goals[id])F.goals[id].saved=Math.max(0,num(F.goals[id].saved)-num(r.saved[id]))})}
  function apply(r){Object.keys(r.paid||{}).forEach(function(id){if(F.debts[id])F.debts[id].bal=Math.max(0,num(F.debts[id].bal)-num(r.paid[id]))});Object.keys(r.saved||{}).forEach(function(id){if(F.goals[id])F.goals[id].saved=num(F.goals[id].saved)+num(r.saved[id])})}
  function totals(){var d=0,s=0;list(F.debts).forEach(function(x){d+=Math.max(0,num(x.bal))});list(F.goals).forEach(function(x){s+=Math.max(0,num(x.saved))});return{d:d,s:s}}
  var draft={};
  function renderMonths(){
    var r=recOf(recM),R=finPlan(F,{now:NOW}),row=(recM===NOW&&R.months[0])||{pay:{},save:{}},opts='',db=list(F.debts),gl=list(F.goals);
    for(var i=0;i>-13;i--){var k=mAddK(NOW,i);opts+='<option value="'+k+'"'+(k===recM?' selected':'')+'>'+mName(k)+(recOf(k)?' · записан':'')+'</option>'}
    function dv(key,fb){return draft[key]!=null?draft[key]:fb}
    function dIn(key,fb,ph,lab){var v=num(dv(key,fb));return '<input class="inp num" id="d-'+key+'" data-d="'+key+'" inputmode="decimal" autocomplete="off" value="'+(v?money(v,1):'')+'" placeholder="'+ph+'" aria-label="'+esc(lab)+'">'}
    var h='<section class="sec"><div class="row between"><h2>Итог месяца</h2><select class="inp" id="rec-m" style="width:auto" aria-label="Месяц">'+opts+'</select></div>'+
      '<p class="note">Запиши, что было на самом деле. Остатки долгов уменьшатся на платежи, накопления по целям вырастут, а план пересчитается от новых чисел.'+(r?' Этот месяц уже записан: новая запись заменит старую.':'')+'</p>'+
      '<div class="mform"><label class="fld">Доход за месяц'+dIn('inc',r?r.inc:0,money(R.income,1),'Доход за месяц')+'</label><label class="fld">Расходы за месяц'+dIn('exp',r?r.exp:0,money(factExp(recM),1),'Расходы за месяц')+'</label></div>'+
      (db.length?'<h3>Заплатил по долгам</h3><div class="mform">'+db.map(function(d){return '<label class="fld">'+esc(d.n||'Долг')+dIn('p.'+d.id,r&&r.paid?r.paid[d.id]:0,row.pay[d.id]?money(row.pay[d.id],1):'0','Заплатил: '+(d.n||'долг'))+'</label>'}).join('')+'</div>':'')+
      (gl.length?'<h3>Отложил в цели</h3><div class="mform">'+gl.map(function(g){return '<label class="fld">'+esc(g.n||'Цель')+dIn('s.'+g.id,r&&r.saved?r.saved[g.id]:0,row.save[g.id]?money(row.save[g.id],1):'0','Отложил: '+(g.n||'цель'))+'</label>'}).join('')+'</div>':'')+
      '<label class="fld">Заметка<input class="inp" id="d-note" data-d="note" data-s="1" maxlength="200" value="'+esc(dv('note',r?r.note:'')||'')+'" placeholder="Что получилось, что помешало"></label>'+
      '<div class="row"><button type="button" class="btn" data-act="rec">'+(r?'Заменить запись':'Записать месяц')+'</button>'+(recM===NOW&&R.months[0]?'<button type="button" class="btn ghost" data-act="fill">Подставить план</button>':'')+'</div></section>';
    var ks=Object.keys(F.months).sort().reverse();
    if(ks.length){
      var pts=ks.slice().reverse().map(function(k){var x=F.months[k];return{k:mName(k,1),debt:num(x.debtAfter),saved:num(x.savedAfter)}});
      CH.fact=pts.length>1?{pts:pts,debt:pts.some(function(p){return p.debt>0}),saved:pts.some(function(p){return p.saved>0})}:null;
      h+='<section class="sec"><h2>Как шло</h2>'+(CH.fact?(CH.fact.debt&&CH.fact.saved?'<div class="legend"><span><i style="background:var(--s-debt)"></i>Долги</span><span><i style="background:var(--s-save)"></i>Накопления</span></div>':'')+'<div class="chart" id="ch-fact"></div>':'')+
        '<div class="tw"><table><thead><tr><th>Месяц</th><th>Доход</th><th>Расходы</th><th>На долги</th><th>В цели</th><th>Долг после</th><th>Накоплено</th><th></th></tr></thead><tbody>'+
        ks.map(function(k){var x=F.months[k];return '<tr><td>'+mName(k)+(x.note?'<small>'+esc(x.note)+'</small>':'')+'</td><td>'+money(x.inc)+'</td><td>'+money(x.exp)+'</td><td>'+money(sumO(x.paid))+'</td><td>'+money(sumO(x.saved))+'</td><td>'+money(x.debtAfter)+'</td><td>'+money(x.savedAfter)+'</td><td><button type="button" class="btn ghost" data-act="delrec" data-k="'+k+'">'+(askDel===k?'Точно удалить?':'Удалить')+'</button></td></tr>'}).join('')+'</tbody></table></div>'+
        '<p class="note">Удаление записи возвращает суммы обратно: долг вырастет на платёж, накопления уменьшатся.</p></section>';
    }else CH.fact=null;
    return h;
  }
  function recSave(){
    var old=recOf(recM),r={inc:0,exp:0,paid:{},saved:{},note:'',at:Date.now()};
    function g(key,fb){return draft[key]!=null?draft[key]:fb}
    r.inc=num(g('inc',old?old.inc:0));r.exp=num(g('exp',old?old.exp:0));r.note=String(g('note',old?old.note:'')||'').slice(0,200);
    list(F.debts).forEach(function(d){var v=num(g('p.'+d.id,old&&old.paid?old.paid[d.id]:0));if(v>0)r.paid[d.id]=v});
    list(F.goals).forEach(function(x){var v=num(g('s.'+x.id,old&&old.saved?old.saved[x.id]:0));if(v>0)r.saved[x.id]=v});
    if(!r.inc&&!r.exp&&!Object.keys(r.paid).length&&!Object.keys(r.saved).length){toast('Впиши хотя бы одну сумму.');return}
    unapply(old);apply(r);var t=totals();r.debtAfter=t.d;r.savedAfter=t.s;F.months[recM]=r;draft={};save();render();
    toast(mName(recM)+' записан: остатки долгов и накопления обновлены.');
  }

  /* ---------- график: линии по месяцам, перекрестие и подсказка под пальцем ---------- */
  var CH={plan:null,fact:null};
  function drawChart(id,c){
    var el=$(id);if(!el||!c||c.pts.length<2)return;
    var W=el.clientWidth||600,svgH=window.innerWidth<=640?220:260,L=48,Rt=18,T=14,B=26,pts=c.pts,n=pts.length,mx=0;
    pts.forEach(function(p){if(c.debt)mx=Math.max(mx,p.debt);if(c.saved)mx=Math.max(mx,p.saved)});
    var step=Math.pow(10,Math.floor(Math.log(mx||1)/Math.LN10)),tk=mx/step<=2?step/2:mx/step<=5?step:step*2,top=Math.ceil((mx||1)/tk)*tk;
    function X(i){return L+(W-L-Rt)*(n>1?i/(n-1):0)}function Y(v){return T+(svgH-T-B)*(1-v/top)}
    function path(key){return pts.map(function(p,i){return(i?'L':'M')+X(i).toFixed(1)+' '+Y(p[key]).toFixed(1)}).join(' ')}
    var g='';for(var v=0;v<=top+0.5;v+=tk)g+='<line x1="'+L+'" x2="'+(W-Rt)+'" y1="'+Y(v).toFixed(1)+'" y2="'+Y(v).toFixed(1)+'" stroke="var(--grid)" stroke-width="1"/><text class="ax" x="'+(L-8)+'" y="'+(Y(v)+4).toFixed(1)+'" text-anchor="end">'+shortM(v)+'</text>';
    /* подписи месяцев идут с ровным шагом */
    var xs=Math.max(1,Math.ceil((n-1)/(W<520?3:6))),xl='';for(var i=0;i<n;i+=xs)xl+='<text class="ax" x="'+X(i).toFixed(1)+'" y="'+(svgH-6)+'" text-anchor="'+(i===0?'start':i===n-1?'end':'middle')+'">'+esc(pts[i].k)+'</text>';
    var s='<svg viewBox="0 0 '+W+' '+svgH+'" role="img" aria-label="График по месяцам; те же числа есть в таблице ниже">'+g+xl+
      (c.debt?'<path d="'+path('debt')+'" fill="none" stroke="var(--s-debt)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>':'')+
      (c.saved?'<path d="'+path('saved')+'" fill="none" stroke="var(--s-save)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>':'')+
      '<g id="'+id+'-h" visibility="hidden"><line id="'+id+'-x" y1="'+T+'" y2="'+(svgH-B)+'" stroke="var(--muted)" stroke-width="1"/>'+(c.debt?'<circle id="'+id+'-d" r="5" fill="var(--s-debt)" stroke="var(--surface)" stroke-width="2"/>':'')+(c.saved?'<circle id="'+id+'-s" r="5" fill="var(--s-save)" stroke="var(--surface)" stroke-width="2"/>':'')+'</g>'+
      '<rect x="'+L+'" y="0" width="'+(W-L-Rt)+'" height="'+svgH+'" fill="transparent" id="'+id+'-r"/></svg><div class="tip" id="'+id+'-t" hidden></div>';
    el.innerHTML=s;
    var r=$(id+'-r'),hg=$(id+'-h'),tp=$(id+'-t');
    function at(e){
      var b=r.getBoundingClientRect(),cx=(e.touches?e.touches[0].clientX:e.clientX)-b.left,i=Math.max(0,Math.min(n-1,Math.round(cx/b.width*(n-1)))),p=pts[i],x=X(i);
      hg.setAttribute('visibility','visible');$(id+'-x').setAttribute('x1',x);$(id+'-x').setAttribute('x2',x);
      if(c.debt){$(id+'-d').setAttribute('cx',x);$(id+'-d').setAttribute('cy',Y(p.debt))}
      if(c.saved){$(id+'-s').setAttribute('cx',x);$(id+'-s').setAttribute('cy',Y(p.saved))}
      tp.innerHTML='<b>'+esc(p.k)+'</b>'+(c.debt?'<span><i class="dot d"></i>Долги: '+money(p.debt)+'</span>':'')+(c.saved?'<span><i class="dot s"></i>Накопления: '+money(p.saved)+'</span>':'');
      tp.hidden=false;var tw=tp.offsetWidth,sc=el.clientWidth/W,lx=x*sc+12;if(lx+tw>el.clientWidth)lx=x*sc-tw-12;tp.style.left=Math.max(0,lx)+'px';tp.style.top='6px';
    }
    function off(){hg.setAttribute('visibility','hidden');tp.hidden=true}
    r.addEventListener('mousemove',at);r.addEventListener('mouseleave',off);r.addEventListener('touchstart',at,{passive:true});r.addEventListener('touchmove',at,{passive:true});r.addEventListener('touchend',off);
  }

  /* ---------- сборка страницы ---------- */
  var TABS=[['spend','Траты'],['plan','План'],['money','Деньги'],['sides','Доп. источники'],['months','Месяцы']];
  function render(){
    var a=document.activeElement,id=a&&a.id,ss=null,se=null,kept={};try{ss=a.selectionStart;se=a.selectionEnd}catch(_){}
    /* недописанное в полях ввода траты переживает перерисовку (например, когда приходят записи с другого устройства) */
    [].forEach.call(view.querySelectorAll('.keep'),function(x){if(x.id&&x.value)kept[x.id]=x.value});
    $('tabs').innerHTML=TABS.map(function(t){return '<button type="button" role="tab" data-tab="'+t[0]+'" aria-selected="'+(tab===t[0])+'">'+t[1]+'</button>'}).join('');
    CH.plan=null;
    view.innerHTML=tab==='money'?renderMoney():tab==='sides'?renderSides():tab==='months'?renderMonths():tab==='plan'?renderPlan():renderSpend();
    Object.keys(kept).forEach(function(k){var x=$(k);if(x)x.value=kept[k]});
    if(tab==='plan')drawChart('ch-plan',CH.plan);if(tab==='months')drawChart('ch-fact',CH.fact);
    if(id&&id.indexOf('-')>0){var n=$(id);if(n&&n!==document.activeElement){n.focus();try{if(ss!=null&&n.type!=='range'&&n.type!=='month')n.setSelectionRange(ss,se)}catch(_){}}}
  }
  function setTab(t,push){tab=t;askDel='';render();window.scrollTo(0,0);if(push!==false)try{history.pushState({tab:t},'','#'+t)}catch(_){}}
  window.addEventListener('popstate',function(e){var t=(e.state&&e.state.tab)||(location.hash||'').slice(1);setTab(TABS.some(function(x){return x[0]===t})?t:'spend',false)});
  $('tabs').addEventListener('click',function(e){var b=e.target.closest('[data-tab]');if(b)setTab(b.dataset.tab)});
  view.addEventListener('change',function(e){
    var t=e.target,p=t.dataset.p;
    if(t.id==='rec-m'){recM=t.value;draft={};render();return}
    if(t.id==='sp-date'){if(/^\d{4}-\d\d-\d\d$/.test(t.value)&&t.value<=TODAY){spD=t.value;render()}return}
    if(t.id==='imp-file'&&t.files[0]){var fr=new FileReader();fr.onload=function(){try{var o=JSON.parse(String(fr.result));if(!isO(o)||o.v!==1)throw 0;F=norm(o);save();render();toast('Записи загружены из файла.')}catch(_){toast('Это не файл записей «Финансов».')}};fr.readAsText(t.files[0]);t.value='';return}
    if(t.dataset.d){draft[t.dataset.d]=t.dataset.s?t.value:parseNum(t.value);if(!t.dataset.s)t.value=draft[t.dataset.d]?money(draft[t.dataset.d],1):'';return}
    if(!p)return;
    if(t.dataset.t==='num'){setP(p,parseNum(t.value));save();render()}
    else{setP(p,t.value.trim());save();if(t.tagName==='SELECT'||t.type==='month')render()}
  });
  view.addEventListener('keydown',function(e){
    if(e.key!=='Enter')return;var id=e.target.id;
    if(id==='sp-a'||id==='sp-n'){e.preventDefault();spAdd()}else if(id==='sp-newcat'){e.preventDefault();spCatAdd()}
  });
  view.addEventListener('input',function(e){var t=e.target;if(t.type==='range'&&$('split-l'))$('split-l').textContent=t.value+'% на долги, '+(100-t.value)+'% в цели'});
  var ADD={inc:function(){return{n:'',a:0}},exp:function(){return{n:'',a:0}},debts:function(){return{n:'',bal:0,apr:0,min:0}},goals:function(){return{n:'',target:0,saved:0,due:''}},sides:function(){return{n:'',st:'idea',inc:0,cost:0,start:0,note:'',inPlan:0}}};
  view.addEventListener('click',function(e){
    var t=e.target,b;
    if((b=t.closest('[data-go]'))){setTab(b.dataset.go);return}
    if((b=t.closest('[data-cat]'))){
      var cn=b.dataset.cat;
      if(spEdit){list(F.cats).forEach(function(c){if(c.n===cn)delete F.cats[c.id]});save();if(!catList().length)spEdit=false;render();return}
      spCat=cn;try{localStorage.setItem(LSK+'-cat',cn)}catch(_){}render();var sa=$('sp-a');if(sa)sa.focus();return}
    if((b=t.closest('[data-spdel]'))){var dd=F.days[spD];if(dd){delete dd[b.dataset.spdel];if(!Object.keys(dd).length)delete F.days[spD]}save();render();return}
    if((b=t.closest('[data-day]'))){var dn=+b.dataset.day,nd=dn===0?TODAY:dShift(spD,dn);if(nd<=TODAY){spD=nd;render()}return}
    if((b=t.closest('[data-mon]'))){var nm=mAddK(spD.slice(0,7),+b.dataset.mon);if(nm<=TODAY.slice(0,7)){spD=nm===TODAY.slice(0,7)?TODAY:nm+'-'+p2(dimK(nm));render()}return}
    if((b=t.closest('[data-pick]'))){spD=b.dataset.pick;render();window.scrollTo({top:0,behavior:'smooth'});return}
    if((b=t.closest('[data-add]'))){var c=b.dataset.add,id=nid(c.charAt(0)),o=ADD[c](),mx=0;list(F[c]).forEach(function(x){mx=Math.max(mx,x.o||0)});o.o=mx+1;F[c][id]=o;save();render();var f=$('i-'+c+'.'+id+'.n');if(f)f.focus();return}
    if((b=t.closest('[data-del]'))){delP(b.dataset.del);save();render();return}
    if((b=t.closest('.seg [data-p]'))){setP(b.dataset.p,b.dataset.v);save();render();return}
    if((b=t.closest('[data-sw]'))){setP(b.dataset.sw,getP(b.dataset.sw)?0:1);save();render();return}
    if(!(b=t.closest('[data-act]')))return;
    var a=b.dataset.act;
    if(a==='rec')recSave();
    else if(a==='spadd')spAdd();
    else if(a==='catnew'){spNewCat=true;spEdit=false;render();var ci=$('sp-newcat');if(ci)ci.focus()}
    else if(a==='catok')spCatAdd();
    else if(a==='catedit'){spEdit=!spEdit;render()}
    else if(a==='fill'){var R=finPlan(F,{now:NOW}),row=R.months[0];if(row){draft.inc=R.income;draft.exp=Math.round(factExp(recM));Object.keys(row.pay).forEach(function(id){draft['p.'+id]=Math.round(row.pay[id])});Object.keys(row.save).forEach(function(id){draft['s.'+id]=Math.round(row.save[id])});render()}}
    else if(a==='delrec'){var k=b.dataset.k;if(askDel!==k){askDel=k;render();return}askDel='';unapply(F.months[k]);delete F.months[k];save();render();toast('Запись удалена, суммы возвращены.')}
    else if(a==='exp'){try{var u=URL.createObjectURL(new Blob([JSON.stringify(F)],{type:'application/json'})),l=document.createElement('a');l.href=u;l.download='finansy-'+NOW+'.json';document.body.appendChild(l);l.click();l.remove()}catch(_){toast('Не получилось сохранить файл.')}}
    else if(a==='imp')$('imp-file').click();
  });
  /* меню слева сверху: переход между своими сайтами */
  var menu=$('menu'),brand=$('brand');
  brand.addEventListener('click',function(){menu.hidden=!menu.hidden;brand.setAttribute('aria-expanded',!menu.hidden)});
  document.addEventListener('click',function(e){if(!menu.hidden&&!e.target.closest('#brand-w')){menu.hidden=true;brand.setAttribute('aria-expanded','false')}});
  document.addEventListener('keydown',function(e){if(e.key==='Escape'&&!menu.hidden){menu.hidden=true;brand.setAttribute('aria-expanded','false')}});
  /* тема и размер текста берутся из настроек главного сайта, чтобы оба сайта выглядели одинаково */
  function theme(){
    var ui={};try{ui=((JSON.parse(localStorage.getItem('lw-data3')||'null')||{}).set||{}).ui||{}}catch(_){}
    var dark=ui.theme==='dark'||(ui.theme==='auto'&&!!window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches);
    document.documentElement.setAttribute('data-ui',dark?'dark':'light');
    if(typeof ui.fz==='number'&&ui.fz>=.8&&ui.fz<=1.4)document.documentElement.style.setProperty('--fz',ui.fz);
  }
  /* строка состояния справа сверху */
  function pill(){
    var p=$('st-pill'),s=fsLine();
    p.textContent=saveErr?'Не сохранено':s||(savedAt?'Сохранено '+hm(savedAt):'Автосохранение включено');p.classList.toggle('bad',saveErr||fsBad());
    $('sy-in').hidden=!fsCanLogin();
  }
  function hm(t){var d=new Date(t);return(d.getHours()<10?'0':'')+d.getHours()+':'+(d.getMinutes()<10?'0':'')+d.getMinutes()}
  var rsT;window.addEventListener('resize',function(){clearTimeout(rsT);rsT=setTimeout(function(){if(tab==='plan')drawChart('ch-plan',CH.plan);if(tab==='months')drawChart('ch-fact',CH.fact)},150)});
  window.addEventListener('storage',function(e){if(e.key==='lw-data3')theme();if(e.key===LSK&&e.newValue){try{F=norm(JSON.parse(e.newValue));render()}catch(_){}}if(e.key==='lw-data3-sy')fsBoot()});
  $('sy-in').onclick=function(){syDlgOpen(false)};
  $('st-pill').onclick=function(){if(fsCanLogin())syDlgOpen(false)};
  function dayTick(){var t=dKey(new Date());if(t===TODAY)return;if(spD===TODAY)spD=t;TODAY=t;NOW=mKey(new Date());render()}
  setInterval(dayTick,60000);document.addEventListener('visibilitychange',function(){if(!document.hidden)dayTick()});
  theme();
  var h0=(location.hash||'').slice(1);if(TABS.some(function(x){return x[0]===h0}))tab=h0;
  try{history.replaceState({tab:tab},'','#'+tab)}catch(_){}
  render();pill();fsBoot();
})();
</script>
</body>
