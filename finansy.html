<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Финансы</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600&family=Unbounded:wght@300;400;600&display=swap" rel="stylesheet">
<style>
/* Финансы: тот же внешний вид, что у «Колеса жизни» (те же цвета, шрифты, кнопки). Тема берётся из настроек главного сайта. */
:root{
  --bg:#FFFFFF; --surface:#FFFFFF; --soft:#F4F5F8; --soft-2:#ECEEF3; --ink:#14171F; --muted:#737B8A; --line:#E4E7ED;
  --shadow:rgba(40,55,90,.18); --accent:#14171F; --on-accent:#FFFFFF; --danger:#C4352B; --faint:#A3AAB6; --ok-bg:#E3F6E8; --ok-fg:#1F6B3A; --warn-bg:#FFF3DC; --warn-fg:#7A4B00;
  /* два цвета графика: долги и накопления; проверены на различимость в обеих темах */
  --s-debt:#EB6834; --s-save:#2A78D6; --grid:#ECEEF3;
  --fz:1; --display:"Unbounded","Onest",system-ui,sans-serif; --body:"Onest",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
:root[data-ui="dark"]{
  --bg:#101216; --surface:#171A20; --soft:#1F232B; --soft-2:#2A2F39; --ink:#ECEEF3; --muted:#8D95A5; --line:#2A2F39;
  --shadow:rgba(0,0,0,.6); --accent:#ECEEF3; --on-accent:#14171F; --danger:#FF7B70; --faint:#69707F; --ok-bg:#15301F; --ok-fg:#8FD9A8; --warn-bg:#33270F; --warn-fg:#F2C56B;
  --s-debt:#D95926; --s-save:#3987E5; --grid:#232831;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:calc(14px*var(--fz));line-height:1.4}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
::placeholder{color:var(--muted);opacity:1}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.app{max-width:1180px;margin:0 auto;padding:16px clamp(16px,2.2vw,36px) 56px;display:grid;grid-template-columns:minmax(0,1fr);gap:22px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px 20px;flex-wrap:wrap}
.brand-w{position:relative}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--display);font-size:calc(16px*var(--fz));letter-spacing:-.01em;white-space:nowrap;border:0;background:none;padding:6px 10px 6px 6px;margin:-6px -10px -6px -6px;border-radius:14px;color:var(--ink)}
.brand:hover,.brand[aria-expanded="true"]{background:var(--soft)}
.brand svg{width:24px;height:24px}
.brand .car{font-family:var(--body);font-size:calc(11px*var(--fz));color:var(--muted)}
.menu{position:absolute;top:calc(100% + 12px);left:-6px;z-index:30;width:min(300px,calc(100vw - 32px));background:var(--surface);border:1px solid var(--line);border-radius:20px;box-shadow:0 24px 60px -16px var(--shadow);padding:10px;display:grid;gap:2px}
.menu a{display:grid;padding:9px 12px;border-radius:12px;text-decoration:none;font-weight:600}
.menu a:hover{background:var(--soft)}
.menu a small{font-weight:400;color:var(--muted);font-size:calc(12px*var(--fz))}
.menu a[aria-current]{background:var(--soft)}
.tabs,.seg{display:flex;gap:4px;background:var(--soft);border-radius:999px;padding:4px;max-width:100%;min-width:0;overflow-x:auto;scrollbar-width:none}
.tabs button,.seg button{flex:none}
.tabs::-webkit-scrollbar,.seg::-webkit-scrollbar{display:none}
.tabs button,.seg button{border:0;background:none;border-radius:999px;padding:8px 18px;font-weight:500;color:var(--muted);white-space:nowrap}
.seg button{padding:6px 12px;font-size:calc(13px*var(--fz))}
.tabs button[aria-selected="true"],.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 2px 8px -2px var(--shadow)}
.top-r{display:flex;align-items:center;gap:8px}
.fact{border:0;background:none;font-size:calc(11px*var(--fz));color:var(--faint);padding:4px 6px;border-radius:8px;white-space:nowrap;font-variant-numeric:tabular-nums}
.fact.bad{color:var(--danger)}
.btn{border:0;border-radius:999px;background:var(--accent);color:var(--on-accent);padding:9px 16px;font-weight:500;font-size:calc(13px*var(--fz));white-space:nowrap;text-decoration:none;display:inline-block}
.btn.ghost{background:var(--soft);color:var(--ink)}
.btn:disabled{opacity:.45;cursor:default}
.ib{border:0;background:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:calc(16px*var(--fz));line-height:1;color:var(--muted);flex:none}
.ib:hover{background:var(--soft);color:var(--ink)}
.inp{border:1px solid var(--line);border-radius:10px;padding:7px 10px;background:var(--surface);color:var(--ink);min-width:0;width:100%}
.inp.num{text-align:right;font-variant-numeric:tabular-nums}
select.inp{padding-right:6px}
.note{color:var(--muted);font-size:calc(13px*var(--fz));margin:0;max-width:70ch}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
h1,h2,h3{margin:0;font-weight:400}
h2{font-family:var(--display);font-size:calc(20px*var(--fz));letter-spacing:-.02em}
h3{font-weight:600;font-size:calc(14px*var(--fz))}
#view{display:grid;grid-template-columns:minmax(0,1fr);gap:28px}
.sec{display:grid;grid-template-columns:minmax(0,1fr);gap:12px}
.sec>.note{margin-top:-6px}
/* плитки с главными числами */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.tile{border:1px solid var(--line);border-radius:22px;padding:16px 18px;display:grid;gap:4px;align-content:start;min-width:0}
.tile .lab{color:var(--muted);font-size:calc(12px*var(--fz))}
.tile .val{font-family:var(--display);font-size:calc(26px*var(--fz));letter-spacing:-.03em;line-height:1.15;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.tile .sub{color:var(--muted);font-size:calc(12px*var(--fz));font-variant-numeric:tabular-nums}
.tile.neg .val{color:var(--danger)}
.banner{border-radius:16px;padding:12px 16px;background:var(--warn-bg);color:var(--warn-fg);font-size:calc(13px*var(--fz))}
.banner b{font-weight:600}
.box{border:1px solid var(--line);border-radius:22px;padding:16px;display:grid;gap:10px;align-content:start;min-width:0}
.box-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px;font-weight:600}
.box-h small{font-weight:400;color:var(--muted);font-variant-numeric:tabular-nums}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,460px),1fr));gap:14px;align-items:start}
/* строки списков: название и числа */
.rows{display:grid;gap:6px}
.r{display:grid;gap:6px;align-items:center}
.r.c2{grid-template-columns:minmax(0,1fr) 124px 30px}
.r.c4{grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) 76px minmax(0,1fr) 30px}
.r.g4{grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) minmax(0,1fr) 128px 30px}
.r.hd{color:var(--muted);font-size:calc(11px*var(--fz));padding:0 2px}
.r.hd span:not(:first-child){text-align:right}
.r.hd span.l{text-align:left}
.bar{height:6px;border-radius:99px;background:var(--soft-2);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:var(--s-save)}
.gline{display:grid;gap:4px;padding:0 2px 6px;font-size:calc(12px*var(--fz));color:var(--muted);font-variant-numeric:tabular-nums}
/* настройки плана */
.opts{display:grid;gap:0;border-top:1px solid var(--line)}
.opt{display:flex;align-items:center;justify-content:space-between;gap:10px 20px;flex-wrap:wrap;padding:12px 0;border-bottom:1px solid var(--line)}
.opt>span:first-child{display:grid;gap:2px;flex:1 1 260px}
.opt small{color:var(--muted);font-size:calc(12px*var(--fz));font-variant-numeric:tabular-nums}
.opt .ctl{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.opt .inp{width:130px}
input[type=range]{accent-color:var(--ink);width:170px}
/* таблицы */
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:9px 10px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left;padding-left:2px;white-space:normal}
th{font-weight:400;color:var(--muted);font-size:calc(12px*var(--fz))}
td small{color:var(--muted);display:block;font-size:calc(11px*var(--fz));white-space:normal}
tr.tot td{font-weight:600;border-bottom:0}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:7px;vertical-align:1px}
.dot.d{background:var(--s-debt)}.dot.s{background:var(--s-save)}
/* график */
.chart{position:relative}
.chart svg{display:block;width:100%;height:260px;overflow:visible}
.chart .ax{font-size:11px;fill:var(--muted);font-family:var(--body)}
.chart .lb{font-size:12px;fill:var(--ink);font-family:var(--body);font-weight:500}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:calc(12px*var(--fz));color:var(--muted)}
.legend i{display:inline-block;width:14px;height:2px;border-radius:2px;margin-right:6px;vertical-align:middle}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);border-radius:10px;padding:7px 10px;font-size:12px;white-space:nowrap;z-index:5;display:grid;gap:2px;font-variant-numeric:tabular-nums}
.tip b{font-weight:600}
details>summary{cursor:pointer;color:var(--muted);font-size:calc(13px*var(--fz));padding:4px 0}
/* события плана */
.evs{list-style:none;margin:0;padding:0;display:grid;gap:0}
.evs li{display:grid;grid-template-columns:96px minmax(0,1fr);gap:12px;padding:9px 2px;border-bottom:1px solid var(--line)}
.evs li>span:first-child{color:var(--muted);font-variant-numeric:tabular-nums}
.tag{display:inline-block;border-radius:99px;padding:1px 8px;font-size:calc(11px*var(--fz));background:var(--soft);color:var(--muted);margin-left:6px}
.tag.ok{background:var(--ok-bg);color:var(--ok-fg)}.tag.bad{background:var(--warn-bg);color:var(--warn-fg)}
.r3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;font-variant-numeric:tabular-nums}
.r3 div{display:grid;gap:2px}.r3 small{color:var(--muted);font-size:calc(11px*var(--fz))}
.r3 div:nth-child(2){text-align:center}.r3 div:nth-child(3){text-align:right}
.rule{display:grid;grid-template-columns:minmax(0,1fr) 30px;gap:6px}
.side{display:grid;gap:8px;border:1px solid var(--line);border-radius:18px;padding:12px}
.side .g{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}
.side label,.fld{display:grid;gap:4px;font-size:calc(11px*var(--fz));color:var(--muted)}
.side label .inp,.fld .inp{font-size:calc(14px*var(--fz));color:var(--ink)}
.lf{display:grid;gap:3px;min-width:0}
.lf>span{display:none;font-size:11px;color:var(--muted)}
.side .ft{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;font-variant-numeric:tabular-nums}
.swt{flex:none;width:40px;height:24px;border-radius:99px;border:0;background:var(--soft-2);padding:3px;display:inline-flex}
.swt i{width:18px;height:18px;border-radius:50%;background:var(--surface);box-shadow:0 1px 3px var(--shadow);transition:transform .15s}
.swt[aria-checked="true"]{background:var(--accent)}
.swt[aria-checked="true"] i{transform:translateX(16px);background:var(--on-accent)}
.swl{display:inline-flex;align-items:center;gap:8px;font-size:calc(13px*var(--fz));color:var(--ink)}
.mform{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.empty{border:1px dashed var(--line);border-radius:22px;padding:26px 22px;display:grid;gap:10px;justify-items:start}
.empty ol{margin:0;padding-left:20px;display:grid;gap:4px;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--bg);border-radius:12px;padding:10px 16px;font-size:calc(13px*var(--fz));z-index:70;max-width:calc(100% - 32px)}
#sy-dlg{position:fixed;inset:0;z-index:900;background:color-mix(in oklab,var(--ink) 38%,transparent);display:grid;place-items:center;padding:20px 16px;overflow:auto}
.sy-db{width:min(400px,100%);background:var(--surface);border-radius:20px;padding:18px 18px 16px;display:grid;gap:10px;box-shadow:0 24px 60px -24px var(--shadow)}
.sy-db p{margin:0;color:var(--muted);font-size:calc(13px*var(--fz));line-height:1.45}
.sy-db .inp{font-size:16px}
.sy-dmsg{min-height:1.4em;color:var(--danger)!important}
.sy-dmsg.soft{color:var(--muted)!important}
.sy-alt{color:var(--muted);font-size:calc(12px*var(--fz));text-underline-offset:2px}
/* траты по дням */
.row.between{justify-content:space-between}
.ctl{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.ctl .inp{width:auto}
.chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 13px;font-size:calc(13px*var(--fz));font-weight:500;color:var(--ink);white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.chip.add{border-style:dashed;color:var(--muted);font-weight:400}
.chip i{font-style:normal;opacity:.6;margin-left:2px}
.chips .inp{width:170px}
.addrow{display:grid;grid-template-columns:150px minmax(0,1fr) auto;gap:8px}
.addrow .inp.num{font-size:calc(16px*var(--fz));font-weight:500}
.sp-l{display:grid;border-top:1px solid var(--line)}
.sp-e{display:grid;grid-template-columns:auto minmax(0,1fr) auto 30px;gap:10px;align-items:center;padding:8px 2px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.sp-e .nt{color:var(--muted);font-size:calc(13px*var(--fz));overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sp-e.tot{border-bottom:0;font-weight:600}
.tagc{border-radius:99px;padding:2px 9px;background:var(--soft);font-size:calc(12px*var(--fz));white-space:nowrap}
.dayl{display:grid;border-top:1px solid var(--line)}
.dayr{display:grid;grid-template-columns:64px minmax(40px,1fr) 104px 96px;gap:10px;align-items:center;padding:9px 2px;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;color:var(--ink);font-variant-numeric:tabular-nums;width:100%}
button.dayr:hover{background:var(--soft)}
.dayr[aria-current="true"]{background:var(--soft)}
.dayr.cat{grid-template-columns:minmax(90px,150px) minmax(40px,1fr) 104px 56px}
.dayr .dn small{color:var(--muted);font-size:calc(11px*var(--fz))}
.dayr .db{position:relative;height:8px;border-radius:99px;background:var(--soft-2)}
.dayr .db i{display:block;height:100%;border-radius:99px;background:var(--s-save)}
.dayr .db u{position:absolute;top:-4px;width:2px;height:16px;border-radius:2px;background:var(--ink);transform:translateX(-1px)}
.dayr .dsum{text-align:right}
.dayr .tag{margin:0;justify-self:end}
@media (max-width:640px){
  .addrow{grid-template-columns:minmax(0,1fr) auto}
  .addrow .inp.num{grid-column:1}
  .addrow #sp-n{grid-column:1/-1;grid-row:2}
  .dayr{grid-template-columns:44px minmax(30px,1fr) 78px 80px;gap:8px}
  .dayr.cat{grid-template-columns:minmax(70px,104px) minmax(30px,1fr) 78px 44px}
  .ctl .inp[type=date]{max-width:150px}
  .tabs{order:3;width:100%}
  .tabs button{padding:8px 13px}
  .tile .val{font-size:calc(22px*var(--fz))}
  .lf>span{display:block}
  .r.c4{grid-template-columns:minmax(0,1.25fr) minmax(0,.8fr) minmax(0,1fr) 30px;grid-template-areas:"n n n x" "b a m m"}
  .r.c4>:nth-child(1){grid-area:n}.r.c4>:nth-child(2){grid-area:b}.r.c4>:nth-child(3){grid-area:a}.r.c4>:nth-child(4){grid-area:m}.r.c4>:nth-child(5){grid-area:x}
  .r.g4{grid-template-columns:minmax(0,1fr) minmax(0,1fr) 30px;grid-template-areas:"n n x" "t s s" "d d d";align-items:end}
  .r.c4{align-items:end}
  .r.c4>:nth-child(5),.r.g4>:nth-child(5){align-self:start}
  .side label .inp,.fld .inp{font-size:16px}
  .r.g4>:nth-child(1){grid-area:n}.r.g4>:nth-child(2){grid-area:t}.r.g4>:nth-child(3){grid-area:s}.r.g4>:nth-child(4){grid-area:d}.r.g4>:nth-child(5){grid-area:x}
  .r.hd{display:none}
  .r.c4,.r.g4{padding-bottom:8px;border-bottom:1px solid var(--line)}
  .inp{font-size:16px}
  th,td{padding:8px 6px}
  table.fit th,table.fit td{white-space:normal}
  table.fit td:first-child{min-width:104px}
  .chart svg{height:220px}
}
@media (prefers-reduced-motion:reduce){.swt i{transition:none}}

/* выписка банка */
.bk-in{display:flex;align-items:center;gap:8px 14px;flex-wrap:wrap}
.lnk{border:0;background:none;padding:0;color:var(--muted);text-decoration:underline;text-underline-offset:2px;font-size:calc(13px*var(--fz))}
.lnk:hover{color:var(--ink)}
.bk-how{border:1px solid var(--line);border-radius:16px;padding:12px 14px;display:grid;gap:6px}
.bk-how p{margin:0;font-size:calc(13px*var(--fz));line-height:1.45}
#bk-dlg{position:fixed;inset:0;z-index:800;background:color-mix(in oklab,var(--ink) 38%,transparent);display:grid;place-items:center;padding:20px 16px}
.bk-db{width:min(780px,100%);max-height:calc(100vh - 40px);max-height:calc(100dvh - 40px);background:var(--surface);border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:10px;box-shadow:0 24px 60px -24px var(--shadow);min-height:0}
.bk-db .box-h{display:flex;justify-content:space-between;align-items:center;font-weight:600;font-size:calc(16px*var(--fz))}
.bk-list{flex:1 1 auto;min-height:120px;overflow:auto;border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin:0 -18px;padding:0 18px;overscroll-behavior:contain}
.bk-day{display:flex;justify-content:space-between;align-items:baseline;padding:12px 2px 6px;font-weight:600;position:sticky;top:0;background:var(--surface);z-index:1;font-variant-numeric:tabular-nums}
.bk-day small{color:var(--muted);font-weight:500}
.bk-r{display:grid;grid-template-columns:auto minmax(0,1fr) 160px 96px;gap:10px;align-items:center;padding:7px 2px;border-bottom:1px solid var(--line);cursor:pointer}
.bk-r input[type=checkbox]{width:18px;height:18px;accent-color:var(--accent);margin:0}
.bk-r.off .bk-d b,.bk-r.off .bk-a{color:var(--muted)}
.bk-r.off .bk-a{text-decoration:line-through;text-decoration-color:var(--faint)}
.bk-r select{padding:5px 6px;font-size:calc(13px*var(--fz))}
.bk-d{display:grid;min-width:0}
.bk-d b{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bk-d small{color:var(--muted);font-size:calc(12px*var(--fz));overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bk-a{font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap;text-align:right}
.bk-tag{border-radius:99px;padding:1px 7px;background:var(--soft);margin-left:2px;white-space:nowrap}
.bk-tag.warn{background:var(--warn-bg);color:var(--warn-fg)}
.bk-tag.ok{background:var(--ok-bg);color:var(--ok-fg)}
.bk-more{border:0;background:none;padding:12px 2px;color:var(--muted);text-align:left;width:100%;font-size:calc(13px*var(--fz))}
.bk-foot{gap:8px}
.bk-db>.note,.bk-db>.banner{margin:0}
.bk-err{color:var(--danger);margin:0}
.bk-wait{margin:0;color:var(--muted)}
html.bk-lock body{overflow:hidden}
html.bk-drop #view{outline:2px dashed var(--muted);outline-offset:8px;border-radius:18px}
@media (max-width:640px){
  .bk-db{padding:14px}
  .bk-list{margin:0 -14px;padding:0 14px}
  .bk-r{grid-template-columns:auto minmax(0,1fr) auto}
  .bk-r select{grid-column:2/-1;grid-row:2}
}
.bk-files{display:grid;gap:2px}
.bk-files .bk-err{font-size:inherit}
.bk-bank{font-style:normal;font-weight:600;color:var(--ink)}
.bk-cov{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:baseline;font-size:calc(13px*var(--fz))}
.bk-cb{white-space:normal}
.bk-cb small{color:var(--muted)}
.lnk.bad{color:var(--danger)}

/* плашка «вышла новая версия» */
.upd-bar{position:fixed;left:50%;bottom:72px;transform:translateX(-50%);z-index:950;display:flex;gap:12px;align-items:center;background:var(--ink);color:var(--bg);border-radius:14px;padding:7px 7px 7px 16px;font-size:13px;box-shadow:0 12px 32px -12px rgba(0,0,0,.4);max-width:calc(100% - 32px)}
.upd-bar button{border:0;border-radius:10px;padding:6px 12px;background:var(--bg);color:var(--ink);font:inherit;font-weight:600;cursor:pointer}
/* сводка месяца (27.10) */
.sum-strip{display:flex;justify-content:space-between;align-items:center;gap:6px 14px;flex-wrap:wrap;border:1px solid var(--line);border-radius:16px;padding:10px 14px;font-size:calc(13px*var(--fz));color:var(--muted);font-variant-numeric:tabular-nums}
.sum-strip .lnk{color:var(--ink)}
.sum-eq{display:grid;gap:0;border-top:1px solid var(--line);font-variant-numeric:tabular-nums}
.sum-eq>div{display:flex;justify-content:space-between;gap:12px;padding:9px 2px;border-bottom:1px solid var(--line)}
.sum-eq>div>span{color:var(--muted)}
.sum-eq .tot span{color:var(--ink);font-weight:600}
.sum-eq .tot b{font-family:var(--display);font-size:calc(18px*var(--fz));font-weight:400}
.sum-eq b.neg{color:var(--danger)}.sum-eq b.pos{color:var(--ok-fg)}
.sum-l{list-style:none;margin:0;padding:0;display:grid}
.sum-l li{display:flex;align-items:center;justify-content:space-between;gap:8px 14px;flex-wrap:wrap;padding:10px 2px;border-bottom:1px solid var(--line);font-size:calc(13px*var(--fz));line-height:1.45;font-variant-numeric:tabular-nums}
.sum-l li>span:first-child{flex:1 1 300px;min-width:0}
.sum-l li.ask{background:var(--warn-bg);border-radius:12px;padding:10px 12px;border:0;margin-bottom:4px;color:var(--warn-fg)}
.sum-l.pays li>span:first-child{flex:1 1 200px;color:var(--muted)}
.bk-who{display:inline-flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.bk-who button{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:5px 11px;font-size:calc(12px*var(--fz));font-weight:500;white-space:nowrap}
.bk-who button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.box .opt.cc-min{border-top:1px solid var(--line)}
.cc-add{grid-template-columns:150px minmax(0,1fr) auto}
.sp-e .nt .ho{display:inline-block;border-radius:99px;padding:0 7px;background:var(--warn-bg);color:var(--warn-fg);font-size:calc(11px*var(--fz))}
.bk-files{display:grid;gap:4px}
.bk-f{display:flex;justify-content:space-between;align-items:center;gap:4px 12px;flex-wrap:wrap;font-size:calc(13px*var(--fz));color:var(--muted)}
.bk-f b{color:var(--ink);font-weight:600}
.bk-cr{display:inline-flex;align-items:center;gap:6px;white-space:nowrap;color:var(--ink)}
.bk-cr input{width:16px;height:16px;accent-color:var(--accent);margin:0}
.bk-r.fl{cursor:default}
.bk-ic{width:18px;text-align:center;color:var(--muted);font-weight:600}
.bk-d .bk-who{margin-top:6px}
.bk-due{display:block;width:100%;background:var(--warn-bg);color:var(--warn-fg);border-radius:12px;padding:8px 12px;font-size:calc(13px*var(--fz))}
@media (max-width:640px){
  .cc-add{grid-template-columns:minmax(0,1fr) auto}
  .cc-add select{grid-column:1/-1;grid-row:2}
  .sum-eq .tot b{font-size:calc(16px*var(--fz))}
}
.r.fix .fixl{display:grid;gap:1px;font-size:calc(14px*var(--fz));padding-left:2px}
.r.fix .fixl small{color:var(--muted);font-size:calc(12px*var(--fz))}
/* ---- деньги: компактные строки, кредитки карточками (27.10) ---- */
.btn.sm{padding:6px 12px;font-size:calc(12px*var(--fz))}
.inp.sm{padding:5px 8px;font-size:calc(13px*var(--fz))}
.kv{display:grid}
.kv-r{display:grid;grid-template-columns:minmax(0,1fr) 120px 30px;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
.kv-r:last-child{border-bottom:0}
.kv-r>span:first-child{display:grid;gap:1px;font-size:calc(14px*var(--fz));min-width:0}
.kv-r>span:first-child small{color:var(--muted);font-size:calc(11.5px*var(--fz))}
.kv-r .inp{padding:6px 9px}
.kv-r.ro b{text-align:right;font-weight:500;font-variant-numeric:tabular-nums;padding-right:10px}
.box-f{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:baseline}
.box-f .lnk{color:var(--ink);text-decoration:none;font-weight:500}
.box-f .lnk:hover{text-decoration:underline}
.box-f .note{margin:0;font-size:calc(12px*var(--fz))}
.rec{display:grid;gap:2px;background:var(--soft);border-radius:14px;padding:8px 10px}
.rec-h{font-size:calc(12px*var(--fz));color:var(--muted);padding:2px 2px 4px}
.rec-r{display:grid;grid-template-columns:minmax(0,1fr) auto auto 30px;gap:8px;align-items:center;font-variant-numeric:tabular-nums}
.rec-r>span{display:grid;min-width:0;font-size:calc(13px*var(--fz))}
.rec-r>span small{color:var(--muted);font-size:calc(11px*var(--fz))}
.rec-r b{font-weight:500;font-size:calc(13px*var(--fz))}
.dsec{gap:12px}
.dtop{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr));gap:8px}
.ds-i{display:grid;gap:3px;align-content:start;background:var(--soft);border-radius:14px;padding:10px 12px;min-width:0}
.ds-i>span{font-size:calc(12px*var(--fz));color:var(--muted)}
.ds-i>b{font-family:var(--display);font-weight:400;font-size:calc(18px*var(--fz));letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.ds-i>b small{font-family:var(--body,inherit);font-size:calc(12px*var(--fz));color:var(--muted);letter-spacing:0}
.ds-i>small{font-size:calc(11.5px*var(--fz));color:var(--muted);line-height:1.35}
.ds-i>small b{color:var(--ink);font-weight:600}
.ds-i .inp{background:var(--surface)}
.ds-i .lnk{justify-self:start;font-size:calc(12px*var(--fz));color:var(--ink)}
.ds-n{margin:0}
.dcs{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,330px),1fr));gap:10px}
.dc{border:1px solid var(--line);border-radius:16px;padding:12px 14px;display:grid;gap:8px;align-content:start;min-width:0}
.dc.soon{border-color:var(--warn-fg);box-shadow:0 0 0 1px var(--warn-bg) inset}
.dc-t{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.dc-h{border:0;background:none;padding:0;text-align:left;display:grid;gap:2px;color:var(--ink);min-width:0;cursor:pointer}
.dc-h b{font-weight:600;font-size:calc(15px*var(--fz))}
.dc-h small{color:var(--muted);font-size:calc(12px*var(--fz))}
.dc-b{font-family:var(--display);font-size:calc(20px*var(--fz));letter-spacing:-.02em;white-space:nowrap;font-variant-numeric:tabular-nums}
.dc-p{display:flex;justify-content:space-between;gap:4px 10px;flex-wrap:wrap;font-size:calc(13px*var(--fz));font-variant-numeric:tabular-nums}
.dc-p small,.dc-pd{color:var(--muted);font-size:calc(12px*var(--fz))}
.dc-p .tag{margin:0 4px 0 0}
.dc-i{margin:0;font-size:calc(12px*var(--fz));color:var(--muted);font-variant-numeric:tabular-nums}
.dc-l{display:grid;gap:4px;font-size:calc(12px*var(--fz));color:var(--muted);font-variant-numeric:tabular-nums}
.bar.lm i{background:var(--s-debt)}
.dc-a{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.dc-a .lnk{color:var(--ink)}
.dc-pay{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 8px;align-items:center}
.dc-pay small{grid-column:1/-1;color:var(--muted);font-size:calc(11.5px*var(--fz))}
.dc-f{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 10px;border-top:1px solid var(--line);padding-top:10px}
.lf2{display:grid;gap:3px;min-width:0}
.lf2>span{font-size:calc(11.5px*var(--fz));color:var(--muted)}
.lf2 .seg{justify-self:start}
.dc-x{display:flex;align-items:center;gap:2px;align-self:end;color:var(--muted);font-size:calc(12px*var(--fz))}
.pay-rem{display:flex;justify-content:space-between;align-items:center;gap:8px 14px;flex-wrap:wrap;background:var(--warn-bg);color:var(--warn-fg);border-radius:16px;padding:10px 14px;font-size:calc(13px*var(--fz));line-height:1.45}
.pay-rem small{opacity:.85}
.lim-f{display:flex;flex-wrap:wrap;gap:4px 12px;padding:8px 2px 10px;font-size:calc(12px*var(--fz));color:var(--muted);font-variant-numeric:tabular-nums;border-bottom:1px solid var(--line)}
.lim-f b{color:var(--ink);font-weight:600}
.cl{display:grid;border-top:1px solid var(--line)}
.cl-r{display:grid;grid-template-columns:minmax(90px,150px) minmax(40px,1fr) 150px 92px;gap:6px 12px;align-items:center;padding:9px 2px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.cl-n{font-size:calc(14px*var(--fz));min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cl-b{position:relative;height:8px;border-radius:99px;background:var(--soft-2)}
.cl-b i{display:block;height:100%;border-radius:99px;background:var(--s-save)}
.cl-b u{position:absolute;top:-4px;width:2px;height:16px;border-radius:2px;background:var(--ink);transform:translateX(-1px)}
.cl-r.warn .cl-b i{background:#E0A526}
.cl-r.over .cl-b i{background:var(--danger)}
.cl-a{display:grid;text-align:right;font-weight:500}
.cl-a small{font-weight:400;color:var(--muted);font-size:calc(11.5px*var(--fz))}
.cl-r.over .cl-a small{color:var(--danger)}
.cl-p{justify-self:end;text-align:right}
.cl-p small{color:var(--muted);font-size:calc(11px*var(--fz))}
.cl-p .tag{margin:0}
.cl-e{grid-column:1/-1;display:flex;justify-content:flex-end}
.cl-e .inp{max-width:160px}
.sp-e .nt .fx{display:inline-block;border-radius:99px;padding:0 7px;background:var(--soft-2);color:var(--muted);font-size:calc(11px*var(--fz))}
.fx-n{color:var(--muted);font-weight:400;font-size:calc(11.5px*var(--fz))}
.bk-fee{display:grid;gap:2px;background:var(--warn-bg);color:var(--warn-fg);border-radius:12px;padding:10px 12px;font-size:calc(12.5px*var(--fz));line-height:1.4;font-variant-numeric:tabular-nums}
.bk-fee b{font-weight:600;font-size:calc(13px*var(--fz))}
.bk-fee small{opacity:.85;margin-top:2px}
.sum-l li.fee{color:var(--warn-fg)}
.rec .btn.ghost{background:var(--surface);border:1px solid var(--line)}
/* ---- календарь «факт / план» (29.10) ---- */
:root{--cal-bg:#E4E7ED;--cal-o:rgba(20,23,31,.30)}
:root[data-ui="dark"]{--cal-bg:#252A33;--cal-o:rgba(0,0,0,.45)}
.cal-top{display:flex;justify-content:space-between;align-items:baseline;gap:6px 16px;flex-wrap:wrap;font-size:calc(13px*var(--fz));color:var(--muted);font-variant-numeric:tabular-nums}
.cal-top b{color:var(--ink);font-weight:600}
.cal-top .ok{color:var(--ok-fg)}.cal-top .bad{color:var(--danger)}
.cal-cnt{display:inline-flex;align-items:center;gap:5px;flex-wrap:wrap}
.cc{width:11px;height:11px;border-radius:3px;display:inline-block;margin-left:8px}
.cc:first-child{margin-left:0}
.cc.ok{background:#fff;box-shadow:inset 0 0 0 1.5px var(--faint)}
.cc.near{background:#9AA0AA}
.cc.bad{background:linear-gradient(90deg,rgba(239,110,110,.45),rgb(110,6,12))}
.cal-g{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.cal-w{text-align:center;font-size:calc(11px*var(--fz));color:var(--muted)}
.cal-d{position:relative;border:0;border-radius:14px;background:var(--cal-bg);height:78px;min-width:0;padding:0;color:var(--ink);display:grid;place-items:center;cursor:pointer;font-variant-numeric:tabular-nums}
.cal-d:hover{filter:brightness(.97)}
:root[data-ui="dark"] .cal-d:hover{filter:brightness(1.15)}
.cal-d.sel{box-shadow:0 0 0 2px var(--ink)}
.cal-d.fut{opacity:.35;cursor:default}
.cal-d.off{opacity:.55}
.cal-n{position:absolute;top:6px;left:8px;font-size:calc(11px*var(--fz));color:var(--muted)}
.cal-d.tdy .cal-n{color:var(--ink);font-weight:700}
.cal-s{position:absolute;bottom:5px;left:0;right:0;text-align:center;font-size:calc(10.5px*var(--fz));color:var(--muted);white-space:nowrap;overflow:hidden}
.cal-d.st-bad .cal-s{color:var(--danger)}
.pl{width:30px;height:30px;display:block}
.pl path{fill:none;stroke-linecap:round}
.pl .pl-o{stroke:var(--cal-o);stroke-width:5.6}
.pl .pl-f{stroke-width:3.2}
/* ---- вкладка «Месяц»: переходы к разделам ---- */
.jump{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:-12px}
.jump button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 13px;font-size:calc(13px*var(--fz));font-weight:500;color:var(--ink)}
.jump button:hover{background:var(--soft)}
.part{display:grid;grid-template-columns:minmax(0,1fr);gap:22px;scroll-margin-top:12px}
.part-h{font-size:calc(24px*var(--fz));padding-top:8px;border-top:1px solid var(--line)}
#hist-sec{display:block;height:0;margin-bottom:-28px}
@media (max-width:640px){
  .cal-g{gap:4px}
  .cal-d{border-radius:10px;height:auto;aspect-ratio:1/1.08}
  .cal-n{top:4px;left:5px;font-size:calc(10px*var(--fz))}
  .cal-s{bottom:3px;font-size:calc(9.5px*var(--fz))}
  .pl{width:46%;height:46%}
  .part-h{font-size:calc(20px*var(--fz))}
}
.day-all{justify-self:start;margin-top:-4px}
@media (max-width:640px){
  .kv-r{grid-template-columns:minmax(0,1fr) 112px 30px}
  .rec-r{grid-template-columns:minmax(0,1fr) auto 30px}
  .rec-r .btn{grid-column:1/-1;grid-row:2;justify-self:start}
  .dc-f{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .cl-r{grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"n a" "b b" "p p"}
  .cl-n{grid-area:n}.cl-b{grid-area:b}.cl-a{grid-area:a}.cl-p{grid-area:p;justify-self:start}
  .ds-i>b{font-size:calc(16px*var(--fz))}
  .dtop{grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:6px}
  .tiles{grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px}
  .tiles .tile{padding:12px 14px;border-radius:18px}
  .tiles .tile:first-child{grid-column:1/-1}
  .tiles .tile:not(:first-child) .val{font-size:calc(19px*var(--fz))}
  .ds-i{padding:8px 10px}
  .ds-i>small{font-size:calc(11px*var(--fz))}
}
/* ---- траты одной страницей, настройки справа сверху (29.10, вечер) ---- */
.pill{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-size:calc(13px*var(--fz));font-weight:500;white-space:nowrap;color:var(--ink);display:inline-flex;align-items:center;gap:6px}
button.pill:hover,button.pill[aria-pressed="true"]{background:var(--soft)}
button.pill svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round}
.top .tabs[hidden]{display:none}
.hero{display:flex;align-items:flex-end;justify-content:space-between;gap:10px 28px;flex-wrap:wrap;padding:4px 2px 0}
.hero-m{display:grid;gap:2px}
.hero-m .lab{color:var(--muted);font-size:calc(13px*var(--fz))}
.hero-m .val{font-family:var(--display);font-weight:400;font-size:calc(44px*var(--fz));letter-spacing:-.035em;line-height:1.05;font-variant-numeric:tabular-nums}
.hero-s{display:grid;gap:3px;justify-items:end;text-align:right;font-size:calc(13px*var(--fz));color:var(--muted);font-variant-numeric:tabular-nums}
.hero-s b{color:var(--ink);font-weight:600}
.hero-s i{font-style:normal;font-weight:600}.hero-s i.up{color:var(--danger)}.hero-s i.dn{color:var(--ok-fg)}
.asks{display:grid;gap:6px}
.ask-r{display:flex;justify-content:space-between;align-items:center;gap:6px 12px;flex-wrap:wrap;background:var(--warn-bg);color:var(--warn-fg);border-radius:14px;padding:8px 12px;font-size:calc(13px*var(--fz))}
.cal-row{display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px;align-items:start}
.box.cal,.box.cats{padding:14px;gap:8px}
.cal-h{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:calc(14px*var(--fz))}
.cal-h b{font-weight:600}
.cal-h .ib{width:26px;height:26px}
.cal-h .lnk{color:var(--muted);font-size:calc(12px*var(--fz))}
.box.cal .cal-g{grid-template-columns:repeat(7,34px);gap:4px}
.box.cal .cal-w{font-size:calc(10px*var(--fz))}
.box.cal .cal-d{height:34px;width:34px;border-radius:9px;overflow:visible;transition:transform .2s}
.box.cal .cal-n{top:2px;left:4px;font-size:calc(9px*var(--fz))}
.box.cal .pl{width:20px;height:20px;margin-top:3px}
.box.cal .pl .pl-o{stroke-width:6;stroke:var(--cal-o)}
.box.cal .pl .pl-f{stroke-width:3.4}
.box.cal .cal-d.sel{box-shadow:0 0 0 2px var(--ink)}
.box.cal .cal-d.off .pl,.box.cal .cal-d.fut .pl{display:none}
/* наведение: ячейка раскрывается и показывает сумму за сутки */
.cal-pop{position:absolute;left:50%;top:50%;width:96px;min-height:60px;padding:7px 8px;border-radius:12px;background:var(--surface);box-shadow:0 10px 30px -8px var(--shadow),0 0 0 1px var(--line);display:grid;gap:1px;justify-items:center;align-content:center;
  transform:translate(-50%,-50%) scale(.35);opacity:0;pointer-events:none;transition:transform .18s cubic-bezier(.2,.8,.3,1.2),opacity .12s;z-index:5;font-variant-numeric:tabular-nums}
.cal-pop small{font-size:calc(10.5px*var(--fz));color:var(--muted)}
.cal-pop b{font-size:calc(15px*var(--fz));font-weight:600;color:var(--ink);white-space:nowrap}
.cal-pop small.bad{color:var(--danger)}.cal-pop small.ok{color:var(--ok-fg)}
.cal-d:not(.fut):hover,.cal-d:not(.fut):focus-visible{z-index:6}
.cal-d:not(.fut):hover .cal-pop,.cal-d:not(.fut):focus-visible .cal-pop{transform:translate(-50%,-50%) scale(1);opacity:1}
.cal-lg{display:flex;align-items:center;gap:6px;font-size:calc(10.5px*var(--fz));color:var(--muted);padding-top:2px}
.cal-lg i{flex:1;height:6px;border-radius:9px;background:linear-gradient(90deg,#fff,rgb(24,24,27));box-shadow:inset 0 0 0 1px var(--line)}
.box.cats .cl{border-top:0;gap:0}
.box.cats .cl-r{grid-template-columns:minmax(0,1fr) auto 44px;grid-template-areas:"n a p" "b b b";gap:3px 10px;padding:6px 0;border-bottom:1px solid var(--line)}
.box.cats .cl-n{grid-area:n;font-size:calc(13px*var(--fz))}
.box.cats .cl-a{grid-area:a;display:block;font-size:calc(13px*var(--fz));font-weight:600}
.box.cats .cl-a small{color:var(--muted);font-weight:400}
.box.cats .cl-p{grid-area:p;font-size:calc(11px*var(--fz))}
.box.cats .cl-p i{font-style:normal;color:var(--muted)}.box.cats .cl-p i.up{color:var(--danger)}.box.cats .cl-p i.dn{color:var(--ok-fg)}

<script>
(function(){
  'use strict';
  var LSK='lw-fin1',SEED=null;
  /* ---------- расчёты: всё здесь чистая арифметика по числам пользователя ---------- */
  function num(v){v=+v;return isFinite(v)?v:0}
  function list(o){return Object.keys(o||{}).map(function(id){var x=o[id];x.id=id;return x}).sort(function(a,b){return(a.o||0)-(b.o||0)})}
  function mKey(d){return d.getFullYear()+'-'+(d.getMonth()<9?'0':'')+(d.getMonth()+1)}
  function mAddK(k,n){var y=+k.slice(0,4),m=+k.slice(5)-1+n;return mKey(new Date(y+Math.floor(m/12),((m%12)+12)%12,1))}
  function mDiff(a,b){return(+b.slice(0,4)-+a.slice(0,4))*12+(+b.slice(5)-+a.slice(5))}
  /* ---- траты по дням ---- */
  function p2(n){return(n<10?'0':'')+n}
  function dKey(d){return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate())}
  function dimK(k){return new Date(+k.slice(0,4),+k.slice(5,7),0).getDate()}
  function daySum(f,dk){var s=0,o=(f.days||{})[dk]||{};Object.keys(o).forEach(function(id){s+=num(o[id].a)});return s}
  function spendPlanM(f,mk){return dayLim(f,mk)*dimK(mk)}
  /* ---- лимит на день: вручную или сам из базы дохода ----
     авто: (доход-база + доп. источники − обязательные расходы − на долги в месяц − отложить) / дней в месяце */
  function isLoan(d){return d&&d.k==='loan'}
  function minPays(f,loans){var s=0;list(f.debts).forEach(function(d){if(num(d.bal)>0&&!!isLoan(d)===!!loans)s+=Math.min(Math.max(0,num(d.min)),num(d.bal))});return s}
  /* на долги в месяц: своё правило для кредиток (не меньше минимальных платежей банка) плюс минимальные платежи по кредитам */
  function debtPayM(f){return Math.max(Math.max(0,num((f.cc||{}).min)),minPays(f,false))+minPays(f,true)}
  function autoBudget(f){return Math.max(0,incomeOf(f)+sidesInPlan(f)-expOf(f)-debtPayM(f)-Math.max(0,num((f.spend||{}).keep)))}
  function limAuto(f){return (f.spend||{}).mode!=='hand'}
  function dayLim(f,mk){var s=f.spend||{};return limAuto(f)?autoBudget(f)/dimK(mk):Math.max(0,num(s.day))}
  /* ключ магазина: без цифр и хвостов, первые два слова. Тот же, что у выписок, поэтому обязательный платёж узнаётся в тратах */
  function nKey(s){return String(s||'').toUpperCase().replace(/^ВОЗВРАТ:\s*/,'').replace(/[^A-ZА-ЯЁ ]+/g,' ').replace(/\b(MOSCOW|MOSKVA|MOSKVA G|RUS|RU|SANKT|PETERBURG|SPB|G|OOO|ООО|ИП|АО|ПАО)\b/g,' ').replace(/\s+/g,' ').trim().split(' ').slice(0,2).join(' ')}
  /* траты, которые уже стоят в обязательных расходах (добавлены из «похоже на регулярные»), в дневной лимит не идут, чтобы не считать дважды */
  function fxKeys(f){var m=null;list(f.exp).forEach(function(x){if(x.k&&!x.off){m=m||{};m[x.k]=1}});return m}
  /* сводка месяца: план на прошедшие дни, сколько потрачено и разница. Плюс: запас, минус: перерасход.
     today — сегодняшний день «ГГГГ-ММ-ДД»; для прошлых месяцев считается весь месяц, для будущих ничего */
  /* с какого дня идёт счёт: с самого раннего дня, за который есть траты. Дни до него в план не входят,
     иначе у начавшего в середине месяца сразу был бы большой «запас» за дни, которые он не записывал */
  function spendFrom(f,today){var m=today;Object.keys(f.days||{}).forEach(function(k){if(/^\d{4}-\d\d-\d\d$/.test(k)&&k<m&&Object.keys(f.days[k]||{}).length)m=k});return m}
  function spendMonth(f,mk,today){
    var lim=dayLim(f,mk),n=dimK(mk),tm=today.slice(0,7),upto=mk===tm?+today.slice(8):mk<tm?n:0,days=[],spent=0,all=0,cats={},fk=fxKeys(f),fixAll=0;
    var from=spendFrom(f,today),fm=from.slice(0,7),s0=fm<mk?1:fm===mk?+from.slice(8):n+1,cnt=Math.max(0,upto-s0+1),left=Math.max(0,n-s0+1);
    for(var d=1;d<=n;d++){
      var dk=mk+'-'+p2(d),o=(f.days||{})[dk]||{},s=0,fx=0;
      Object.keys(o).forEach(function(id){var e=o[id],a=num(e.a);if(fk&&e.n&&fk[nKey(e.n)]){fx+=a;return}s+=a;var c=e.c||'Другое';cats[c]=(cats[c]||0)+a});
      all+=s;fixAll+=fx;if(d<=upto)spent+=s;
      days.push({k:dk,d:d,sum:s,fix:fx,past:d<=upto&&d>=s0,n:Object.keys(o).length});
    }
    /* сколько можно сегодня: остаток бюджета месяца без вчерашних трат, поделённый на оставшиеся дни вместе с сегодняшним */
    var before=0;for(var q=Math.max(1,s0);q<upto;q++)before+=days[q-1].sum;
    var tdy=mk===tm&&lim>0?Math.max(0,(lim*left-before)/Math.max(1,n-upto+1)):lim;
    var cl=Object.keys(cats).map(function(c){return{n:c,a:cats[c]}}).sort(function(a,b){return b.a-a.a});
    return{mk:mk,lim:lim,today:tdy,fix:fixAll,n:n,upto:upto,s0:s0,cnt:cnt,days:days,spent:spent,all:all,plan:lim*cnt,bal:lim*cnt-spent,budget:lim*left,avg:cnt?spent/cnt:0,
      next:lim>0&&n>upto?(lim*left-all)/(n-upto):null,cats:cl};
  }
  function sideNet(s){return num(s.inc)-num(s.cost)}
  function sidesInPlan(f){var s=0;list(f.sides).forEach(function(x){if(x.inPlan)s+=sideNet(x)});return s}
  /* база дохода (зарплата без премии) — отдельное поле, по умолчанию 100 000; остальные постоянные доходы в списке inc */
  var BASE0=100000;
  function baseOf(f){return Math.max(0,num(f.base))}
  function incomeOf(f){var s=baseOf(f);list(f.inc).forEach(function(x){if(!x.off)s+=num(x.a)});return s}
  function expOf(f){var s=0;list(f.exp).forEach(function(x){if(!x.off)s+=num(x.a)});return s}
  /* план по месяцам. Каждый месяц: на долги начисляются проценты, платятся минимальные платежи, остаток свободных денег
     делится между досрочным погашением и целями по выбранному правилу. Месяц 0 — текущий. */
  function finPlan(f,o){
    o=o||{};var p=f.plan||{},now=o.now||mKey(new Date());
    var job=incomeOf(f),sd=sidesInPlan(f),extra=num(o.extra!=null?o.extra:p.extra);
    /* расходы плана: обязательные платежи месяца плюс план ежедневных трат */
    var fixed=expOf(f),daily=spendPlanM(f,now),income=job+sd+extra,exp=fixed+daily,free=income-exp;
    var floor=num((f.cc||{}).min)>0?debtPayM(f):0,strat=o.strat||p.strat||'aval',mode=o.mode||p.mode||'debts',share=mode==='debts'?1:mode==='goals'?0:Math.min(100,Math.max(0,num(p.split!=null?p.split:50)))/100,even=(p.goals||'seq')==='even';
    var debts=list(f.debts).filter(function(d){return num(d.bal)>0}).map(function(d){return{id:d.id,n:d.n||'Долг',bal:num(d.bal),apr:Math.max(0,num(d.apr)),min:Math.max(0,num(d.min)),o:d.o||0,int:0,paid:0}});
    var goals=list(f.goals).filter(function(g){return num(g.target)-num(g.saved)>0}).map(function(g){return{id:g.id,n:g.n||'Цель',left:num(g.target)-num(g.saved),target:num(g.target),due:/^\d{4}-\d\d$/.test(g.due||'')?g.due:'',o:g.o||0}});
    var R={floor:floor,now:now,income:income,job:job,sides:sd,extra:extra,exp:exp,fixed:fixed,daily:daily,free:free,months:[],events:[],interest:0,debtStart:0,goalStart:0,savedStart:0,debtFree:null,goalsDone:null,short:false,never:false,strat:strat,mode:mode,done:{},need:{}};
    debts.forEach(function(d){R.debtStart+=d.bal});goals.forEach(function(g){R.goalStart+=g.left});
    list(f.goals).forEach(function(g){R.savedStart+=Math.max(0,num(g.saved))});
    var minSum=0;debts.forEach(function(d){minSum+=Math.min(d.min,d.bal)});R.minSum=minSum;
    /* сколько нужно в месяц, чтобы успеть к сроку цели */
    goals.forEach(function(g){if(g.due){var left=Math.max(1,mDiff(now,g.due)+1);R.need[g.id]={m:left,a:g.left/left,late:mDiff(now,g.due)<0}}});
    if(!debts.length)R.debtFree=-1;if(!goals.length)R.goalsDone=-1;
    if(free<=0||(!debts.length&&!goals.length))return R;
    var saved=R.savedStart,pool=0;
    for(var m=0;m<600;m++){
      var dl=debts.filter(function(d){return d.bal>0.005}),gl=goals.filter(function(g){return g.left>0.005});
      if(!dl.length&&!gl.length)break;
      var row={m:m,k:mAddK(now,m),pay:{},save:{},int:0,free:0},budget=free;
      dl.forEach(function(d){var it=d.bal*d.apr/1200;d.bal+=it;d.int+=it;row.int+=it;R.interest+=it});
      function payD(d,a){a=Math.min(a,d.bal,budget);if(a<=0)return 0;d.bal-=a;d.paid+=a;budget-=a;row.pay[d.id]=(row.pay[d.id]||0)+a;if(d.bal<=0.005){d.bal=0;if(R.done[d.id]==null){R.done[d.id]=m;R.events.push({m:m,k:row.k,t:'debt',id:d.id,n:d.n})}}return a}
      function putG(g,a){a=Math.min(a,g.left,budget);if(a<=0)return 0;g.left-=a;budget-=a;saved+=a;row.save[g.id]=(row.save[g.id]||0)+a;if(g.left<=0.005){g.left=0;if(R.done[g.id]==null){R.done[g.id]=m;R.events.push({m:m,k:row.k,t:'goal',id:g.id,n:g.n})}}return a}
      /* 1. минимальные платежи */
      dl.forEach(function(d){var need=Math.min(d.min,d.bal);if(budget<need-0.005)R.short=true;payD(d,need)});
      /* 1б. свой минимум на долги в месяц (например, «на кредитки не меньше 30 000»): добирается сверх минимальных платежей */
      if(floor>0){var fl0=floor-sumO(row.pay);dl.filter(function(d){return d.bal>0}).sort(strat==='snow'?function(a,b){return a.bal-b.bal||b.apr-a.apr}:function(a,b){return b.apr-a.apr||a.bal-b.bal}).forEach(function(d){if(fl0>0.005)fl0-=payD(d,fl0)})}
      /* 2. остаток: доля на досрочное погашение, остальное в цели */
      var sh=!gl.length?1:!dl.some(function(d){return d.bal>0})?0:share,toD=budget*sh;
      var ord=dl.filter(function(d){return d.bal>0}).sort(strat==='snow'?function(a,b){return a.bal-b.bal||b.apr-a.apr}:function(a,b){return b.apr-a.apr||a.bal-b.bal});
      ord.forEach(function(d){if(toD>0.005){var a=Math.min(toD,d.bal);toD-=payD(d,a)}});
      /* 3. цели: по очереди или поровну */
      function fillGoals(){
        var act=goals.filter(function(g){return g.left>0.005});
        if(!even){act.forEach(function(g){if(budget>0.005)putG(g,budget)});return}
        for(var q=0;q<8&&budget>0.005;q++){act=goals.filter(function(g){return g.left>0.005});if(!act.length)break;var part=budget/act.length;act.forEach(function(g){putG(g,part)})}
      }
      fillGoals();
      /* 4. цели закрыты, а долги остались: всё оставшееся идёт на них, и наоборот */
      if(budget>0.005){debts.filter(function(d){return d.bal>0}).sort(strat==='snow'?function(a,b){return a.bal-b.bal}:function(a,b){return b.apr-a.apr}).forEach(function(d){if(budget>0.005)payD(d,budget)})}
      if(budget>0.005)fillGoals();
      row.free=budget;pool+=budget;
      var dt=0;debts.forEach(function(d){dt+=d.bal});row.debt=dt;row.saved=saved;
      R.months.push(row);
      if(dt<=0.005&&R.debtFree==null)R.debtFree=m;
      if(!goals.some(function(g){return g.left>0.005})&&R.goalsDone==null)R.goalsDone=m;
      /* долг растёт быстрее, чем гасится: дальше считать бессмысленно */
      if(m>=12&&dt>R.debtStart*1.0001&&row.int>=sumO(row.pay)){R.never=true;break}
    }
    if(R.months.length>=600)R.never=true;
    R.debts=debts;R.goals=goals;
    Object.keys(R.need).forEach(function(id){var n=R.need[id];n.done=R.done[id];n.ok=!n.late&&R.done[id]!=null&&R.done[id]<n.m});
    return R;
  }
  function sumO(o){var s=0;Object.keys(o||{}).forEach(function(k){s+=o[k]});return s}

  /* можно выбрать или перетащить сразу несколько выписок из разных банков: они сводятся в одно окно */

  function renderMonths(){

  /* перевод по номеру из сводки: «это я» — перевод себе, «другому человеку» — трата в категории «Переводы людям». Ответ запоминается для номера */
  function fWho(id,w){

  function recSave(){
    var old=recOf(recM),r={inc:0,exp:0,paid:{},saved:{},note:'',at:Date.now()};

    r.inc=num(g('inc',old?old.inc:0));r.exp=num(g('exp',old?old.exp:0));r.note=String(g('note',old?old.note:'')||'').slice(0,200);
    list(F.debts).forEach(function(d){var v=num(g('p.'+d.id,old&&old.paid?old.paid[d.id]:0));if(v>0)r.paid[d.id]=v});

    if(!r.inc&&!r.exp&&!Object.keys(r.paid).length&&!Object.keys(r.saved).length){toast('Впиши хотя бы одну сумму.');return}
    unapply(old);apply(r);var t=totals();r.debtAfter=t.d;r.savedAfter=t.s;F.months[recM]=r;draft={};save();render();
    toast(mName(recM)+' записан: остатки долгов и накопления обновлены.');
  }

  /* ---------- график: линии по месяцам, перекрестие и подсказка под пальцем ---------- */

  function drawChart(id,c){

    var W=el.clientWidth||600,svgH=window.innerWidth<=640?220:260,L=48,Rt=18,T=14,B=26,pts=c.pts,n=pts.length,mx=0;
    pts.forEach(function(p){if(c.debt)mx=Math.max(mx,p.debt);if(c.saved)mx=Math.max(mx,p.saved)});
    var step=Math.pow(10,Math.floor(Math.log(mx||1)/Math.LN10)),tk=mx/step<=2?step/2:mx/step<=5?step:step*2,top=Math.ceil((mx||1)/tk)*tk;
    function X(i){return L+(W-L-Rt)*(n>1?i/(n-1):0)}function Y(v){return T+(svgH-T-B)*(1-v/top)}
    function path(key){return pts.map(function(p,i){return(i?'L':'M')+X(i).toFixed(1)+' '+Y(p[key]).toFixed(1)}).join(' ')}
    var g='';for(var v=0;v<=top+0.5;v+=tk)g+='<line x1="'+L+'" x2="'+(W-Rt)+'" y1="'+Y(v).toFixed(1)+'" y2="'+Y(v).toFixed(1)+'" stroke="var(--grid)" stroke-width="1"/><text class="ax" x="'+(L-8)+'" y="'+(Y(v)+4).toFixed(1)+'" text-anchor="end">'+shortM(v)+'</text>';
    /* подписи месяцев идут с ровным шагом */
    var xs=Math.max(1,Math.ceil((n-1)/(W<520?3:6))),xl='';for(var i=0;i<n;i+=xs)xl+='<text class="ax" x="'+X(i).toFixed(1)+'" y="'+(svgH-6)+'" text-anchor="'+(i===0?'start':i===n-1?'end':'middle')+'">'+esc(pts[i].k)+'</text>';
    var s='<svg viewBox="0 0 '+W+' '+svgH+'" role="img" aria-label="График по месяцам; те же числа есть в таблице ниже">'+g+xl+
      (c.debt?'<path d="'+path('debt')+'" fill="none" stroke="var(--s-debt)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>':'')+
      (c.saved?'<path d="'+path('saved')+'" fill="none" stroke="var(--s-save)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>':'')+
      '<g id="'+id+'-h" visibility="hidden"><line id="'+id+'-x" y1="'+T+'" y2="'+(svgH-B)+'" stroke="var(--muted)" stroke-width="1"/>'+(c.debt?'<circle id="'+id+'-d" r="5" fill="var(--s-debt)" stroke="var(--surface)" stroke-width="2"/>':'')+(c.saved?'<circle id="'+id+'-s" r="5" fill="var(--s-save)" stroke="var(--surface)" stroke-width="2"/>':'')+'</g>'+
      '<rect x="'+L+'" y="0" width="'+(W-L-Rt)+'" height="'+svgH+'" fill="transparent" id="'+id+'-r"/></svg><div class="tip" id="'+id+'-t" hidden></div>';
    el.innerHTML=s;
    var r=$(id+'-r'),hg=$(id+'-h'),tp=$(id+'-t');
    function at(e){
      var b=r.getBoundingClientRect(),cx=(e.touches?e.touches[0].clientX:e.clientX)-b.left,i=Math.max(0,Math.min(n-1,Math.round(cx/b.width*(n-1)))),p=pts[i],x=X(i);
      hg.setAttribute('visibility','visible');$(id+'-x').setAttribute('x1',x);$(id+'-x').setAttribute('x2',x);
      if(c.debt){$(id+'-d').setAttribute('cx',x);$(id+'-d').setAttribute('cy',Y(p.debt))}
      if(c.saved){$(id+'-s').setAttribute('cx',x);$(id+'-s').setAttribute('cy',Y(p.saved))}
      tp.innerHTML='<b>'+esc(p.k)+'</b>'+(c.debt?'<span><i class="dot d"></i>Долги: '+money(p.debt)+'</span>':'')+(c.saved?'<span><i class="dot s"></i>Накопления: '+money(p.saved)+'</span>':'');
      tp.hidden=false;var tw=tp.offsetWidth,sc=el.clientWidth/W,lx=x*sc+12;if(lx+tw>el.clientWidth)lx=x*sc-tw-12;tp.style.left=Math.max(0,lx)+'px';tp.style.top='6px';
    }
    function off(){hg.setAttribute('visibility','hidden');tp.hidden=true}
    r.addEventListener('mousemove',at);r.addEventListener('mouseleave',off);r.addEventListener('touchstart',at,{passive:true});r.addEventListener('touchmove',at,{passive:true});r.addEventListener('touchend',off);

      var cn=b.dataset.cat;

      spCat=cn;try{localStorage.setItem(LSK+'-cat',cn)}catch(_){}render();var sa=$('sp-a');if(sa)sa.focus();return}
    if((b=t.closest('[data-spdel]'))){var dd=F.days[spD];if(dd){delete dd[b.dataset.spdel];if(!Object.keys(dd).length)delete F.days[spD]}save();render();return}
    if((b=t.closest('[data-day]'))){var dn=+b.dataset.day,nd=dn===0?TODAY:dShift(spD,dn);if(nd<=TODAY){spD=nd;render()}return}
    if((b=t.closest('[data-mon]'))){var nm=mAddK(spD.slice(0,7),+b.dataset.mon);if(nm<=TODAY.slice(0,7)){spD=nm===TODAY.slice(0,7)?TODAY:nm+'-'+p2(dimK(nm));render()}return}
    if((b=t.closest('[data-pick]'))){spD=b.dataset.pick;render();jumpTo('day-sec');return}
    if((b=t.closest('[data-jump]'))){jumpTo(b.dataset.jump);return}
    if((b=t.closest('[data-add]'))){var c=b.dataset.add,id=nid(c.charAt(0)),o=ADD[c](),mx=0;list(F[c]).forEach(function(x){mx=Math.max(mx,x.o||0)});o.o=mx+1;if(b.dataset.k)o.k=b.dataset.k;F[c][id]=o;if(c==='debts')dcOpen[id]=true;save();render();var f=$('i-'+c+'.'+id+'.n');if(f)f.focus();return}
    if((b=t.closest('[data-del]'))){delP(b.dataset.del);save();render();return}
    if((b=t.closest('.seg [data-p]'))){setP(b.dataset.p,b.dataset.v);save();render();return}
    if((b=t.closest('[data-sw]'))){setP(b.dataset.sw,getP(b.dataset.sw)?0:1);save();render();return}
    if(!(b=t.closest('[data-act]')))return;
    var a=b.dataset.act;
    if(a==='rec')recSave();
    else if(a==='spadd')spAdd();
    else if(a==='catnew'){spNewCat=true;spEdit=false;render();var ci=$('sp-newcat');if(ci)ci.focus()}
    else if(a==='catok')spCatAdd();
    else if(a==='bkopen')bkPick();
    else if(a==='bkhow'){bkHow=!bkHow;render()}
    else if(a==='bkdel')bkDel(b.dataset.bank);
    else if(a==='bknodel'){bkAsk='';render()}
    else if(a==='catedit'){spEdit=!spEdit;render()}
    else if(a==='catlim'){catEd=!catEd;render()}
    else if(a==='setclose')setTab('spend');
    else if(a==='opendebts')setTab('set',true,'debts-sec');
    else if(a==='dayall'){dayAll=!dayAll;render()}
    else if(a==='dcx'){var dx=b.dataset.id;dcOpen[dx]=!dcOpen[dx];render()}
    else if(a==='dcpay'){dcPay(b.dataset.id)}
    else if(a==='recadd'){var rc=recurFind(F,TODAY).filter(function(x){return x.k===b.dataset.k})[0];if(rc){var mo=0;list(F.exp).forEach(function(x){mo=Math.max(mo,x.o||0)});F.exp[nid('e')]={n:rc.n,a:rc.a,k:rc.k,o:mo+1};save();render();toast('«'+rc.n+'» теперь в обязательных: '+money(rc.a)+' в месяц. Эти траты больше не идут в лимит дня.')}}
    else if(a==='recno'){if(!isO(F.recno))F.recno={};F.recno[b.dataset.k]=1;save();render()}
    else if(a==='ccfloor'){var pc=payToClose(F,F.plan.due,NOW);if(pc){if(!isO(F.cc))F.cc={};F.cc.min=Math.max(0,pc.pay-minPays(F,true));save();render();toast('Минимум на кредитки теперь '+money(F.cc.min)+' в месяц.')}}
    else if(a==='fill'){
      /* из сводки: доход (база + премия), траты, платежи по кредиткам на свои долги; в цели — по плану, если месяц текущий */
      var S=monthSum(F,recM,TODAY),R=finPlan(F,{now:NOW}),row=recM===NOW?R.months[0]:null;draft={};
      draft.inc=Math.round(S.income);draft.exp=Math.round(factExp(recM));
      /* платежи, которые уже уменьшили остаток долга (вписаны руками на карточке), второй раз не подставляются */
      S.pays.forEach(function(x){if(x.ap)return;var d=x.db?F.debts[x.db]:debtFor(x.ac);if(d)draft['p.'+d.id]=Math.round((draft['p.'+d.id]||0)+num(x.a))});
      if(row)Object.keys(row.save).forEach(function(id){draft['s.'+id]=Math.round(row.save[id])});
      render();toast('Подставлено из сводки: проверь и нажми «Записать месяц».');
    }
    else if(a==='ccpay'){
      var ci=$('cc-a'),ca=ci?parseNum(ci.value):0,ck=($('cc-ac')||{}).value||'';
      if(!(ca>0)){toast('Впиши, сколько внёс на кредитку.');if(ci)ci.focus();return}
      var cd=recM===NOW?TODAY:recM+'-'+p2(dimK(recM)),dd0=ccPay(ca,{ac:ck,d:cd});
      ci.value='';save();render();toast('Записано: '+money(ca)+' на кредитку.'+(dd0?' Остаток «'+(dd0.n||'долг')+'» теперь '+money(dd0.bal)+'.':''));
    }
    else if(a==='ccdel'){var xf=F.flow[b.dataset.id];if(xf&&xf.ap&&F.debts[xf.ap])F.debts[xf.ap].bal=num(F.debts[xf.ap].bal)+num(xf.a);delete F.flow[b.dataset.id];save();render()}
    else if(a==='dcpayopen'){var pid=b.dataset.id;dcPayOpen[pid]=true;dcOpen[pid]=dcOpen[pid]||false;if(tab!=='set')setTab('set');else render();var pin=$('dcp-'+pid);if(pin){pin.focus();try{pin.scrollIntoView({block:'center'})}catch(_){}}}
    else if(a==='debtsync'){
      var k2=b.dataset.k,A=(F.accts||{})[k2];if(!A||A.debt==null)return;var d2=debtFor(k2);
      if(d2){F.debts[d2.id].bal=A.debt;F.debts[d2.id].ac=k2;toast('Остаток «'+(d2.n||'долг')+'» теперь '+money(A.debt)+' (по выписке).')}
      else{var mx=0;list(F.debts).forEach(function(x){mx=Math.max(mx,x.o||0)});F.debts[nid('d')]={n:acName(k2)+' кредитка',bal:A.debt,apr:0,min:0,ac:k2,o:mx+1};toast('Добавлено в «Долги»: впиши там ставку и минимальный платёж.')}
      save();render();
    }
    else if(a==='delrec'){var k=b.dataset.k;if(askDel!==k){askDel=k;render();return}askDel='';unapply(F.months[k]);delete F.months[k];save();render();toast('Запись удалена, суммы возвращены.')}
    else if(a==='exp'){try{var u=URL.createObjectURL(new Blob([JSON.stringify(F)],{type:'application/json'})),l=document.createElement('a');l.href=u;l.download='finansy-'+NOW+'.json';document.body.appendChild(l);l.click();l.remove()}catch(_){toast('Не получилось сохранить файл.')}}
    else if(a==='imp')$('imp-file').click();
  });
  /* меню слева сверху: переход между своими сайтами */
  var menu=$('menu'),brand=$('brand');
  brand.addEventListener('click',function(){menu.hidden=!menu.hidden;brand.setAttribute('aria-expanded',!menu.hidden)});
  document.addEventListener('click',function(e){if(!menu.hidden&&!e.target.closest('#brand-w')){menu.hidden=true;brand.setAttribute('aria-expanded','false')}});
  document.addEventListener('keydown',function(e){if(e.key==='Escape'&&!menu.hidden){menu.hidden=true;brand.setAttribute('aria-expanded','false')}});
  /* тема и размер текста берутся из настроек главного сайта, чтобы оба сайта выглядели одинаково */
  function theme(){
    var ui={};try{ui=((JSON.parse(localStorage.getItem('lw-data3')||'null')||{}).set||{}).ui||{}}catch(_){}
    var dark=ui.theme==='dark'||(ui.theme==='auto'&&!!window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches);
    document.documentElement.setAttribute('data-ui',dark?'dark':'light');
    if(typeof ui.fz==='number'&&ui.fz>=.8&&ui.fz<=1.4)document.documentElement.style.setProperty('--fz',ui.fz);
  }
  /* строка состояния справа сверху */
  function pill(){
    var p=$('st-pill'),s=fsLine();
    p.textContent=saveErr?'Не сохранено':s||(savedAt?'Сохранено '+hm(savedAt):'Автосохранение включено');p.classList.toggle('bad',saveErr||fsBad());
    $('sy-in').hidden=!fsCanLogin();
  }
  function hm(t){var d=new Date(t);return(d.getHours()<10?'0':'')+d.getHours()+':'+(d.getMinutes()<10?'0':'')+d.getMinutes()}
  var rsT;window.addEventListener('resize',function(){clearTimeout(rsT);rsT=setTimeout(function(){if(tab==='set')drawChart('ch-plan',CH.plan)},150)});
  window.addEventListener('storage',function(e){if(e.key==='lw-data3')theme();if(e.key===LSK&&e.newValue){try{F=norm(JSON.parse(e.newValue));render()}catch(_){}}if(e.key==='lw-data3-sy')fsBoot()});
  $('sy-in').onclick=function(){syDlgOpen(false)};
  $('st-pill').onclick=function(){if(fsCanLogin())syDlgOpen(false)};
  function dayTick(){var t=dKey(new Date());if(t===TODAY)return;if(spD===TODAY)spD=t;TODAY=t;NOW=mKey(new Date());render()}
  setInterval(dayTick,60000);document.addEventListener('visibilitychange',function(){if(!document.hidden)dayTick()});
  theme();
  var h0=(location.hash||'').slice(1),j0='';if(TALIAS[h0]){j0=TALIAS[h0][1];h0=TALIAS[h0][0]}if(TABS.some(function(x){return x[0]===h0}))tab=h0;
  if(j0)setTimeout(function(){jumpTo(j0)},50);
  try{history.replaceState({tab:tab},'','#'+tab)}catch(_){}
  render();pill();fsBoot();
  var UPD_NAME='finansy',UPD_BUILD='94a94200ec';
  function updBusy(){return fsBusy||(!!bkDlg&&!bkDlg.hidden)||(!!syDlg&&!syDlg.hidden)}
  function updFlush(){try{localStorage.setItem(LSK,JSON.stringify(F))}catch(_){}}
  /* ---------- сайт сам обновляется до новой версии (21.10) ----------
     При выкладке рядом с сайтом кладётся version.json с номерами сборок обоих сайтов. Страница сверяется с ним через 8 секунд после
     открытия, при возвращении на вкладку, при появлении сети и раз в 10 минут. Если вышла новая сборка, страница перезагружается сама,
     но только когда ничего не печатается, нет недописанных полей, не открыто окно и не идёт отправка записей. Иначе внизу плашка
     «Обновить», а перезагрузка случится сама, как только станет можно (проверка раз в 15 секунд; в скрытой вкладке — сразу).
     Перезагрузка идёт на адрес с «?v=сборка», чтобы браузер и GitHub не отдали старую копию из кэша; если всё равно пришла старая,
     второй раз страница не перезагружается, остаётся плашка. Записи перед перезагрузкой сохраняются в память браузера. */
  var UPD_ON=/^https:$/.test(location.protocol)&&!/(^|\.)claude\.(ai|site)$|(^|\.)claudeusercontent\.com$/.test(location.hostname),updNew='',updT=0,updBar=null;
  function updIdle(){
    var a=document.activeElement;
    if(a&&a!==document.body&&(a.tagName==='TEXTAREA'||a.tagName==='SELECT'||a.isContentEditable||(a.tagName==='INPUT'&&!/^(checkbox|radio|button|range|submit|file|color|reset)$/.test(a.type))))return false;
    var dirty=[].some.call(document.querySelectorAll('input,textarea'),function(x){return !!x.offsetParent&&!/^(checkbox|radio|button|range|submit|file|hidden|color|reset)$/.test(x.type)&&x.value!==x.defaultValue});
    if(dirty)return false;
    try{if(updBusy())return false}catch(_){return false}
    return true;
  }
  function updCheck(){
    if(!UPD_ON||!window.fetch)return;
    fetch('version.json?t='+Date.now(),{cache:'no-store'}).then(function(r){return r.ok?r.json():null}).then(function(v){
      var nv=v&&v[UPD_NAME];if(!nv||nv===UPD_BUILD)return;
      updNew=String(nv);updTry();
    }).catch(function(){});
  }
  function updTry(){
    clearTimeout(updT);if(!updNew)return;
    var tried='';try{tried=sessionStorage.getItem('upd-'+UPD_NAME)||''}catch(_){}
    if(tried===updNew){updShow();return}
    if(!updIdle()){updShow();updT=setTimeout(updTry,15000);return}
    updGo();
  }
  function updGo(){
    try{updFlush()}catch(_){}
    try{sessionStorage.setItem('upd-'+UPD_NAME,updNew)}catch(_){}
    location.replace(location.pathname+'?v='+encodeURIComponent(updNew)+location.hash);
  }
  function updShow(){
    if(updBar)return;
    updBar=document.createElement('div');updBar.className='upd-bar';updBar.setAttribute('role','status');
    updBar.innerHTML='<span>Вышла новая версия сайта</span><button type="button">Обновить</button>';
    updBar.querySelector('button').onclick=updGo;document.body.appendChild(updBar);
  }
  /* после обновления в адресе остался «?v=…»: убираем, чтобы ссылка была чистой */
  if(/(^|[?&])v=/.test(location.search.slice(1))){try{history.replaceState(history.state,'',location.pathname+location.hash)}catch(_){}}
  document.addEventListener('visibilitychange',function(){if(!document.hidden)updCheck();else if(updNew&&updIdle())updGo()});
  window.addEventListener('focus',updCheck);window.addEventListener('online',updCheck);
  setInterval(updCheck,6e5);setTimeout(updCheck,8000);

})();
