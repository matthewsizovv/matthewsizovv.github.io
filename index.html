<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Колесо жизни 2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600&family=Unbounded:wght@300;400;600&display=swap" rel="stylesheet">
<style id="css">
/* Layout: одна страница без прокрутки. Вкладки: Сферы (колесо из 3 карточек + панель), Календарь (дни листаются по горизонтали), Привычки, Цели, Дневник, Отчёт. Только светлая тема. */
:root{
  --bg:#FFFFFF; --surface:#FFFFFF; --soft:#F4F5F8; --soft-2:#ECEEF3; --ink:#14171F; --muted:#737B8A; --line:#E4E7ED;
  --shadow:rgba(40,55,90,.18); --red:#F0453A; --scroll:#D4D8E0; --scroll-2:#BFC5CF;
  --accent:#14171F; --on-accent:#FFFFFF; --on-fill:#FFFFFF; --danger:#C4352B; --faint:#A3AAB6; --dim:#B6BCC8; --today:#FFFAF9; --we:#FBFBFD; --ok-bg:#E3F6E8; --ok-fg:#1F6B3A;
  /* сколько цвета сферы подмешано в фон плашки, в плашку события и в текст */
  --pt:22%; --pm:42%; --pd:45%; --fz:1;
  --display:"Unbounded","Onest",system-ui,sans-serif;
  --body:"Onest",system-ui,-apple-system,"Segoe UI",sans-serif;
  --hh:46px;
  color-scheme:light;
}
/* тёмная тема включается в настройках; те же имена, другие значения */
:root[data-ui="dark"]{
  --bg:#101216; --surface:#171A20; --soft:#1F232B; --soft-2:#2A2F39; --ink:#ECEEF3; --muted:#8D95A5; --line:#2A2F39;
  --shadow:rgba(0,0,0,.6); --scroll:#3A404C; --scroll-2:#4B5261;
  --accent:#ECEEF3; --on-accent:#14171F; --on-fill:#14171F; --danger:#FF7B70; --faint:#69707F; --dim:#565D6B; --today:#211A1B; --we:#13151A; --ok-bg:#15301F; --ok-fg:#8FD9A8;
  --pt:13%; --pm:27%; --pd:45%;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);overflow:hidden;font-size:calc(14px*var(--fz));line-height:1.4}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{color:var(--ink)}
::placeholder{color:var(--muted);opacity:1}
button{cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
/* полосы прокрутки: боковых нет, нижняя светлая */
@supports selector(::-webkit-scrollbar){
  ::-webkit-scrollbar{width:0;height:10px}
  ::-webkit-scrollbar-track{background:var(--surface)}
  ::-webkit-scrollbar-thumb{background:var(--soft-2);border-radius:99px;border:3px solid var(--surface)}
  ::-webkit-scrollbar-thumb:hover{background:var(--scroll)}
  ::-webkit-scrollbar-corner{background:var(--surface)}
  .tg::-webkit-scrollbar-thumb,.mg::-webkit-scrollbar-thumb{background:var(--scroll)}
  .tg::-webkit-scrollbar-thumb:hover,.mg::-webkit-scrollbar-thumb:hover{background:var(--scroll-2)}
}
@supports not selector(::-webkit-scrollbar){*{scrollbar-color:var(--soft-2) var(--surface);scrollbar-width:thin}.tg,.mg{scrollbar-color:var(--scroll) var(--surface)}}
/* у сферы один цвет --c (любой RGB); остальные оттенки получаются смешением с фоном и текстом, поэтому работают в обеих темах */
.sph{--fill:var(--c);--deep:color-mix(in oklab,var(--c) var(--pd),var(--ink));--tint:color-mix(in oklab,var(--c) var(--pt),var(--surface));--mid:color-mix(in oklab,var(--c) var(--pm),var(--surface))}
#root{display:contents}

.app{height:100%;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr);gap:16px;padding-inline:clamp(16px,2.2vw,36px);padding-block:16px 20px}

/* top bar */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px 20px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--display);font-size:calc(16px*var(--fz));letter-spacing:-.01em;white-space:nowrap}
.brand svg{width:24px;height:24px}
.brand-w{position:relative}
button.brand{border:0;background:none;padding:6px 10px 6px 6px;margin:-6px -10px -6px -6px;border-radius:14px;color:var(--ink)}
button.brand:hover,button.brand[aria-expanded="true"]{background:var(--soft)}
.brand .car{font-family:var(--body);font-size:calc(11px*var(--fz));color:var(--muted)}
.menu{position:absolute;top:calc(100% + 12px);left:-6px;z-index:30;width:min(320px,calc(100vw - 32px));background:var(--surface);border:1px solid var(--line);border-radius:20px;box-shadow:0 24px 60px -16px var(--shadow);padding:14px;display:grid;gap:10px}
.sites{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.sites li{display:flex;align-items:center;gap:4px}
.sites a{flex:1;min-width:0;display:grid;padding:8px 10px;border-radius:12px;text-decoration:none;font-weight:600}
.sites a:hover{background:var(--soft)}
.sites a small{font-weight:400;color:var(--muted);font-size:calc(12px*var(--fz));overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sites button{border:0;background:none;color:var(--muted);width:28px;height:28px;border-radius:50%;font-size:calc(15px*var(--fz))}
.sites button:hover{background:var(--soft);color:var(--ink)}
.tabs,.seg{display:flex;gap:4px;background:var(--soft);border-radius:999px;padding:4px}
.tabs button,.seg button{border:0;background:none;border-radius:999px;padding:8px 18px;font-weight:500;color:var(--muted);white-space:nowrap}
.seg button{padding:6px 12px;font-size:calc(13px*var(--fz))}
.tabs button[aria-selected="true"],.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 2px 8px -2px var(--shadow)}
.top-r{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pill{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-size:calc(13px*var(--fz));font-weight:500;white-space:nowrap;font-variant-numeric:tabular-nums}
button.pill{cursor:pointer}
button.pill:hover,button.pill[aria-pressed="true"]{background:var(--soft)}
button.pill{display:inline-flex;align-items:center;gap:7px}
button.pill svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round}
.fact.bad{color:var(--danger)}
.fact{border:0;background:none;font-size:calc(11px*var(--fz));font-weight:400;color:var(--faint);padding:4px 6px;border-radius:8px;white-space:nowrap;font-variant-numeric:tabular-nums}
.fact:hover{background:var(--soft);color:var(--muted)}
.fact u{margin-left:5px}
.mswitch{display:flex;align-items:center;border:1px solid var(--line);border-radius:999px;padding:2px}
.mswitch b{min-width:118px;text-align:center;font-weight:600;font-size:calc(13px*var(--fz))}
.ib{border:0;background:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:calc(16px*var(--fz));line-height:1;color:var(--ink);flex:none}
.ib:hover{background:var(--soft)}
.ib:disabled{opacity:.3;cursor:default}
.view{min-height:0;display:grid}

/* ---------- Сферы ---------- */
#view-spheres{display:grid;min-height:0;grid-template-columns:clamp(290px,26vw,380px) minmax(0,1fr);gap:clamp(16px,2.4vw,40px)}
.wheel{display:grid;align-content:center;gap:10px;min-height:0;outline:none;touch-action:none;user-select:none}
.stack{position:relative;height:calc(3*var(--ch) + 2*12px);margin-block:40px;--ch:96px}
.card{position:absolute;left:0;right:0;top:0;height:var(--ch);display:flex;align-items:center;gap:16px;padding:14px 18px 14px 16px;
  border:1.5px solid var(--mid);border-radius:26px;background:var(--surface);text-align:left;will-change:transform,opacity;transition:background .2s,box-shadow .2s,border-color .2s}
.card:hover{background:var(--tint)}
.card.off .t{opacity:.45}
.card.on{background:var(--tint);border-color:var(--fill);box-shadow:inset 0 0 0 1px var(--fill),0 16px 30px -18px var(--shadow)}
.card>*{opacity:var(--co,1)}
.tile{flex:none;width:64px;height:64px;border-radius:18px;background:var(--fill);color:var(--of,var(--on-fill));display:grid;place-items:center}
.tile svg{width:30px;height:30px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.card .t{min-width:0;display:grid;gap:3px}
.card .n{font-weight:600;font-size:calc(16px*var(--fz));white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .m{color:var(--muted);font-size:calc(13px*var(--fz));font-variant-numeric:tabular-nums;white-space:nowrap}
.card.on .m{color:var(--deep)}
.wnav{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:calc(12px*var(--fz));font-variant-numeric:tabular-nums}
.wnav .ib{border:1px solid var(--line)}
.budget{font-size:calc(12px*var(--fz));color:var(--muted);font-variant-numeric:tabular-nums;line-height:1.6}
.budget b{color:var(--ink);font-weight:600}
.budget b.over{color:var(--danger)}
.budget input{width:4.2ch;border:0;border-bottom:1px dashed var(--line);background:none;padding:0;text-align:center;font-weight:600;-moz-appearance:textfield}
.budget input::-webkit-outer-spin-button,.budget input::-webkit-inner-spin-button{-webkit-appearance:none}

.panel{border:1px solid var(--line);border-radius:32px;padding:clamp(20px,2.4vw,36px);display:grid;grid-template-rows:auto auto minmax(0,1fr);gap:clamp(16px,2.2vh,28px);min-height:0;overflow:auto;box-shadow:0 30px 60px -44px var(--shadow)}
.p-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap}
.eyebrow{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:calc(12px*var(--fz));letter-spacing:.08em;text-transform:uppercase;font-weight:500}
.eyebrow .tile{width:34px;height:34px;border-radius:11px}
.eyebrow .tile svg{width:18px;height:18px}
h1{margin:10px 0 0;font-family:var(--display);font-weight:300;font-size:clamp(28px,3.5vw,54px);line-height:1.05;letter-spacing:-.03em;text-wrap:balance}
.p-act{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chip{display:flex;align-items:center;gap:8px;border-radius:999px;background:var(--tint);color:var(--deep);padding:8px 14px;font-weight:600;font-size:calc(13px*var(--fz));white-space:nowrap;font-variant-numeric:tabular-nums}
.chip i{width:8px;height:8px;border-radius:50%;background:var(--fill)}
.btn{border:0;border-radius:999px;background:var(--accent);color:var(--on-accent);padding:9px 16px;font-weight:500;font-size:calc(13px*var(--fz));white-space:nowrap;text-decoration:none;display:inline-block}
.btn:hover{opacity:.88}
.btn.ghost{background:var(--soft);color:var(--ink)}
.btn.danger{background:none;color:var(--danger);padding-inline:8px}
.btn:disabled{opacity:.35;cursor:default}
.inp{border:1px solid var(--line);border-radius:10px;padding:7px 10px;background:var(--surface);color:var(--ink);min-width:0}

.metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-block:1px solid var(--line)}
.metric{padding:clamp(14px,2vh,22px) clamp(12px,1.4vw,22px);display:grid;align-content:start;gap:8px;min-width:0}
.metric+.metric{border-left:1px solid var(--line)}
.metric:first-child{padding-left:0}
.lab{font-size:calc(12px*var(--fz));letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:500}
.val{font-family:var(--display);font-weight:400;font-size:clamp(24px,2.7vw,42px);letter-spacing:-.04em;line-height:1;font-variant-numeric:tabular-nums;white-space:nowrap}
.val small{font-family:var(--body);font-size:.36em;letter-spacing:0;color:var(--muted);font-weight:500;margin-left:6px}
.val input{width:3.2ch;min-width:2.6em;font-family:var(--display);font-size:1em;letter-spacing:-.04em;border:0;border-bottom:2px dashed var(--line);background:none;padding:0;-moz-appearance:textfield;font-variant-numeric:tabular-nums}
.val input::-webkit-outer-spin-button,.val input::-webkit-inner-spin-button{-webkit-appearance:none}
.val input:focus{outline:0;border-bottom-color:var(--ink)}
.sub{font-size:calc(13px*var(--fz));color:var(--muted);font-variant-numeric:tabular-nums}
.bar{height:6px;border-radius:99px;background:var(--soft);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:var(--fill);max-width:100%}
.lower{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:clamp(20px,3vw,48px);min-height:0}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:12px}
.sec-h h2{margin:0;font-size:calc(12px*var(--fz));letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:500}
.sec-h span{font-size:calc(12px*var(--fz));color:var(--muted)}
.mb{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:clamp(6px,1vw,14px);height:clamp(120px,22vh,220px)}
.mb-c{border:0;background:none;padding:0;display:grid;grid-template-rows:auto 1fr auto;gap:6px;justify-items:center;min-width:0}
.mb-t{position:relative;width:100%;height:100%;border-radius:12px;background:var(--soft);display:flex;align-items:flex-end;overflow:hidden}
.mb-t i{display:block;width:100%;background:var(--mid)}
.mb-c.on .mb-t i{background:var(--fill)}
.mb-t u{position:absolute;left:0;right:0;border-top:2px dashed var(--deep);opacity:.55}
.mb-v{font-size:calc(12px*var(--fz));font-weight:600;font-variant-numeric:tabular-nums}
.mb-l{font-size:calc(12px*var(--fz));color:var(--muted)}
.mb-c.on .mb-l{color:var(--ink);font-weight:600}
.ach{list-style:none;margin:0;padding:0}
.ach li{display:flex;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line);font-weight:500}
.ach li:first-child{border-top:0;padding-top:0}
.ach li span.d{margin-left:auto;color:var(--muted);font-size:calc(12px*var(--fz));font-weight:400;white-space:nowrap;font-variant-numeric:tabular-nums}
.ach .ic{flex:none;width:28px;height:28px;border-radius:50%;background:var(--tint);color:var(--deep);display:grid;place-items:center;font-size:calc(13px*var(--fz))}
.note{color:var(--muted);font-size:calc(13px*var(--fz));max-width:44ch;margin:0}

/* ---------- Календарь ---------- */
#view-calendar{grid-template-columns:232px minmax(0,1fr);gap:24px}
.side{display:grid;align-content:start;gap:20px;min-height:0;overflow:auto;padding-right:4px}
.mini-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;font-weight:600}
.mini-h>span{display:flex}
.mini{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;font-size:calc(12px*var(--fz));font-variant-numeric:tabular-nums}
.mini span{text-align:center;color:var(--muted);padding:4px 0;font-size:calc(11px*var(--fz))}
.mini button{border:0;background:none;aspect-ratio:1;border-radius:8px;padding:0}
.mini button:hover{background:var(--soft-2)}
.mini button.out{color:var(--dim)}
.mini button.wk{background:var(--soft)}
.mini button.today{background:var(--red);color:#fff;font-weight:600}
.leg{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.leg li{display:flex;font-size:calc(13px*var(--fz))}
.leg .lg{border:0;background:none;padding:5px 6px;margin-inline:-6px;border-radius:8px;display:flex;align-items:center;gap:10px;flex:1;min-width:0;text-align:left}
.leg .lg:hover{background:var(--soft)}
.leg i{width:11px;height:11px;border-radius:4px;background:var(--fill);flex:none}
.leg span{margin-left:auto;color:var(--muted);font-variant-numeric:tabular-nums;font-size:calc(12px*var(--fz))}
.side h3{margin:0 0 6px;font-size:calc(12px*var(--fz));letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:500}

.cal-main{display:grid;grid-template-rows:auto minmax(0,1fr);gap:10px;min-width:0;min-height:0}
.wk-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.wk-head h2{margin:0;font-family:var(--display);font-weight:400;font-size:calc(22px*var(--fz));letter-spacing:-.02em}
.wk-nav{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.tg{--gw:52px;overflow:auto;border:1px solid var(--line);border-radius:20px;min-height:0;position:relative;scroll-snap-type:x proximity;scroll-padding-left:var(--gw);overscroll-behavior:contain;user-select:none}
.tg-in{width:max-content;min-width:100%}
.tg-head{position:sticky;top:0;z-index:6;background:var(--surface);border-bottom:1px solid var(--line)}
.tg-row{display:flex}
.corner{position:sticky;left:0;z-index:2;flex:0 0 var(--gw);background:var(--surface);font-size:calc(10px*var(--fz));color:var(--muted);display:grid;place-items:center}
.dh{flex:0 0 var(--cw);text-align:center;padding:10px 4px 6px;font-size:calc(13px*var(--fz));color:var(--muted);white-space:nowrap;overflow:hidden}
.dh.today{color:var(--ink);font-weight:600}
.dh.today b{background:var(--red);color:#fff;border-radius:6px;padding:1px 6px;margin-left:4px}
.dh b{font-weight:500;font-variant-numeric:tabular-nums}
.dh.m1{box-shadow:inset 1px 0 0 var(--ink)}
.ad{flex:0 0 var(--cw);padding:0 3px 6px;min-height:8px;overflow:hidden}
.hb{width:100%;border:0;border-radius:7px;background:var(--soft);color:var(--muted);font-size:calc(11px*var(--fz));padding:3px 6px;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.hb.full{background:var(--ok-bg);color:var(--ok-fg)}
.hb:hover{background:var(--soft-2)}
.tg-body{display:flex;height:calc(24*var(--hh));position:relative}
.gut{position:sticky;left:0;z-index:5;flex:0 0 var(--gw);background:var(--surface)}
.gut span{position:absolute;right:8px;transform:translateY(-50%);font-size:calc(11px*var(--fz));color:var(--muted);font-variant-numeric:tabular-nums}
.day{flex:0 0 var(--cw);position:relative;border-left:1px solid var(--line);scroll-snap-align:start;cursor:crosshair;
  background:repeating-linear-gradient(to bottom,transparent 0,transparent calc(var(--hh) - 1px),var(--line) calc(var(--hh) - 1px),var(--line) var(--hh))}
.day.today{background-color:var(--today)}
.day.we{background-color:var(--we)}
.ev{position:absolute;border:0;border-radius:8px;padding:3px 6px 3px 8px;text-align:left;overflow:hidden;background:var(--mid);color:var(--deep);box-shadow:inset 3px 0 0 var(--fill);font-size:calc(12px*var(--fz));line-height:1.25;display:flex;flex-direction:column;justify-content:flex-start;align-items:stretch;cursor:grab;touch-action:pan-x pan-y}
.ev::before,.ev::after{content:"";position:absolute;left:0;right:0;height:6px;cursor:ns-resize}
.ev::before{top:0}.ev::after{bottom:0}
.ev b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev span{font-size:calc(11px*var(--fz));opacity:.8;font-variant-numeric:tabular-nums;white-space:nowrap}
.ev span.ex{display:block;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.ev.future{background:var(--tint)}
.ev.wait{background:var(--tint);box-shadow:inset 3px 0 0 var(--fill),inset 0 0 0 1px var(--fill)}
.ev.skip{background:var(--soft);color:var(--muted);box-shadow:inset 3px 0 0 #C9CED8}
.ev.skip b{text-decoration:line-through}
.ev.dragging{opacity:.3}
.ev.ghost{pointer-events:none;background:var(--mid);box-shadow:inset 0 0 0 1.5px var(--deep),0 10px 24px -10px var(--shadow);left:2px;right:2px;z-index:8;cursor:grabbing}
.ev.ghost.plain{background:var(--soft-2);box-shadow:inset 0 0 0 1.5px var(--ink);color:var(--ink)}
.now{position:absolute;left:0;right:0;height:2px;background:var(--red);z-index:3;pointer-events:none}
.now::before{content:"";position:absolute;left:-4px;top:-3px;width:8px;height:8px;border-radius:50%;background:var(--red)}
/* месяц */
.mg{border:1px solid var(--line);border-radius:20px;min-height:0;overflow:auto;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));grid-template-rows:auto;grid-auto-rows:minmax(92px,1fr)}
.mg .mh{padding:8px;text-align:center;font-size:calc(12px*var(--fz));color:var(--muted);border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surface);z-index:2}
.mc{border-left:1px solid var(--line);border-bottom:1px solid var(--line);padding:4px;display:grid;align-content:start;gap:2px;min-width:0;cursor:pointer}
.mc:nth-child(7n+1){border-left:0}
.mc.out{background:var(--we)}
.mc .dn{border:0;background:none;justify-self:start;border-radius:7px;padding:1px 6px;font-size:calc(12px*var(--fz));font-variant-numeric:tabular-nums}
.mc.out .dn{color:var(--dim)}
.mc.today .dn{background:var(--red);color:#fff;font-weight:600}
.me{border:0;background:var(--tint);color:var(--deep);border-radius:6px;font-size:calc(11px*var(--fz));padding:1px 5px;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.me.skip{background:var(--soft);color:var(--muted);text-decoration:line-through}
.more{font-size:calc(11px*var(--fz));color:var(--muted);border:0;background:none;text-align:left;padding:0 5px}

/* popovers */
.scrim{position:fixed;inset:0;z-index:40}
.pop{position:fixed;z-index:41;width:min(372px,calc(100vw - 32px));background:var(--surface);border:1px solid var(--line);border-radius:20px;box-shadow:0 24px 60px -16px var(--shadow);padding:16px;display:grid;gap:12px;max-height:calc(100% - 16px);overflow:auto}
.pop input[type=text]{border:0;border-bottom:1px solid var(--line);padding:6px 0;font-size:calc(17px*var(--fz));font-weight:600;width:100%;background:none}
.pop input[type=text]:focus{outline:0;border-bottom-color:var(--ink)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row input,.row select{border:1px solid var(--line);border-radius:10px;padding:6px 8px;background:var(--surface);min-width:0}
.row .dur{color:var(--muted);font-size:calc(12px*var(--fz));margin-left:auto;font-variant-numeric:tabular-nums}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{border:0;border-radius:999px;padding:5px 11px 5px 9px;font-size:calc(12px*var(--fz));font-weight:500;background:var(--soft);display:flex;align-items:center;gap:6px}
.chips button i{width:8px;height:8px;border-radius:50%;background:var(--fill)}
.chips button[aria-pressed="true"]{background:var(--mid);color:var(--deep);box-shadow:inset 0 0 0 1.5px var(--fill)}
.chk{display:flex;gap:8px;align-items:center;font-size:calc(13px*var(--fz))}
.pop-f{display:flex;justify-content:space-between;align-items:center;gap:8px}
.pop .lab{margin-bottom:-4px}
.ev-goal{display:grid;gap:10px}
.ev-goal:empty{display:none}
.ev-goal select{width:100%}
.ev-goal .row .inp{flex:1}
.ev-goal .lab{margin-bottom:-2px}
.pop textarea{border:1px solid var(--line);border-radius:10px;padding:8px 10px;resize:vertical;min-height:56px;max-height:180px;width:100%;font:inherit;line-height:1.4;background:var(--surface)}
.pop textarea:focus{outline:0;border-color:var(--ink)}

/* ---------- Привычки ---------- */
#view-habits,#view-food{grid-template-columns:minmax(260px,330px) minmax(0,1fr);gap:clamp(16px,2.4vw,40px)}
.h-side{display:grid;align-content:start;gap:18px;min-height:0;overflow:auto;padding:2px}
.h-main{display:grid;align-content:start;gap:24px;min-height:0;overflow:auto}
.box{border:1px solid var(--line);border-radius:22px;padding:16px;display:grid;gap:10px}
.box-h{display:flex;align-items:center;justify-content:space-between;gap:8px;font-weight:600}
.hd{display:grid;gap:8px}
.hd-r{display:flex;align-items:center;gap:10px}
.hd-r>span{min-width:0;flex:1;font-weight:500}
.hd-r>span small{display:block;color:var(--muted);font-weight:400;font-size:calc(12px*var(--fz))}
.tog{border:1.5px solid var(--line);background:var(--surface);width:34px;height:34px;border-radius:11px;font-size:calc(16px*var(--fz));color:transparent;flex:none}
.tog[aria-pressed="true"]{background:var(--fill);border-color:var(--fill);color:var(--of,var(--on-fill))}
.tog:disabled,.stp button:disabled{opacity:.35;cursor:default}
.stp{display:flex;align-items:center;gap:4px;flex:none}
.stp button{border:1px solid var(--line);background:var(--surface);width:30px;height:30px;border-radius:10px;font-size:calc(16px*var(--fz));line-height:1}
.stp b{min-width:26px;text-align:center;font-variant-numeric:tabular-nums;white-space:nowrap}
.p-act .stp{background:var(--soft);border-radius:999px;padding:4px 6px 4px 14px;gap:6px;font-size:calc(13px*var(--fz))}
.p-act .stp button{border-radius:50%}
.hl{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.hl li{display:flex;align-items:center;gap:8px;font-size:calc(13px*var(--fz))}
.hl li i{width:9px;height:9px;border-radius:50%;background:var(--fill);flex:none}
.hl li span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hl button{border:0;background:none;color:var(--muted);font-size:calc(12px*var(--fz));padding:2px 4px;border-radius:6px}
.hl button:hover{background:var(--soft);color:var(--ink)}
.hform{display:grid;gap:8px}
.hm-wrap{overflow-x:auto}
.hm{display:grid;gap:3px;align-items:center;min-width:760px}
.hm .hn{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:8px;display:flex;align-items:center;gap:8px}
.hm .hn i{width:9px;height:9px;border-radius:50%;background:var(--fill);flex:none}
.hm .dd{font-size:calc(11px*var(--fz));color:var(--muted);text-align:center;font-variant-numeric:tabular-nums}
.hm .dd.t{color:#fff;background:var(--red);border-radius:5px}
.hm .dd.s{color:var(--ink);font-weight:600}
.hc{border:0;aspect-ratio:1;border-radius:7px;background:var(--soft);font-size:calc(11px*var(--fz));font-weight:600;padding:0;color:var(--deep);font-variant-numeric:tabular-nums}
.hc.on{background:var(--fill);color:var(--of,var(--on-fill))}
.hc.z{background:var(--ok-bg);color:var(--ok-fg)}
.hc.c1{background:var(--tint)}.hc.c2{background:var(--mid)}.hc.c3{background:var(--fill);color:var(--of,var(--on-fill))}
.hc:disabled{background:none;box-shadow:inset 0 0 0 1px var(--line);cursor:default}
.hm .hs{font-size:calc(12px*var(--fz));color:var(--muted);padding-left:8px;white-space:nowrap;font-variant-numeric:tabular-nums}
.hstats{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:0 28px}
.hstat{border-top:1px solid var(--line);padding:14px 0;display:grid;gap:6px;align-content:start}
.hstat .val{font-size:clamp(22px,2.2vw,34px)}

/* ---------- Цели ---------- */
#view-goals{grid-template-rows:auto minmax(0,1fr);gap:14px}
.g-bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.g-bar .inp{width:200px}
.g-new{display:flex;gap:6px;flex:1 1 300px;min-width:220px;max-width:470px}
.g-new .inp{flex:1;width:auto}
/* выпадающие списки фильтров берут цвет выбранного значения */
.fsel.on{background:var(--tint);border-color:var(--fill);color:var(--deep);font-weight:600}
.g-t.noh{grid-template-columns:minmax(230px,1.5fr) 176px 158px 150px minmax(190px,1.3fr) 88px;min-width:1000px}
.g-hr{gap:8px}
.g-hr b{font-variant-numeric:tabular-nums;white-space:nowrap;min-width:46px}
.g-hx{width:56px;min-width:0;border:1px solid var(--line);border-radius:8px;padding:4px 6px;background:none;font-size:calc(12px*var(--fz));font-variant-numeric:tabular-nums}
.g-hx:focus{outline:0;border-color:var(--ink)}
.g-bar .cnt{margin-left:auto;color:var(--muted);font-size:calc(13px*var(--fz));font-variant-numeric:tabular-nums}
.g-wrap{overflow:auto;border:1px solid var(--line);border-radius:20px;min-height:0}
.g-t{display:grid;grid-template-columns:minmax(230px,1.5fr) 176px 158px 150px 132px minmax(190px,1.3fr) 88px;min-width:1130px}
.g-t>*{border-bottom:1px solid var(--line);padding:5px 10px;display:flex;align-items:center;min-width:0}
.g-h{position:sticky;top:0;background:var(--surface);z-index:2;padding-block:8px}
.g-h button{border:0;background:none;padding:2px 4px;border-radius:6px;font-size:calc(12px*var(--fz));letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:500}
.g-h button:hover,.g-h button.on{color:var(--ink)}
.g-t .gn,.g-t textarea{border:0;background:none;width:100%;padding:6px;border-radius:8px;resize:none;field-sizing:content;font:inherit;color:inherit;min-height:32px;max-height:120px}
.g-t .gn{font-weight:600}
.g-t textarea::placeholder{color:transparent}
.g-t textarea:hover::placeholder,.g-t textarea:focus::placeholder{color:var(--muted)}
.g-t .gn:hover,.g-t textarea:hover{background:var(--soft)}
.g-t .gn:focus,.g-t textarea:focus{background:var(--soft);outline:0;box-shadow:inset 0 0 0 1.5px var(--ink)}
.g-t .dn-row .gn{color:var(--muted)}
.tag{appearance:none;-webkit-appearance:none;border:0;border-radius:8px;padding:5px 10px;font-weight:600;font-size:calc(12px*var(--fz));background:var(--mid);color:var(--deep);max-width:100%;cursor:pointer}
.tag:not(.sph){background:var(--soft-2);color:var(--muted)}
.g-x{border:0;background:none;color:var(--muted);font-size:calc(12px*var(--fz));padding:4px 6px;border-radius:6px;white-space:nowrap}
.g-x:hover{background:var(--soft);color:var(--ink)}
.g-empty{grid-column:1/-1;color:var(--muted);padding:22px 14px}

/* ---------- Дневник ---------- */
#view-diary{grid-template-columns:minmax(280px,380px) minmax(0,1fr);gap:clamp(16px,2.4vw,40px)}
.d-side{display:grid;align-content:start;gap:18px;min-height:0;overflow:auto;padding:2px}
.d-main{display:grid;align-content:start;gap:18px;min-height:0;overflow:auto;padding-right:2px}
.d-side textarea{min-height:130px;resize:vertical;font:inherit;line-height:1.5;width:100%}
.d-side .row .inp{flex:1}
.d-bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.d-bar .cnt{margin-left:auto;color:var(--muted);font-size:calc(13px*var(--fz))}
.d-spot{border-radius:26px;background:var(--tint);padding:24px 26px;display:grid;gap:10px}
.d-spot p{margin:0;font-family:var(--display);font-weight:300;font-size:clamp(20px,2.4vw,32px);line-height:1.2;letter-spacing:-.02em;text-wrap:balance;color:var(--deep);white-space:pre-wrap}
.d-m h3{margin:0 0 4px;font-size:calc(12px*var(--fz));letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:500}
.d-e{display:grid;grid-template-columns:58px minmax(0,1fr) auto;gap:14px;padding:14px 0;border-top:1px solid var(--line);align-items:start}
.d-e .dt{font-family:var(--display);font-size:calc(26px*var(--fz));line-height:1;letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.d-e .dt small{display:block;font-family:var(--body);font-size:calc(11px*var(--fz));letter-spacing:0;color:var(--muted);margin-top:4px}
.d-e p{margin:0;font-size:calc(15px*var(--fz));line-height:1.5;white-space:pre-wrap;max-width:68ch}
.d-e .sp{display:inline-flex;align-items:center;gap:6px;font-size:calc(12px*var(--fz));color:var(--deep);margin-top:6px}
.d-e .sp i{width:8px;height:8px;border-radius:50%;background:var(--fill)}
.sug{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.sug li{display:flex;align-items:center;gap:8px;font-size:calc(13px*var(--fz))}
.sug li span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sug li small{color:var(--muted)}

/* ---------- Отчёт ---------- */
#view-report{grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);gap:22px clamp(20px,3vw,48px);overflow:auto;align-content:start}
.sum{grid-column:1/-1;display:grid;grid-template-columns:repeat(4,minmax(0,1fr)) auto;align-items:start;border-bottom:1px solid var(--line)}
.sum .metric{padding:4px 18px 16px;border-left:1px solid var(--line)}
.sum .metric:first-child{padding-left:0;border-left:0}
.sum .val{font-size:clamp(22px,2.3vw,36px)}
.rc-btns{display:grid;gap:8px;padding-left:18px}
.bal svg{width:100%;height:auto;max-height:300px;display:block}
.bal text{font-family:var(--body);font-size:calc(11px*var(--fz));fill:var(--muted)}
.bal .ring{fill:none;stroke:var(--line)}
.bal .sec{fill:var(--fill);stroke:var(--surface);stroke-width:1.5;cursor:pointer}
.bal .sec:hover{fill:var(--deep)}
.mat{min-width:0;overflow-x:auto}
.mat.full{grid-column:1/-1}
.mat-g{display:grid;gap:4px;justify-content:start}
.mat-g .hdc{font-size:calc(12px*var(--fz));color:var(--muted);text-align:center;padding:2px 0 4px}
.mat-g .hdc.on{color:var(--ink);font-weight:600}
button.hdc{border:0;background:none;border-radius:8px}
button.hdc:hover{background:var(--soft);color:var(--ink)}
.mat .fact{margin-top:10px;padding-left:0}
.mat-g .rl{display:flex;align-items:center;gap:8px;padding-right:10px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:calc(13px*var(--fz))}
.mat-g .rl i{width:10px;height:10px;border-radius:3px;background:var(--fill);flex:none}
.cell{position:relative;border:0;height:28px;border-radius:8px;background:var(--soft);overflow:hidden;padding:0 8px;text-align:left;font-size:calc(12px*var(--fz));font-variant-numeric:tabular-nums}
.cell i{position:absolute;left:0;top:0;bottom:0;background:var(--mid);max-width:100%}
.cell.full i{background:var(--fill)}
.cell span{position:relative;font-weight:600}
.cell span small{font-weight:400;color:var(--muted);font-size:calc(11px*var(--fz))}
.cell.on::after{content:"";position:absolute;inset:0;border-radius:8px;box-shadow:inset 0 0 0 1.5px var(--ink);pointer-events:none}

/* ---------- Итоги (листаемое окно) ---------- */
.rc-scrim{position:fixed;inset:0;z-index:50;background:rgba(20,23,31,.38);display:grid;place-items:center;padding:16px}
.rc{width:min(600px,100%);max-height:100%;background:var(--surface);border-radius:28px;box-shadow:0 40px 90px -30px rgba(20,23,31,.5);display:grid;grid-template-rows:auto minmax(0,1fr) auto;overflow:hidden}
.rc-top{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:14px 16px 0 22px}
.rc-top .mswitch b{min-width:150px}
.rc-view{overflow:hidden;touch-action:pan-y}
.rc-track{display:flex;transition:transform .38s cubic-bezier(.2,.7,.2,1);height:100%}
.sl{flex:0 0 100%;min-width:0;padding:18px 26px 8px;display:grid;align-content:start;gap:14px;overflow:auto;min-height:340px;max-height:62vh}
.sl h3{margin:0;font-family:var(--display);font-weight:300;font-size:clamp(24px,5vw,36px);letter-spacing:-.03em;line-height:1.1;text-wrap:balance}
.sl .big{font-family:var(--display);font-size:clamp(46px,11vw,84px);letter-spacing:-.05em;line-height:1;font-variant-numeric:tabular-nums}
.sl .big small{font-family:var(--body);font-size:.24em;letter-spacing:0;color:var(--muted);margin-left:8px}
.sl p{margin:0;font-size:calc(15px*var(--fz));max-width:52ch}
.sl p.m{color:var(--muted);font-size:calc(13px*var(--fz))}
.rr{display:grid;grid-template-columns:minmax(90px,150px) minmax(0,1fr) auto;gap:10px;align-items:center;font-size:calc(13px*var(--fz))}
.rr span:last-child{color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.rr .bar{height:8px}
.rl2{list-style:none;margin:0;padding:0;display:grid}
.rl2 li{display:flex;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line);font-weight:500}
.rl2 li:first-child{border-top:0}
.rl2 li i{width:9px;height:9px;border-radius:50%;background:var(--fill);flex:none}
.rl2 li span{margin-left:auto;color:var(--muted);font-weight:400;font-size:calc(12px*var(--fz));white-space:nowrap;font-variant-numeric:tabular-nums}
.rc-bot{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 16px 16px}
.dots{display:flex;gap:6px}
.dots button{width:8px;height:8px;border-radius:50%;border:0;padding:0;background:var(--soft-2)}
.dots button[aria-current="true"]{background:var(--ink);width:22px;border-radius:99px}

.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--bg);border-radius:12px;padding:10px 16px;font-size:calc(13px*var(--fz));z-index:70;max-width:calc(100% - 32px)}

/* ---------- выбор нескольких значений в фильтрах ---------- */
.msel{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:4px 28px 4px 10px;min-height:35px;max-width:300px;position:relative;font-size:calc(13px*var(--fz));color:var(--muted);white-space:nowrap;overflow:hidden}
.msel::after{content:"";position:absolute;right:11px;top:50%;width:6px;height:6px;border-right:1.5px solid var(--muted);border-bottom:1.5px solid var(--muted);transform:translateY(-70%) rotate(45deg)}
.msel:hover,.msel[aria-expanded="true"]{border-color:var(--muted)}
.msel.on{padding-left:5px}
.mt{border-radius:7px;padding:3px 8px;background:var(--mid);color:var(--deep);font-weight:600;font-size:calc(12px*var(--fz));overflow:hidden;text-overflow:ellipsis}
.mm{color:var(--ink);font-weight:600;font-size:calc(12px*var(--fz))}
.mpop{position:fixed;z-index:45;min-width:230px;max-width:calc(100vw - 16px);max-height:min(380px,calc(100% - 16px));overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:0 20px 50px -16px var(--shadow);padding:6px;display:grid;gap:2px}
.mpop button{border:0;background:none;display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:9px;text-align:left;font-size:calc(13px*var(--fz));color:var(--ink)}
.mpop button:hover{background:var(--soft)}
.mpop button i{width:10px;height:10px;border-radius:50%;background:var(--fill);flex:none}
.mpop button u{margin-left:auto;text-decoration:none;font-weight:600;visibility:hidden;padding-left:12px}
.mpop button[aria-selected="true"]{background:var(--tint);color:var(--deep);font-weight:600}
.mpop button[aria-selected="true"] u{visibility:visible}
.mpop .clr{justify-content:center;color:var(--muted);margin-top:4px;border-top:1px solid var(--line);border-radius:0 0 9px 9px}

/* ---------- Настройки ---------- */
#view-settings{grid-template-columns:210px minmax(0,1fr);gap:clamp(16px,2.4vw,40px)}
.s-nav{display:grid;align-content:start;gap:4px}
.s-nav button{border:0;background:none;text-align:left;padding:10px 14px;border-radius:12px;font-weight:500;color:var(--muted);white-space:nowrap}
.s-nav button:hover{background:var(--soft);color:var(--ink)}
.s-nav button[aria-current="true"]{background:var(--soft);color:var(--ink);font-weight:600}
.s-body{min-height:0;min-width:0;display:grid}
.s-form{min-height:0;overflow:auto;display:grid;align-content:start;gap:30px;padding:2px 6px 24px 2px}
.s-g{display:grid;max-width:860px}
.s-g h2{margin:0 0 6px;font-family:var(--display);font-weight:400;font-size:calc(20px*var(--fz));letter-spacing:-.02em}
.s-g>p{margin:0 0 10px;color:var(--muted);font-size:calc(13px*var(--fz));max-width:68ch}
.s-r{display:flex;align-items:center;gap:10px 20px;flex-wrap:wrap;padding:12px 0;border-top:1px solid var(--line)}
.s-r>span:first-child{flex:1 1 240px;min-width:0;font-weight:500}
.s-r>span:first-child small{display:block;font-weight:400;color:var(--muted);font-size:calc(12px*var(--fz));max-width:60ch;margin-top:2px}
.s-c{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.s-c:empty{display:none}
.num{display:inline-flex;align-items:center;gap:6px;color:var(--muted)}
.num .inp{width:84px;text-align:right;font-variant-numeric:tabular-nums}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--fill);margin-right:9px}
.sw{display:flex;gap:6px;flex-wrap:wrap}
