<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
<title>Колесо жизни</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600&family=Unbounded:wght@300;400;600&display=swap" rel="stylesheet">
<style>
/* Layout: одна страница без прокрутки. Вкладки: Сферы (колесо из 3 карточек + панель), Календарь (дни листаются по горизонтали), Привычки, Отчёт. Только светлая тема. */
:root{
  --bg:#FFFFFF; --surface:#FFFFFF; --soft:#F4F5F8; --soft-2:#ECEEF3; --ink:#14171F; --muted:#737B8A; --line:#E4E7ED;
  --shadow:rgba(40,55,90,.18); --red:#F0453A;
  --display:"Unbounded","Onest",system-ui,sans-serif;
  --body:"Onest",system-ui,-apple-system,"Segoe UI",sans-serif;
  --hh:46px;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);overflow:hidden;font-size:14px;line-height:1.4}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{color:var(--ink)}
::placeholder{color:var(--muted);opacity:1}
button{cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
/* полосы прокрутки: боковых нет, нижняя светлая */
@supports selector(::-webkit-scrollbar){
  ::-webkit-scrollbar{width:0;height:10px}
  ::-webkit-scrollbar-track{background:var(--surface)}
  ::-webkit-scrollbar-thumb{background:var(--soft-2);border-radius:99px;border:3px solid var(--surface)}
  ::-webkit-scrollbar-thumb:hover{background:#D9DDE5}
  ::-webkit-scrollbar-corner{background:var(--surface)}
}
@supports not selector(::-webkit-scrollbar){*{scrollbar-color:var(--soft-2) var(--surface);scrollbar-width:thin}}
.sph{--fill:oklch(.78 .135 var(--h));--deep:oklch(.47 .15 var(--h));--tint:oklch(.955 .04 var(--h));--mid:oklch(.9 .075 var(--h))}

.app{height:100%;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr);gap:16px;padding-inline:clamp(16px,2.2vw,36px);padding-block:16px 20px}

/* top bar */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px 20px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--display);font-size:16px;letter-spacing:-.01em;white-space:nowrap}
.brand svg{width:24px;height:24px}
.brand-w{position:relative}
button.brand{border:0;background:none;padding:6px 10px 6px 6px;margin:-6px -10px -6px -6px;border-radius:14px;color:var(--ink)}
button.brand:hover,button.brand[aria-expanded="true"]{background:var(--soft)}
.brand .car{font-family:var(--body);font-size:11px;color:var(--muted)}
.menu{position:absolute;top:calc(100% + 12px);left:-6px;z-index:30;width:min(320px,calc(100vw - 32px));background:var(--surface);border:1px solid var(--line);border-radius:20px;box-shadow:0 24px 60px -16px var(--shadow);padding:14px;display:grid;gap:10px}
.sites{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.sites li{display:flex;align-items:center;gap:4px}
.sites a{flex:1;min-width:0;display:grid;padding:8px 10px;border-radius:12px;text-decoration:none;font-weight:600}
.sites a:hover{background:var(--soft)}
.sites a small{font-weight:400;color:var(--muted);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sites button{border:0;background:none;color:var(--muted);width:28px;height:28px;border-radius:50%;font-size:15px}
.sites button:hover{background:var(--soft);color:var(--ink)}
.tabs,.seg{display:flex;gap:4px;background:var(--soft);border-radius:999px;padding:4px}
.tabs button,.seg button{border:0;background:none;border-radius:999px;padding:8px 18px;font-weight:500;color:var(--muted);white-space:nowrap}
.seg button{padding:6px 12px;font-size:13px}
.tabs button[aria-selected="true"],.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 2px 8px -2px var(--shadow)}
.top-r{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pill{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-size:13px;font-weight:500;white-space:nowrap;font-variant-numeric:tabular-nums}
.fact{border:0;background:none;font-size:11px;font-weight:400;color:#A3AAB6;padding:4px 6px;border-radius:8px;white-space:nowrap;font-variant-numeric:tabular-nums}
.fact:hover{background:var(--soft);color:var(--muted)}
.fact u{margin-left:5px}
.mswitch{display:flex;align-items:center;border:1px solid var(--line);border-radius:999px;padding:2px}
.mswitch b{min-width:118px;text-align:center;font-weight:600;font-size:13px}
.ib{border:0;background:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:16px;line-height:1;color:var(--ink);flex:none}
.ib:hover{background:var(--soft)}
.ib:disabled{opacity:.3;cursor:default}
.view{min-height:0;display:grid}

/* ---------- Сферы ---------- */
#view-spheres{grid-template-columns:clamp(290px,26vw,380px) minmax(0,1fr);gap:clamp(16px,2.4vw,40px)}
.wheel{display:grid;align-content:center;gap:10px;min-height:0;outline:none;touch-action:none;user-select:none}
.stack{position:relative;height:calc(3*var(--ch) + 2*12px);margin-block:40px;--ch:96px}
.card{position:absolute;left:0;right:0;top:0;height:var(--ch);display:flex;align-items:center;gap:16px;padding:14px 18px 14px 16px;
  border:1.5px solid var(--mid);border-radius:26px;background:var(--surface);text-align:left;will-change:transform,opacity;transition:background .2s,box-shadow .2s,border-color .2s}
.card:hover{background:var(--tint)}
.card.on{background:var(--tint);border-color:var(--fill);box-shadow:inset 0 0 0 1px var(--fill),0 16px 30px -18px var(--shadow)}
.card>*{opacity:var(--co,1)}
.tile{flex:none;width:64px;height:64px;border-radius:18px;background:var(--fill);color:#fff;display:grid;place-items:center}
.tile svg{width:30px;height:30px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.card .t{min-width:0;display:grid;gap:3px}
.card .n{font-weight:600;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .m{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums;white-space:nowrap}
.card.on .m{color:var(--deep)}
.wnav{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
.wnav .ib{border:1px solid var(--line)}
.budget{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;line-height:1.6}
.budget b{color:var(--ink);font-weight:600}
.budget b.over{color:#C4352B}
.budget input{width:4.2ch;border:0;border-bottom:1px dashed var(--line);background:none;padding:0;text-align:center;font-weight:600;-moz-appearance:textfield}
.budget input::-webkit-outer-spin-button,.budget input::-webkit-inner-spin-button{-webkit-appearance:none}

.panel{border:1px solid var(--line);border-radius:32px;padding:clamp(20px,2.4vw,36px);display:grid;grid-template-rows:auto auto minmax(0,1fr);gap:clamp(16px,2.2vh,28px);min-height:0;overflow:auto;box-shadow:0 30px 60px -44px var(--shadow)}
.p-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap}
.eyebrow{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:12px;letter-spacing:.08em;text-transform:uppercase;font-weight:500}
.eyebrow .tile{width:34px;height:34px;border-radius:11px}
.eyebrow .tile svg{width:18px;height:18px}
h1{margin:10px 0 0;font-family:var(--display);font-weight:300;font-size:clamp(28px,3.5vw,54px);line-height:1.05;letter-spacing:-.03em;text-wrap:balance}
.p-act{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chip{display:flex;align-items:center;gap:8px;border-radius:999px;background:var(--tint);color:var(--deep);padding:8px 14px;font-weight:600;font-size:13px;white-space:nowrap;font-variant-numeric:tabular-nums}
.chip i{width:8px;height:8px;border-radius:50%;background:var(--fill)}
.btn{border:0;border-radius:999px;background:var(--ink);color:#fff;padding:9px 16px;font-weight:500;font-size:13px;white-space:nowrap;text-decoration:none;display:inline-block}
.btn:hover{opacity:.88}
.btn.ghost{background:var(--soft);color:var(--ink)}
.btn.danger{background:none;color:#C4352B;padding-inline:8px}
.btn:disabled{opacity:.35;cursor:default}
.inp{border:1px solid var(--line);border-radius:10px;padding:7px 10px;background:var(--surface);color:var(--ink);min-width:0}

.metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-block:1px solid var(--line)}
.metric{padding:clamp(14px,2vh,22px) clamp(12px,1.4vw,22px);display:grid;align-content:start;gap:8px;min-width:0}
.metric+.metric{border-left:1px solid var(--line)}
.metric:first-child{padding-left:0}
.lab{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:500}
.val{font-family:var(--display);font-weight:400;font-size:clamp(24px,2.7vw,42px);letter-spacing:-.04em;line-height:1;font-variant-numeric:tabular-nums;white-space:nowrap}
.val small{font-family:var(--body);font-size:.36em;letter-spacing:0;color:var(--muted);font-weight:500;margin-left:6px}
.val input{width:3.2ch;min-width:2.6em;font-family:var(--display);font-size:1em;letter-spacing:-.04em;border:0;border-bottom:2px dashed var(--line);background:none;padding:0;-moz-appearance:textfield;font-variant-numeric:tabular-nums}
.val input::-webkit-outer-spin-button,.val input::-webkit-inner-spin-button{-webkit-appearance:none}
.val input:focus{outline:0;border-bottom-color:var(--ink)}
.sub{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.bar{height:6px;border-radius:99px;background:var(--soft);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:var(--fill);max-width:100%}
.lower{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:clamp(20px,3vw,48px);min-height:0}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:12px}
.sec-h h2{margin:0;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:500}
.sec-h span{font-size:12px;color:var(--muted)}
.mb{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:clamp(6px,1vw,14px);height:clamp(120px,22vh,220px)}
.mb-c{border:0;background:none;padding:0;display:grid;grid-template-rows:auto 1fr auto;gap:6px;justify-items:center;min-width:0}
.mb-t{position:relative;width:100%;height:100%;border-radius:12px;background:var(--soft);display:flex;align-items:flex-end;overflow:hidden}
.mb-t i{display:block;width:100%;background:var(--mid)}
.mb-c.on .mb-t i{background:var(--fill)}
.mb-t u{position:absolute;left:0;right:0;border-top:2px dashed var(--deep);opacity:.55}
.mb-v{font-size:12px;font-weight:600;font-variant-numeric:tabular-nums}
.mb-l{font-size:12px;color:var(--muted)}
.mb-c.on .mb-l{color:var(--ink);font-weight:600}
.ach{list-style:none;margin:0;padding:0}
.ach li{display:flex;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line);font-weight:500}
.ach li:first-child{border-top:0;padding-top:0}
.ach li span.d{margin-left:auto;color:var(--muted);font-size:12px;font-weight:400;white-space:nowrap;font-variant-numeric:tabular-nums}
.ach .ic{flex:none;width:28px;height:28px;border-radius:50%;background:var(--tint);color:var(--deep);display:grid;place-items:center;font-size:13px}
.note{color:var(--muted);font-size:13px;max-width:44ch;margin:0}

/* ---------- Календарь ---------- */
#view-calendar{grid-template-columns:232px minmax(0,1fr);gap:24px}
.side{display:grid;align-content:start;gap:20px;min-height:0;overflow:auto;padding-right:4px}
.mini-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;font-weight:600}
.mini-h>span{display:flex}
.mini{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;font-size:12px;font-variant-numeric:tabular-nums}
.mini span{text-align:center;color:var(--muted);padding:4px 0;font-size:11px}
.mini button{border:0;background:none;aspect-ratio:1;border-radius:8px;padding:0}
.mini button:hover{background:var(--soft-2)}
.mini button.out{color:#B6BCC8}
.mini button.wk{background:var(--soft)}
.mini button.today{background:var(--red);color:#fff;font-weight:600}
.leg{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.leg li{display:flex;align-items:center;gap:10px;padding:5px 0;font-size:13px}
.leg i{width:11px;height:11px;border-radius:4px;background:var(--fill);flex:none}
.leg span{margin-left:auto;color:var(--muted);font-variant-numeric:tabular-nums;font-size:12px}
.side h3{margin:0 0 6px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:500}

.cal-main{display:grid;grid-template-rows:auto minmax(0,1fr);gap:10px;min-width:0;min-height:0}
.wk-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.wk-head h2{margin:0;font-family:var(--display);font-weight:400;font-size:22px;letter-spacing:-.02em}
.wk-nav{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.tg{--gw:52px;overflow:auto;border:1px solid var(--line);border-radius:20px;min-height:0;position:relative;scroll-snap-type:x proximity;scroll-padding-left:var(--gw);overscroll-behavior:contain;user-select:none}
.tg-in{width:max-content;min-width:100%}
.tg-head{position:sticky;top:0;z-index:6;background:var(--surface);border-bottom:1px solid var(--line)}
.tg-row{display:flex}
.corner{position:sticky;left:0;z-index:2;flex:0 0 var(--gw);background:var(--surface);font-size:10px;color:var(--muted);display:grid;place-items:center}
.dh{flex:0 0 var(--cw);text-align:center;padding:10px 4px 6px;font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden}
.dh.today{color:var(--ink);font-weight:600}
.dh.today b{background:var(--red);color:#fff;border-radius:6px;padding:1px 6px;margin-left:4px}
.dh b{font-weight:500;font-variant-numeric:tabular-nums}
.dh.m1{box-shadow:inset 1px 0 0 var(--ink)}
.ad{flex:0 0 var(--cw);padding:0 3px 6px;min-height:8px;overflow:hidden}
.hb{width:100%;border:0;border-radius:7px;background:var(--soft);color:var(--muted);font-size:11px;padding:3px 6px;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.hb.full{background:#E3F6E8;color:#1F6B3A}
.hb:hover{background:var(--soft-2)}
.tg-body{display:flex;height:calc(24*var(--hh));position:relative}
.gut{position:sticky;left:0;z-index:5;flex:0 0 var(--gw);background:var(--surface)}
.gut span{position:absolute;right:8px;transform:translateY(-50%);font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.day{flex:0 0 var(--cw);position:relative;border-left:1px solid var(--line);scroll-snap-align:start;cursor:crosshair;
  background:repeating-linear-gradient(to bottom,transparent 0,transparent calc(var(--hh) - 1px),var(--line) calc(var(--hh) - 1px),var(--line) var(--hh))}
.day.today{background-color:#FFFAF9}
.day.we{background-color:#FBFBFD}
.ev{position:absolute;border:0;border-radius:8px;padding:3px 6px 3px 8px;text-align:left;overflow:hidden;background:var(--mid);color:var(--deep);box-shadow:inset 3px 0 0 var(--fill);font-size:12px;line-height:1.25;display:flex;flex-direction:column;justify-content:flex-start;align-items:stretch;cursor:grab;touch-action:pan-x pan-y}
.ev::before,.ev::after{content:"";position:absolute;left:0;right:0;height:6px;cursor:ns-resize}
.ev::before{top:0}.ev::after{bottom:0}
.ev b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev span{font-size:11px;opacity:.8;font-variant-numeric:tabular-nums;white-space:nowrap}
.ev.future{background:var(--tint)}
.ev.wait{background:var(--tint);box-shadow:inset 3px 0 0 var(--fill),inset 0 0 0 1px var(--fill)}
.ev.skip{background:var(--soft);color:var(--muted);box-shadow:inset 3px 0 0 #C9CED8}
.ev.skip b{text-decoration:line-through}
.ev.dragging{opacity:.3}
.ev.ghost{pointer-events:none;background:var(--mid);box-shadow:inset 0 0 0 1.5px var(--deep),0 10px 24px -10px var(--shadow);left:2px;right:2px;z-index:8;cursor:grabbing}
.ev.ghost.plain{background:var(--soft-2);box-shadow:inset 0 0 0 1.5px var(--ink);color:var(--ink)}
.now{position:absolute;left:0;right:0;height:2px;background:var(--red);z-index:3;pointer-events:none}
.now::before{content:"";position:absolute;left:-4px;top:-3px;width:8px;height:8px;border-radius:50%;background:var(--red)}
/* месяц */
.mg{border:1px solid var(--line);border-radius:20px;min-height:0;overflow:auto;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));grid-template-rows:auto;grid-auto-rows:minmax(92px,1fr)}
.mg .mh{padding:8px;text-align:center;font-size:12px;color:var(--muted);border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surface);z-index:2}
.mc{border-left:1px solid var(--line);border-bottom:1px solid var(--line);padding:4px;display:grid;align-content:start;gap:2px;min-width:0;cursor:pointer}
.mc:nth-child(7n+1){border-left:0}
.mc.out{background:#FBFBFD}
.mc .dn{border:0;background:none;justify-self:start;border-radius:7px;padding:1px 6px;font-size:12px;font-variant-numeric:tabular-nums}
.mc.out .dn{color:#B6BCC8}
.mc.today .dn{background:var(--red);color:#fff;font-weight:600}
.me{border:0;background:var(--tint);color:var(--deep);border-radius:6px;font-size:11px;padding:1px 5px;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.me.skip{background:var(--soft);color:var(--muted);text-decoration:line-through}
.more{font-size:11px;color:var(--muted);border:0;background:none;text-align:left;padding:0 5px}

/* popovers */
.scrim{position:fixed;inset:0;z-index:40}
.pop{position:fixed;z-index:41;width:min(350px,calc(100vw - 32px));background:var(--surface);border:1px solid var(--line);border-radius:20px;box-shadow:0 24px 60px -16px var(--shadow);padding:16px;display:grid;gap:12px;max-height:calc(100% - 16px);overflow:auto}
.pop input[type=text]{border:0;border-bottom:1px solid var(--line);padding:6px 0;font-size:17px;font-weight:600;width:100%;background:none}
.pop input[type=text]:focus{outline:0;border-bottom-color:var(--ink)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row input,.row select{border:1px solid var(--line);border-radius:10px;padding:6px 8px;background:var(--surface);min-width:0}
.row .dur{color:var(--muted);font-size:12px;margin-left:auto;font-variant-numeric:tabular-nums}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{border:0;border-radius:999px;padding:5px 11px 5px 9px;font-size:12px;font-weight:500;background:var(--soft);display:flex;align-items:center;gap:6px}
.chips button i{width:8px;height:8px;border-radius:50%;background:var(--fill)}
.chips button[aria-pressed="true"]{background:var(--mid);color:var(--deep);box-shadow:inset 0 0 0 1.5px var(--fill)}
.chk{display:flex;gap:8px;align-items:center;font-size:13px}
.pop-f{display:flex;justify-content:space-between;align-items:center;gap:8px}
.pop .lab{margin-bottom:-4px}

/* ---------- Привычки ---------- */
#view-habits{grid-template-columns:minmax(260px,330px) minmax(0,1fr);gap:clamp(16px,2.4vw,40px)}
.h-side{display:grid;align-content:start;gap:18px;min-height:0;overflow:auto;padding:2px}
.h-main{display:grid;align-content:start;gap:24px;min-height:0;overflow:auto}
.box{border:1px solid var(--line);border-radius:22px;padding:16px;display:grid;gap:10px}
.box-h{display:flex;align-items:center;justify-content:space-between;gap:8px;font-weight:600}
.hd{display:grid;gap:8px}
.hd-r{display:flex;align-items:center;gap:10px}
.hd-r>span{min-width:0;flex:1;font-weight:500}
.hd-r>span small{display:block;color:var(--muted);font-weight:400;font-size:12px}
.tog{border:1.5px solid var(--line);background:var(--surface);width:34px;height:34px;border-radius:11px;font-size:16px;color:transparent;flex:none}
.tog[aria-pressed="true"]{background:var(--fill);border-color:var(--fill);color:#fff}
.tog:disabled,.stp button:disabled{opacity:.35;cursor:default}
.stp{display:flex;align-items:center;gap:4px;flex:none}
.stp button{border:1px solid var(--line);background:var(--surface);width:30px;height:30px;border-radius:10px;font-size:16px;line-height:1}
.stp b{min-width:26px;text-align:center;font-variant-numeric:tabular-nums;white-space:nowrap}
.p-act .stp{background:var(--soft);border-radius:999px;padding:4px 6px 4px 14px;gap:6px;font-size:13px}
.p-act .stp button{border-radius:50%}
.hl{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.hl li{display:flex;align-items:center;gap:8px;font-size:13px}
.hl li i{width:9px;height:9px;border-radius:50%;background:var(--fill);flex:none}
.hl li span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hl button{border:0;background:none;color:var(--muted);font-size:12px;padding:2px 4px;border-radius:6px}
.hl button:hover{background:var(--soft);color:var(--ink)}
.hform{display:grid;gap:8px}
.hm-wrap{overflow-x:auto}
.hm{display:grid;gap:3px;align-items:center;min-width:760px}
.hm .hn{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:8px;display:flex;align-items:center;gap:8px}
.hm .hn i{width:9px;height:9px;border-radius:50%;background:var(--fill);flex:none}
.hm .dd{font-size:11px;color:var(--muted);text-align:center;font-variant-numeric:tabular-nums}
.hm .dd.t{color:#fff;background:var(--red);border-radius:5px}
.hm .dd.s{color:var(--ink);font-weight:600}
.hc{border:0;aspect-ratio:1;border-radius:7px;background:var(--soft);font-size:11px;font-weight:600;padding:0;color:var(--deep);font-variant-numeric:tabular-nums}
.hc.on{background:var(--fill);color:#fff}
.hc.z{background:#E3F6E8;color:#1F6B3A}
.hc.c1{background:var(--tint)}.hc.c2{background:var(--mid)}.hc.c3{background:var(--fill);color:#fff}
.hc:disabled{background:none;box-shadow:inset 0 0 0 1px var(--line);cursor:default}
.hm .hs{font-size:12px;color:var(--muted);padding-left:8px;white-space:nowrap;font-variant-numeric:tabular-nums}
.hstats{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:0 28px}
.hstat{border-top:1px solid var(--line);padding:14px 0;display:grid;gap:6px;align-content:start}
.hstat .val{font-size:clamp(22px,2.2vw,34px)}

/* ---------- Цели ---------- */
#view-goals{grid-template-rows:auto minmax(0,1fr);gap:14px}
.g-bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.g-bar .inp{width:210px}
.fchip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:500;color:var(--muted);white-space:nowrap}
.fchip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.g-bar .cnt{margin-left:auto;color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.g-wrap{overflow:auto;border:1px solid var(--line);border-radius:20px;min-height:0}
.g-t{display:grid;grid-template-columns:minmax(240px,1.4fr) 168px 168px minmax(220px,1.6fr) 96px;min-width:880px}
.g-t>*{border-bottom:1px solid var(--line);padding:5px 10px;display:flex;align-items:center;min-width:0}
.g-h{position:sticky;top:0;background:var(--surface);z-index:2;padding-block:8px}
.g-h button{border:0;background:none;padding:2px 4px;border-radius:6px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:500}
.g-h button:hover,.g-h button.on{color:var(--ink)}
.g-t .gn,.g-t textarea{border:0;background:none;width:100%;padding:6px;border-radius:8px;resize:none;field-sizing:content;font:inherit;color:inherit;min-height:32px;max-height:120px}
.g-t .gn{font-weight:600}
.g-t textarea::placeholder{color:transparent}
.g-t textarea:hover::placeholder,.g-t textarea:focus::placeholder{color:var(--muted)}
.g-t .gn:hover,.g-t textarea:hover{background:var(--soft)}
.g-t .gn:focus,.g-t textarea:focus{background:var(--soft);outline:0;box-shadow:inset 0 0 0 1.5px var(--ink)}
.g-t .dn-row .gn{color:var(--muted)}
.tag{appearance:none;-webkit-appearance:none;border:0;border-radius:8px;padding:5px 10px;font-weight:600;font-size:12px;background:var(--mid);color:var(--deep);max-width:100%;cursor:pointer}
.tag.gr{background:var(--soft-2);color:var(--muted)}
.g-x{border:0;background:none;color:var(--muted);font-size:12px;padding:4px 6px;border-radius:6px;white-space:nowrap}
.g-x:hover{background:var(--soft);color:var(--ink)}
.g-empty{grid-column:1/-1;color:var(--muted);padding:22px 14px}

/* ---------- Дневник ---------- */
#view-diary{grid-template-columns:minmax(280px,380px) minmax(0,1fr);gap:clamp(16px,2.4vw,40px)}
.d-side{display:grid;align-content:start;gap:18px;min-height:0;overflow:auto;padding:2px}
.d-main{display:grid;align-content:start;gap:18px;min-height:0;overflow:auto;padding-right:2px}
.d-side textarea{min-height:130px;resize:vertical;font:inherit;line-height:1.5;width:100%}
.d-side .row .inp{flex:1}
.d-bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.d-bar .cnt{margin-left:auto;color:var(--muted);font-size:13px}
.d-spot{border-radius:26px;background:var(--tint);padding:24px 26px;display:grid;gap:10px}
.d-spot p{margin:0;font-family:var(--display);font-weight:300;font-size:clamp(20px,2.4vw,32px);line-height:1.2;letter-spacing:-.02em;text-wrap:balance;color:var(--deep);white-space:pre-wrap}
.d-m h3{margin:0 0 4px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:500}
.d-e{display:grid;grid-template-columns:58px minmax(0,1fr) auto;gap:14px;padding:14px 0;border-top:1px solid var(--line);align-items:start}
.d-e .dt{font-family:var(--display);font-size:26px;line-height:1;letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.d-e .dt small{display:block;font-family:var(--body);font-size:11px;letter-spacing:0;color:var(--muted);margin-top:4px}
.d-e p{margin:0;font-size:15px;line-height:1.5;white-space:pre-wrap;max-width:68ch}
.d-e .sp{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--deep);margin-top:6px}
.d-e .sp i{width:8px;height:8px;border-radius:50%;background:var(--fill)}
.sug{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.sug li{display:flex;align-items:center;gap:8px;font-size:13px}
.sug li span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sug li small{color:var(--muted)}

/* ---------- Отчёт ---------- */
#view-report{grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);gap:22px clamp(20px,3vw,48px);overflow:auto;align-content:start}
.sum{grid-column:1/-1;display:grid;grid-template-columns:repeat(4,minmax(0,1fr)) auto;align-items:start;border-bottom:1px solid var(--line)}
.sum .metric{padding:4px 18px 16px;border-left:1px solid var(--line)}
.sum .metric:first-child{padding-left:0;border-left:0}
.sum .val{font-size:clamp(22px,2.3vw,36px)}
.rc-btns{display:grid;gap:8px;padding-left:18px}
.bal svg{width:100%;height:auto;max-height:300px;display:block}
.bal text{font-family:var(--body);font-size:11px;fill:var(--muted)}
.bal .ring{fill:none;stroke:var(--line)}
.bal .sec{fill:var(--fill);stroke:#fff;stroke-width:1.5;cursor:pointer}
.bal .sec:hover{fill:var(--deep)}
.mat{min-width:0;overflow-x:auto}
.mat.full{grid-column:1/-1}
.mat-g{display:grid;gap:4px;justify-content:start}
.mat-g .hdc{font-size:12px;color:var(--muted);text-align:center;padding:2px 0 4px}
.mat-g .hdc.on{color:var(--ink);font-weight:600}
button.hdc{border:0;background:none;border-radius:8px}
button.hdc:hover{background:var(--soft);color:var(--ink)}
.mat .fact{margin-top:10px;padding-left:0}
.mat-g .rl{display:flex;align-items:center;gap:8px;padding-right:10px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px}
.mat-g .rl i{width:10px;height:10px;border-radius:3px;background:var(--fill);flex:none}
.cell{position:relative;border:0;height:28px;border-radius:8px;background:var(--soft);overflow:hidden;padding:0 8px;text-align:left;font-size:12px;font-variant-numeric:tabular-nums}
.cell i{position:absolute;left:0;top:0;bottom:0;background:var(--mid);max-width:100%}
.cell.full i{background:var(--fill)}
.cell span{position:relative;font-weight:600}
.cell span small{font-weight:400;color:var(--muted);font-size:11px}
.cell.on::after{content:"";position:absolute;inset:0;border-radius:8px;box-shadow:inset 0 0 0 1.5px var(--ink);pointer-events:none}

/* ---------- Итоги (листаемое окно) ---------- */
.rc-scrim{position:fixed;inset:0;z-index:50;background:rgba(20,23,31,.38);display:grid;place-items:center;padding:16px}
.rc{width:min(600px,100%);max-height:100%;background:var(--surface);border-radius:28px;box-shadow:0 40px 90px -30px rgba(20,23,31,.5);display:grid;grid-template-rows:auto minmax(0,1fr) auto;overflow:hidden}
.rc-top{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:14px 16px 0 22px}
.rc-top .mswitch b{min-width:150px}
.rc-view{overflow:hidden;touch-action:pan-y}
.rc-track{display:flex;transition:transform .38s cubic-bezier(.2,.7,.2,1);height:100%}
.sl{flex:0 0 100%;min-width:0;padding:18px 26px 8px;display:grid;align-content:start;gap:14px;overflow:auto;min-height:340px;max-height:62vh}
.sl h3{margin:0;font-family:var(--display);font-weight:300;font-size:clamp(24px,5vw,36px);letter-spacing:-.03em;line-height:1.1;text-wrap:balance}
.sl .big{font-family:var(--display);font-size:clamp(46px,11vw,84px);letter-spacing:-.05em;line-height:1;font-variant-numeric:tabular-nums}
.sl .big small{font-family:var(--body);font-size:.24em;letter-spacing:0;color:var(--muted);margin-left:8px}
.sl p{margin:0;font-size:15px;max-width:52ch}
.sl p.m{color:var(--muted);font-size:13px}
.rr{display:grid;grid-template-columns:minmax(90px,150px) minmax(0,1fr) auto;gap:10px;align-items:center;font-size:13px}
.rr span:last-child{color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.rr .bar{height:8px}
.rl2{list-style:none;margin:0;padding:0;display:grid}
.rl2 li{display:flex;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line);font-weight:500}
.rl2 li:first-child{border-top:0}
.rl2 li i{width:9px;height:9px;border-radius:50%;background:var(--fill);flex:none}
.rl2 li span{margin-left:auto;color:var(--muted);font-weight:400;font-size:12px;white-space:nowrap;font-variant-numeric:tabular-nums}
.rc-bot{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 16px 16px}
.dots{display:flex;gap:6px}
.dots button{width:8px;height:8px;border-radius:50%;border:0;padding:0;background:var(--soft-2)}
.dots button[aria-current="true"]{background:var(--ink);width:22px;border-radius:99px}

.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:#fff;border-radius:12px;padding:10px 16px;font-size:13px;z-index:70;max-width:calc(100% - 32px)}

@media (max-width:1100px){
  .lower{grid-template-columns:1fr}
  #view-report{grid-template-columns:minmax(0,1fr)}
  #view-calendar{grid-template-columns:1fr}
  .side{display:none}
}
@media (max-width:820px){
  #view-spheres,#view-habits,#view-diary{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr);gap:10px}
  #view-habits,#view-diary{overflow:auto;grid-template-rows:auto auto}
  .h-side,.h-main,.d-side,.d-main{overflow:visible}
  .tabs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-radius:22px}
  .g-bar .cnt{margin-left:0}
  .stack{--ch:62px;margin-block:26px}
  .card{gap:12px;padding:8px 14px 8px 8px;border-radius:18px}
  .tile{width:46px;height:46px;border-radius:13px}
  .tile svg{width:22px;height:22px}
  .card .n{font-size:15px}
  .wnav,.budget{display:none}
  .metrics{grid-template-columns:repeat(2,minmax(0,1fr))}
  .metric:nth-child(odd){padding-left:0;border-left:0}
  .metric:nth-child(n+3){border-top:1px solid var(--line)}
  .panel{border-radius:24px}
  .sum{grid-template-columns:repeat(2,minmax(0,1fr))}
  .sum .metric:nth-child(odd){padding-left:0;border-left:0}
  .rc-btns{grid-column:1/-1;display:flex;padding:0 0 14px}
  .tabs{order:3;width:100%}
  .tabs button{flex:1;padding-inline:10px}
  .tg{--gw:40px}
  .gut span{right:3px;font-size:10px}
  .corner{font-size:8px}
  .seg button{padding:6px 9px}
  .wk-nav .btn{padding:8px 11px}
  .wk-nav{gap:2px}
  .dh{font-size:12px}
  .ev{padding:2px 3px 2px 6px;font-size:11px}
  .mswitch b{min-width:96px}
  .wk-head h2{font-size:18px}
  .sl{padding-inline:18px}
}
@media (prefers-reduced-motion:reduce){.rc-track{transition:none}}
</style>

</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand-w" id="brand-w">
      <button type="button" class="brand" id="brand" aria-haspopup="true" aria-expanded="false" title="Клик: мои сайты. Двойной клик: на главную">
        <svg viewBox="0 0 28 28" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="14" cy="14" r="11"/><circle cx="14" cy="14" r="3.5" fill="currentColor" stroke="none"/><path d="M14 3v7.5M14 17.5V25M3 14h7.5M17.5 14H25" stroke-linecap="round"/></svg>
        Колесо жизни <span class="car">▾</span>
      </button>
      <div class="menu" id="menu" hidden></div>
    </div>
    <nav class="tabs" role="tablist" aria-label="Разделы">
      <button role="tab" data-tab="spheres" aria-selected="true">Сферы</button>
      <button role="tab" data-tab="calendar" aria-selected="false">Календарь</button>
      <button role="tab" data-tab="habits" aria-selected="false">Привычки</button>
      <button role="tab" data-tab="goals" aria-selected="false">Цели</button>
      <button role="tab" data-tab="diary" aria-selected="false">Дневник</button>
      <button role="tab" data-tab="report" aria-selected="false">Отчёт</button>
    </nav>
    <div class="top-r">
      <button class="fact" id="demo-pill" hidden>Это пример<u>скрыть</u></button>
      <div class="mswitch" id="mswitch"><button class="ib" id="m-prev" aria-label="Предыдущий месяц">‹</button><b id="m-label"></b><button class="ib" id="m-next" aria-label="Следующий месяц">›</button></div>
      <button class="fact" id="sync-pill" title="Сверить с календарём сейчас"></button>
    </div>
  </header>

  <main class="view" id="view-spheres">
    <div class="wheel" id="wheel" tabindex="0" aria-label="Сферы жизни">
      <div class="stack" id="stack"></div>
      <div class="wnav"><button class="ib" id="w-up" aria-label="Выше">↑</button><button class="ib" id="w-down" aria-label="Ниже">↓</button><span id="w-count"></span></div>
      <div class="budget" id="budget"></div>
    </div>
    <section class="panel sph" id="panel"></section>
  </main>

  <main class="view" id="view-calendar" hidden>
    <aside class="side">
      <div><div class="mini-h"><span id="mini-title"></span><span><button class="ib" id="mini-prev" aria-label="Предыдущий месяц">‹</button><button class="ib" id="mini-next" aria-label="Следующий месяц">›</button></span></div><div class="mini" id="mini"></div></div>
      <div><h3>Сферы на экране</h3><ul class="leg" id="leg"></ul></div>
    </aside>
    <section class="cal-main">
      <div class="wk-head"><h2 id="wk-title"></h2>
        <div class="wk-nav">
          <div class="seg" id="view-seg"><button data-v="day" aria-pressed="false">День</button><button data-v="week" aria-pressed="true">Неделя</button><button data-v="month" aria-pressed="false">Месяц</button></div>
          <button class="btn ghost" id="wk-today">Сегодня</button><button class="ib" id="wk-prev" aria-label="Назад">‹</button><button class="ib" id="wk-next" aria-label="Вперёд">›</button><button class="btn" id="wk-add">+ Событие</button>
        </div></div>
      <div class="tg" id="tg"><div class="tg-in" id="tg-in"></div></div>
      <div class="mg" id="mg" hidden></div>
    </section>
  </main>

  <main class="view" id="view-habits" hidden></main>
  <main class="view" id="view-goals" hidden></main>
  <main class="view" id="view-diary" hidden></main>
  <main class="view" id="view-report" hidden></main>
</div>

<div class="scrim" id="scrim" hidden></div>
<form class="pop" id="pop" hidden autocomplete="off">
  <input type="text" id="ev-title" placeholder="Название, например: скалолазание" maxlength="80">
  <div class="row"><input type="date" id="ev-date" aria-label="Дата"><input type="time" id="ev-start" step="900" aria-label="Начало"><span>→</span><input type="time" id="ev-end" step="900" aria-label="Конец"><span class="dur" id="ev-dur"></span></div>
  <div class="row"><select id="ev-rep" aria-label="Повтор"><option value="none">Не повторять</option><option value="daily">Каждый день</option><option value="weekdays">По будням</option><option value="weekly">Каждую неделю</option></select>
    <div class="seg" id="ev-scope" hidden><button type="button" data-sc="one" aria-pressed="true">Только это</button><button type="button" data-sc="all" aria-pressed="false">Это и следующие</button></div></div>
  <div class="lab">Сфера</div>
  <div class="chips" id="ev-chips"></div>
  <label class="chk"><input type="checkbox" id="ev-key"> Весомое действие</label>
  <label class="chk"><input type="checkbox" id="ev-skip"> Не сделал, в зачёт не идёт</label>
  <p class="note" id="ev-note" hidden>Это событие из примера. Создай своё первое событие, и примеры исчезнут.</p>
  <div class="pop-f"><button type="button" class="btn danger" id="ev-del">Удалить</button><span class="row"><button type="button" class="btn ghost" id="ev-cancel">Отмена</button><button type="submit" class="btn" id="ev-save">Сохранить</button></span></div>
</form>
<div class="pop" id="hpop" hidden></div>
<div class="rc-scrim" id="recap" hidden>
  <div class="rc" role="dialog" aria-modal="true" aria-label="Итоги">
    <div class="rc-top"><span class="lab" id="rc-kind"></span><div class="mswitch"><button class="ib" id="rc-prev" aria-label="Предыдущий период">‹</button><b id="rc-label"></b><button class="ib" id="rc-next" aria-label="Следующий период">›</button></div><button class="ib" id="rc-close" aria-label="Закрыть">×</button></div>
    <div class="rc-view" id="rc-view"><div class="rc-track" id="rc-track"></div></div>
    <div class="rc-bot"><button class="btn ghost" id="rc-back">Назад</button><div class="dots" id="rc-dots"></div><button class="btn" id="rc-fwd">Дальше</button></div>
  </div>
</div>
<div class="toast" id="toast" hidden></div>

<script>
(function(){
  var $=function(id){return document.getElementById(id)};
  var ICONS={
    rest:'<path d="M3 19l6-10 4 6 2-3 6 7z"/><circle cx="17" cy="6" r="1.6"/>',
    friends:'<circle cx="9" cy="8" r="3"/><circle cx="17" cy="9" r="2.5"/><path d="M3 19c0-3.5 3-5.5 6-5.5s6 2 6 5.5M15 14c3-.5 6 1 6 4"/>',
    crypto:'<path d="M12 3l8 4.5v9L12 21l-8-4.5v-9z"/><path d="M10 8.5v7M10 9h3.2a1.7 1.7 0 010 3.4H10m0 0h3.6a1.7 1.7 0 010 3.4H10"/>',
    love:'<path d="M12 20s-7-4.4-7-10a4 4 0 017-2.5A4 4 0 0119 10c0 5.6-7 10-7 10z"/>',
    growth:'<path d="M4 5h7a1 1 0 011 1v13a3 3 0 00-3-2H4zM20 5h-7a1 1 0 00-1 1v13a3 3 0 013-2h5z"/>',

  function renderGoalRows(){
    var ids=Object.keys(goals),anySt=Object.keys(gF.st).some(function(k){return gF.st[k]}),q=gF.q.trim().toLowerCase();

      return true});
    var k=gSort.k,d=gSort.d;
    list.sort(function(x,y){

      else if(k==='st')c=rank(ST,a.st)-rank(ST,b.st)||rank(PR,a.pr)-rank(PR,b.pr);

    var word=mon?'месяца':'недели',diff=r.tot-p.tot;
    var sl=[];
    sl.push('<div class="lab">Итог '+word+(open?' · на сегодня':'')+'</div><h3>'+rcLabel()+'</h3><div class="big">'+hrs(r.tot)+'<small>ч в зачёте</small></div>'+
      '<p>Это '+(goal?pct(r.tot/goal):0)+'% от цели в '+hrs(goal)+' ч. '+(p.tot?(diff>=0?'На '+hrs(diff)+' ч больше, чем':'На '+hrs(-diff)+' ч меньше, чем')+(mon?' в прошлом месяце.':' неделей раньше.'):'')+'</p>'+
      '<p class="m">Дел сделано: '+r.done+', из них весомых: '+r.keys.length+'. Листай дальше стрелками или свайпом.</p>');
    var by=rows.slice().sort(function(x,y){return y.q-x.q});
    sl.push('<div class="lab">Сферы</div><h3>Кто закрыл цель, а кто отстал</h3>'+by.map(function(x){return '<div class="rr sph" style="--h:'+x.s.h+'"><span>'+x.s.n+'</span><div class="bar"><i style="width:'+pc(x.q)+'%"></i></div><span>'+hrs(x.c)+' / '+hrs(x.g)+' '+U(x.s.id)+'</span></div>'}).join(''));
    var lag=rows.filter(function(x){return x.g-x.c>.05}).sort(function(x,y){return(y.g-y.c)-(x.g-x.c)}),short=lag.reduce(function(t,x){return t+(isD(x.s.id)?0:x.g-x.c)},0);
    var elapsed=Math.max(0,(Math.min(q.b,syncAt)-q.a)/36e5),empty=Math.max(0,elapsed-r.all);
    sl.push('<div class="lab">Где недобежал</div><div class="big">'+hrs(short)+'<small>ч до целей</small></div>'+
      (lag.length?'<ul class="rl2">'+lag.slice(0,4).map(function(x){return '<li class="sph" style="--h:'+x.s.h+'"><i></i>'+x.s.n+'<span>не хватило '+hrs(x.g-x.c)+' '+U(x.s.id)+'</span></li>'}).join('')+'</ul>':'<p>Все цели закрыты.</p>')+
      '<p class="m">Пустых часов без событий: '+hrs(empty)+' из '+hrs(elapsed)+'. Отмечено «не сделал»: '+hrs(r.sk)+' ч.</p>');
    var keys=r.keys.slice().sort(function(x,y){return x.a-y.a});
    sl.push('<div class="lab">Весомые действия</div><h3>'+(keys.length?'Что реально сдвинуло':'Весомых действий не отмечено')+'</h3>'+
      (keys.length?'<ul class="rl2">'+keys.slice(0,8).map(function(e){return '<li class="sph" style="--h:'+hOf(e.s)+'"><i></i>'+esc(e.t)+'<span>'+fmtDay(e.a)+' · '+hrs((e.b-e.a)/36e5)+' ч</span></li>'}).join('')+'</ul>'+(keys.length>8?'<p class="m">И ещё '+(keys.length-8)+'.</p>':'')
        :'<p class="m">Отмечай событие галочкой «Весомое действие», и оно попадёт в итог.</p>'));
    sl.push('<div class="lab">Привычки</div><h3>Что держал, что срывал</h3>'+(habits.length?'<ul class="rl2">'+habits.map(function(h){
      var x=hRange(h,q.a,q.b),y=hRange(h,q.pa,q.a),d=h.type==='hours'?0:h.type==='check'?x.done-y.done:x.sum-y.sum;
      return '<li class="sph" style="--h:'+hOf(h.s)+'"><i></i>'+esc(h.n)+'<span>'+(h.type==='hours'?(x.rec?hrs(x.sum/x.rec):'0')+' ч в среднем, ночей: '+x.rec:h.type==='check'?x.done+' из '+x.n+' дн.':x.sum+' раз')+(d?' ('+(d>0?'+':'−')+Math.abs(d)+')':'')+'</span></li>'}).join('')+'</ul><p class="m">В скобках разница с прошлым периодом.</p>':'<p class="m">Привычек пока нет.</p>'));
    var best=null;Object.keys(r.days).forEach(function(k){if(!best||r.days[k].h>best.h)best=r.days[k]});
    var closed=rows.filter(function(x){return x.g>0&&x.c>=x.g});
    sl.push('<div class="lab">Рекорды и фокус</div><h3>'+(lag.length?'В фокусе дальше: '+lag.slice(0,2).map(function(x){return x.s.n.toLowerCase()}).join(' и '):'Держать темп')+'</h3><ul class="rl2">'+
      '<li><i style="background:var(--ink)"></i>Самый насыщенный день<span>'+(best?fmtDay(best.t)+' · '+hrs(best.h)+' ч':'нет данных')+'</span></li>'+
      '<li><i style="background:var(--ink)"></i>Целей закрыто<span>'+closed.length+' из '+rows.length+'</span></li>'+
      (by[0]&&by[0].q>0?'<li class="sph" style="--h:'+by[0].s.h+'"><i></i>Лучшая сфера<span>'+by[0].s.n+', '+Math.round(by[0].q*100)+'%</span></li>':'')+
      '</ul>'+(lag.length?'<p class="m">Самый большой недобор у этих сфер. Поставь под них слоты в календаре на '+(mon?'первую неделю месяца':'ближайшие дни')+'.</p>':''));
    rc.n=sl.length;rc.i=clamp(rc.i,0,rc.n-1);
    $('rc-kind').textContent=mon?'Итог месяца':'Итог недели';$('rc-label').textContent=rcLabel();
    $('rc-track').innerHTML=sl.map(function(h){return '<div class="sl">'+h+'</div>'}).join('');
    $('rc-dots').innerHTML=sl.map(function(_,i){return '<button type="button" data-i="'+i+'" aria-label="Слайд '+(i+1)+'"></button>'}).join('');
    $('rc-next').disabled=mon?mAdd(rc.key,1)>nowM:addDays(new Date(rc.key),7).getTime()>monday(now).getTime();
    rcSlide(rc.i);
  }
  function rcSlide(i){
    rc.i=clamp(i,0,rc.n-1);
    $('rc-track').style.transform='translateX(-'+(rc.i*100)+'%)';
    [].forEach.call($('rc-dots').children,function(b,j){b.setAttribute('aria-current',j===rc.i)});
    $('rc-back').disabled=rc.i===0;$('rc-fwd').textContent=rc.i===rc.n-1?'Закрыть':'Дальше';
  }
  function openRecap(type,key){rc.type=type;rc.key=key;rc.i=0;$('recap').hidden=false;renderRecap()}
  function closeRecap(){$('recap').hidden=true;if(rcQueue.length){var q=rcQueue.shift();openRecap(q[0],q[1])}}
  $('rc-close').onclick=closeRecap;
  $('recap').addEventListener('click',function(e){if(e.target===$('recap'))closeRecap()});
  $('rc-back').onclick=function(){rcSlide(rc.i-1)};
  $('rc-fwd').onclick=function(){if(rc.i===rc.n-1)closeRecap();else rcSlide(rc.i+1)};
  $('rc-dots').addEventListener('click',function(e){var b=e.target.closest('button');if(b)rcSlide(+b.dataset.i)});
  $('rc-prev').onclick=function(){rc.key=rc.type==='month'?mAdd(rc.key,-1):addDays(new Date(rc.key),-7).getTime();rc.i=0;renderRecap()};
  $('rc-next').onclick=function(){rc.key=rc.type==='month'?mAdd(rc.key,1):addDays(new Date(rc.key),7).getTime();rc.i=0;renderRecap()};
  var sw=null;
  $('rc-view').addEventListener('pointerdown',function(e){sw={x:e.clientX,y:e.clientY}});
  $('rc-view').addEventListener('pointerup',function(e){if(!sw)return;var dx=e.clientX-sw.x,dy=e.clientY-sw.y;sw=null;if(Math.abs(dx)>50&&Math.abs(dx)>Math.abs(dy)*1.5)rcSlide(rc.i+(dx<0?1:-1))});
  /* при первом заходе в новом месяце или неделе показываем итог прошедшего периода */
  function checkRecaps(){
    if(!loaded||isDemo)return;
    var wk=dKey(monday(now)),q=[];
    if(seen.m&&seen.m<nowM){
      for(var k=seen.m;k<nowM;k=mAdd(k,1))if(!snap[k])snap[k]=clone(plans);
      q.push(['month',mAdd(nowM,-1)]);
    }
    if(seen.w&&seen.w<wk)q.push(['week',addDays(monday(now),-7).getTime()]);
    if(seen.m!==nowM||seen.w!==wk){seen={m:nowM,w:wk};persist('@set')}
    if(q.length&&$('recap').hidden){rcQueue=q.slice(1);openRecap(q[0][0],q[0][1])}
  }

  /* ---------- логотип: клик открывает список своих сайтов, двойной клик ведёт на главную ---------- */
  var menu=$('menu'),brand=$('brand'),brT=0,impAsk=false;
  function hostOf(u){try{return new URL(u).host.replace(/^www\./,'')}catch(_){return u}}
  function renderMenu(){
    var h='<div class="lab">Мои сайты</div>';
    h+=sites.length?'<ul class="sites">'+sites.map(function(x,i){return '<li><a href="'+esc(x.u)+'" target="_blank" rel="noopener">'+esc(x.n||hostOf(x.u))+'<small>'+esc(hostOf(x.u))+' ↗</small></a><button type="button" data-sx="'+i+'" aria-label="Убрать сайт" title="Убрать">×</button></li>'}).join('')+'</ul>'
      :'<p class="note">Пока пусто. Добавь сюда сайт со сделками и другие свои страницы.</p>';
    h+=siteForm?'<div class="hform"><input class="inp" id="st-n" maxlength="40" placeholder="Название, например: сделки"><input class="inp" id="st-u" type="url" placeholder="https://адрес сайта"><div class="row"><button type="button" class="btn" id="st-ok">Добавить</button><button type="button" class="btn ghost" id="st-no">Отмена</button></div></div>'
      :'<div><button type="button" class="btn ghost" id="st-add">+ Добавить сайт</button></div>';
    h+='<p class="note">Двойной клик по логотипу возвращает на главную.</p>';
    /* вне claude.ai данные лежат в этом браузере: даём сохранить и загрузить копию файлом */
    if(loaded&&!db)h+='<div class="lab">Данные</div><div class="row"><button type="button" class="btn ghost" id="dt-exp">Сохранить копию</button><button type="button" class="btn ghost" id="dt-imp">'+(impAsk?'Заменит всё. Выбрать файл':'Загрузить копию')+'</button></div><input type="file" id="dt-file" accept="application/json,.json" hidden><p class="note">Данные хранятся в этом браузере. Копия переносит их на другое устройство.</p>';
    menu.innerHTML=h;
  }
  function openMenu(v){impAsk=false;menu.hidden=!v;brand.setAttribute('aria-expanded',v);if(v)renderMenu();else siteForm=false}
  function addSite(){
    var n=$('st-n').value.trim(),u=$('st-u').value.trim();
    if(!u){toast('Вставь адрес сайта.');return}
    if(!/^https?:\/\//i.test(u))u='https://'+u;
    sites.push({n:n,u:u});siteForm=false;persist('@set');renderMenu();
  }
  brand.addEventListener('click',function(e){
    if(e.detail>1)return;
    var want=menu.hidden;clearTimeout(brT);
    brT=setTimeout(function(){openMenu(want)},e.detail===0?0:230);
  });
  brand.addEventListener('dblclick',function(){clearTimeout(brT);openMenu(false);curM=nowM;closePops();setTab('spheres')});
  menu.addEventListener('click',function(e){
    var b=e.target.closest('[data-sx]');
    if(b){sites.splice(+b.dataset.sx,1);persist('@set');renderMenu();return}
    if(e.target.id==='st-add'){siteForm=true;renderMenu();$('st-n').focus()}
    else if(e.target.id==='st-no'){siteForm=false;renderMenu()}
    else if(e.target.id==='st-ok')addSite();
    else if(e.target.id==='dt-exp'){
      var blob=new Blob([JSON.stringify({months:months,series:series,goals:goals,diary:diary,set:setBody()})],{type:'application/json'}),a=document.createElement('a');
      a.href=URL.createObjectURL(blob);a.download='koleso-zhizni-'+dKey(Date.now())+'.json';document.body.appendChild(a);a.click();a.remove();
    }
    else if(e.target.id==='dt-imp'){if(!impAsk){impAsk=true;renderMenu();return}impAsk=false;$('dt-file').click()}
  });
  menu.addEventListener('change',function(e){
    if(e.target.id!=='dt-file'||!e.target.files[0])return;
    var fr=new FileReader();
    fr.onload=function(){
      try{
        var raw=JSON.parse(fr.result);if(!raw||typeof raw!=='object'||!raw.set)throw 0;
        months=raw.months||{};series=raw.series||{};goals=raw.goals||{};diary=raw.diary||{};applySettings(raw.set);
        lsSave();openMenu(false);refresh();toast('Копия загружена.');
      }catch(_){toast('Не получилось прочитать файл. Нужна копия, сохранённая этим сайтом.')}
    };
    fr.readAsText(e.target.files[0]);
  });
  menu.addEventListener('keydown',function(e){if(e.key==='Enter'&&siteForm){e.preventDefault();addSite()}});
  document.addEventListener('pointerdown',function(e){if(!menu.hidden&&!$('brand-w').contains(e.target))openMenu(false)});

  /* ---------- общее ---------- */
  function renderTop(){
    $('m-label').textContent=mName(curM);
    $('mswitch').hidden=tab==='calendar'||tab==='goals'||tab==='diary';
    $('demo-pill').hidden=!isDemo||tab==='goals'||tab==='diary';
    $('sync-pill').textContent=loaded?'Сверено '+hm(syncAt)+' · след. '+hm(nextSync):'Загрузка…';
  }
  function renderAll(){
    renderTop();
    if(tab==='spheres')renderSpheres();else if(tab==='calendar')renderCalendar();else if(tab==='habits'){if(!typingIn(hv))renderHabits()}else if(tab==='goals')renderGoals();else if(tab==='diary')renderDiary();else renderReport();
    if(hpopDay!=null)renderHpop();
    if(!$('recap').hidden)renderRecap();
  }
  function refresh(){rebuild();renderAll()}
  function setTab(t){
    tab=t;
    ['spheres','calendar','habits','goals','diary','report'].forEach(function(x){$('view-'+x).hidden=x!==t});
    [].forEach.call(document.querySelectorAll('.tabs button'),function(b){b.setAttribute('aria-selected',b.dataset.tab===t)});
    renderTop();
    if(t==='calendar')renderCalendar(true);else if(t==='goals')renderGoals(true);else if(t==='diary')renderDiary(true);else renderAll();
    if(t==='spheres'){measure();place()}
  }
  document.querySelector('.tabs').addEventListener('click',function(e){var b=e.target.closest('button');if(b)setTab(b.dataset.tab)});
  $('m-prev').onclick=function(){curM=mAdd(curM,-1);renderAll()};
  $('m-next').onclick=function(){curM=mAdd(curM,1);renderAll()};
  $('demo-pill').onclick=function(){hideDemo=true;persist('@set');refresh()};

  document.addEventListener('keydown',function(e){
    var tgt=e.target,typing=tgt&&/^(INPUT|SELECT|TEXTAREA)$/.test(tgt.tagName);
    if(!$('recap').hidden){
      if(e.key==='Escape')closeRecap();else if(e.key==='ArrowRight')rcSlide(rc.i+1);else if(e.key==='ArrowLeft')rcSlide(rc.i-1);
      return;
    }
    if(e.key==='Escape'&&!menu.hidden){openMenu(false);return}
    if(e.key==='Escape'&&(cur||hpopDay!=null)){closePops();return}
    if(typing||e.metaKey||e.ctrlKey||e.altKey)return;
    if(cur){if((e.key==='Backspace'||e.key==='Delete')&&cur.kind!=='new')deleteCur();return}
    if(tab!=='calendar'||hpopDay!=null)return;
    var k=e.key.toLowerCase();
    if(k==='t'||k==='е')goToday();
    else if(k==='d'||k==='в')setView('days',1);
    else if(k==='w'||k==='ц')setView('week');
    else if(k==='m'||k==='ь')setView('month');
    else if(k==='c'||k==='с')newEvent(null,null,lastSphere);
    else if(k==='arrowleft'||k==='k'||k==='л')navCal(-1);
    else if(k==='arrowright'||k==='j'||k==='о')navCal(1);
    else if(/^[1-9]$/.test(k))setView('days',+k);
    else return;
    e.preventDefault();
  });

  /* сверка раз в 15 минут: по границам :00 :15 :30 :45 */
  function sync(){now=new Date();nowM=mk(now);syncAt=Date.now();nextSync=Math.floor(syncAt/9e5)*9e5+9e5;refresh();checkRecaps()}
  $('sync-pill').onclick=sync;
  setInterval(function(){
    if(Date.now()>=nextSync)sync();
    else if(tab==='calendar'&&!cur&&!busy&&hpopDay==null)renderCalendar();
  },60000);
  document.addEventListener('visibilitychange',function(){if(!document.hidden&&Date.now()>=nextSync)sync()});
  var rsT;window.addEventListener('resize',function(){measure();place();clearTimeout(rsT);rsT=setTimeout(function(){if(tab==='calendar')renderCalendar(true)},120)});

  nextSync=Math.floor(syncAt/9e5)*9e5+9e5;
  measure();refresh();boot();
  if(document.fonts&&document.fonts.ready)document.fonts.ready.then(function(){measure();place()});
})();
</script>

</body>
